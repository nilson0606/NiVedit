    bind('sSize','input', v => { st.size = +v; setVal('sSize', v + ' px'); show(); });
    bind('sColor','input', v => { st.color = v; show(); });
    bind('sStroke','input', v => { st.stroke = v; show(); });
    bind('sStrokeW','input', v => { st.strokeW = +v; setVal('sStrokeW', v); show(); });
    bind('sBold','change', (_, el) => { st.bold = el.checked; show(); });
    bind('sShadow','change', (_, el) => { st.shadow = el.checked; show(); });
    bind('sBox','change', (_, el) => { st.box = el.checked; styleChanged(); refreshProp(); });
    bind('sBoxColor','input', v => { st.boxColor = v; show(); });
    bind('sBoxOpa','input', v => { st.boxOpacity = +v; setVal('sBoxOpa', (+v).toFixed(2)); show(); });
    bind('sPos','change', v => { st.pos = v; show(); });
    bind('sMargin','input', v => { st.marginY = +v; setVal('sMargin', (+v).toFixed(3)); show(); });
    bind('sMaxW','input', v => { st.maxW = +v; setVal('sMaxW', (+v).toFixed(2)); show(); });
    on('sShiftM', () => shiftSubs(-0.5));
    on('sShiftP', () => shiftSubs(+0.5));
    on('sImport', () => $('#fileSub').click());
    on('sExport', exportSRT);
    on('sClear', () => { if (confirm(`確定要刪掉全部 ${A.subs.length} 句字幕？`)){ pushUndo(); A.subs = []; A.sel = {type:'proj'}; render(); refreshProp(); } });
    on('sDel', () => { A.sel = { type:'sub', id:c.id }; delSelected(); });

  } else if (s.type === 'overlay'){
    const o = A.overlays.find(x => x.id === s.id);
    if (!o){ A.sel = { type:'proj' }; return refreshProp(); }
    $('#propTitle').textContent = '疊圖';
    const shownW = Math.round(o.scale * A.proj.w);
    p.innerHTML =
      `<div class="grp"><h4 data-nt>${esc(o.name)}</h4>
        <div class="hint">原始尺寸 ${o.w}×${o.h}　畫面上約 ${shownW}px 寬</div>
        ${o._gif ? '<div class="hint">GIF 動畫會循環播放至疊圖結束，預覽與匯出同步。</div>' : ''}</div>
       <div class="grp"><h4>時間</h4>
        ${rowNum('oStart','出現', o.start, 0.1, '<button class="gh" id="oStartNow" style="padding:5px 8px">現在</button>')}
        ${rowNum('oEnd','消失', o.end, 0.1, '<button class="gh" id="oEndNow" style="padding:5px 8px">現在</button>')}
        <div class="hint">方塊也可以直接在「疊圖」軌上拖，兩端拉長縮短。</div></div>
       <div class="grp"><h4>${kfOn(o) ? '位置與大小（起點）' : '位置與大小'}</h4>
        <div class="row"><label>快速對位</label><div class="f"><div class="nine" id="onine">
          <button data-p="0.12,0.15">↖</button><button data-p="0.5,0.15">↑</button><button data-p="0.88,0.15">↗</button>
          <button data-p="0.12,0.5">←</button><button data-p="0.5,0.5">●</button><button data-p="0.88,0.5">→</button>
          <button data-p="0.12,0.85">↙</button><button data-p="0.5,0.85">↓</button><button data-p="0.88,0.85">↘</button>
        </div></div></div>
        ${rowRange('oX','水平',0,1,0.01,o.x,'')}
        ${rowRange('oY','垂直',0,1,0.01,o.y,'')}
        ${rowRange('oScale','大小',0.02,1.5,0.01,o.scale,'')}
        ${rowRange('oRot','旋轉',-360,360,1,o.rot,'°')}</div>
       <div class="grp"><h4>${kfOn(o) ? '透明與淡入淡出（起點）' : '透明與淡入淡出'}</h4>
        ${rowRange('oOpa','不透明度',0,1,0.02,o.opacity,'')}
        ${rowRange('oFi','淡入',0,5,0.1,o.fadeIn,' 秒')}
        ${rowRange('oFo','淡出',0,5,0.1,o.fadeOut,' 秒')}</div>
       ${kfGroup(o, 'o', [
          ['x','水平',0,1,0.01,o.x,''],
          ['y','垂直',0,1,0.01,o.y,''],
          ['scale','大小',0.02,1.5,0.01,o.scale,''],
          ['opacity','不透明度',0,1,0.02,o.opacity,''],
          ['rot','旋轉',-360,360,1,o.rot||0,'°'],
         ],
         '這一段時間內從上面的起點平滑走到這裡的終點。淡入淡出與圖層順序照舊。')}
       <button id="oDel" style="width:100%">移除這張疊圖</button>`;
    const show = () => { if (A.playhead < o.start || A.playhead > o.end) seekTo(o.start + Math.min(0.4, (o.end-o.start)/2)); };
    bind('oStart','input', v => {
      const ns = clamp(+v, 0, o.end - 0.2);
      if (o._gif) o.gifOffset = (o.gifOffset || 0) + ns - o.start;
      o.start = ns; renderTimeline();
    });
    bind('oEnd','input',   v => { o.end = Math.max(o.start + 0.2, +v); renderTimeline(); });
    on('oStartNow', () => { const len = o.end - o.start; o.start = A.playhead; o.end = o.start + len; render(); refreshProp(); });
    on('oEndNow',   () => { o.end = Math.max(o.start + 0.2, A.playhead); render(); refreshProp(); });
    bind('oX','input', v => { o.x = +v; setVal('oX', (+v).toFixed(2)); show(); });
    bind('oY','input', v => { o.y = +v; setVal('oY', (+v).toFixed(2)); show(); });
    bind('oScale','input', v => { o.scale = +v; setVal('oScale', (+v).toFixed(2)); show(); });
    bind('oRot','input', v => { o.rot = +v; setVal('oRot', v + '°'); show(); });
    bind('oOpa','input', v => { o.opacity = +v; setVal('oOpa', (+v).toFixed(2)); show(); });
    bind('oFi','input', v => { o.fadeIn = +v;  setVal('oFi', (+v).toFixed(1) + ' 秒'); });
    bind('oFo','input', v => { o.fadeOut = +v; setVal('oFo', (+v).toFixed(1) + ' 秒'); });
    kfBind(o, 'o', [['x','',0,1,0.01,o.x,''],['y','',0,1,0.01,o.y,''],
                    ['scale','',0.02,1.5,0.01,o.scale,''],['opacity','',0,1,0.02,o.opacity,''],
                    ['rot','',-360,360,1,o.rot||0,'°']], show);
    $$('#onine button').forEach(b => b.onclick = () => {
      const [x, y] = b.dataset.p.split(',').map(Number);
      pushUndo();
      kfAlign(o, 'x', x); kfAlign(o, 'y', y);
      show(); markDirty(); refreshProp();
    });
    p.insertAdjacentHTML('beforeend',
      `<div class="grp" style="margin-top:12px"><h4>圖層順序（誰蓋在誰上面）</h4>
        <div class="row"><div class="f" style="gap:6px">
          <button id="oUp" style="flex:1">往上一層</button>
          <button id="oDn" style="flex:1">往下一層</button></div></div>
        <div class="hint">目前第 ${A.overlays.indexOf(o)+1} / ${A.overlays.length} 層，數字越大越前面。疊圖永遠在影片之上、標題之下。</div></div>`);
    on('oUp', () => moveLayer(A.overlays, o, +1));
    on('oDn', () => moveLayer(A.overlays, o, -1));
    on('oDel', () => { A.sel = { type:'overlay', id:o.id }; delSelected(); });

  } else if (s.type === 'music'){
    const m = A.musics.find(x => x.id === s.id);
    if (!m){ A.sel = { type:'proj' }; return refreshProp(); }
    const mi = A.musics.indexOf(m);
    $('#propTitle').textContent = `音軌 ${mi + 1}`;
    const seg = musicSeg(m);
    const reps = m.loop ? Math.max(1, Math.ceil((m.len - m.xfade) / Math.max(0.2, seg - m.xfade))) : 1;
    p.innerHTML =
      `<div class="grp"><h4 data-nt>${esc(m.name)}</h4>
        <div class="hint">音檔長度 ${fmt(m.dur)}　影片長度 ${fmt(totalDur())}</div></div>
       <div class="grp"><h4>位置與長度</h4>
        ${rowNum('mStart','從第幾秒進來', m.startAt, 0.5,
                 '<button class="gh" id="mStartNow" style="padding:5px 8px">現在</button>')}
        ${rowNum('mLen','播多久', m.len, 0.5,
                 '<button class="gh" id="mLenEnd" style="padding:5px 8px">到底</button>')}
        ${rowNum('mOff','從音檔第幾秒取用', m.offset, 0.5, '')}
        <div class="hint">方塊在時間軸上：中間拖曳＝移動，兩端拖曳＝裁切長度。</div></div>
       <div class="grp"><h4>不夠長的時候</h4>
        <div class="row"><label>循環填滿</label><div class="f">
          <input type="checkbox" id="mLoop"${m.loop ? ' checked' : ''}>
          <span class="hint">不夠長就自動重播</span></div></div>
        ${rowRange('mXf','接縫淡化',0,3,0.1,m.xfade,' 秒')}
        <div class="hint">${m.loop
            ? (reps > 1 ? `目前循環 ${reps} 輪蓋滿 ${fmt(m.len)}` : '音檔夠長，播一輪就好')
            : (m.len > seg + 0.3 ? `⚠ 音檔只有 ${fmt(seg)}，後面 ${fmt(m.len - seg)} 沒有聲音` : '長度足夠')}
        </div></div>
       <div class="grp"><h4>音量</h4>
        ${rowRange('mVol','音量',0,1.5,0.05,m.vol,'')}
        ${rowRange('mFi','淡入',0,10,0.1,m.fadeIn,' 秒')}
        ${rowRange('mFo','淡出',0,10,0.1,m.fadeOut,' 秒')}
        <div class="hint">想讓某段只剩配樂，把那段影片設成「原聲靜音」。多條音軌會直接疊加。</div></div>
       <div class="grp volume-curve-help"><h4>音量曲線</h4>
        <div class="row"><div class="f" style="gap:6px">
          <button class="gh" id="mVkAdd" style="flex:1">在播放頭加一點</button>
          <button class="gh" id="mVkClr"${(m.vk && m.vk.length) ? '' : ' disabled'}>清除曲線</button>
        </div></div>
        ${(m.vk && m.vk.length)
          ? `<div class="hint">目前 ${m.vk.length} 個音量點。直接在時間軸的音軌方塊上拖圓點改高低，
             右鍵刪點，雙擊空白處加點。</div>`
          : '<div class="hint">還沒有音量點 —— 在時間軸的音軌方塊上雙擊就會加一個。</div>'}
        <div class="hint">曲線是「倍率」，最後乘在上面的音量上。講話的地方壓低、講完拉回來，
         就是一般說的 ducking。預覽與匯出用的是同一條曲線。</div></div>
       <div class="grp"><h4>排序</h4>
        <div class="row"><div class="f" style="gap:6px">
          <button id="mUp" style="flex:1">往前一條</button>
          <button id="mDn" style="flex:1">往後一條</button></div></div>
        <div class="hint">音軌是直接疊加混音，順序不影響聲音，只是列表上的編號。</div></div>
       <button id="mDel" style="width:100%">移除這條音軌</button>`;
    bind('mLoop','change', (_, el) => { m.loop = el.checked; render(); refreshProp(); });
    bind('mXf','input', v => { m.xfade = +v; setVal('mXf', (+v).toFixed(1) + ' 秒'); renderTimeline(); });
    bind('mStart','input', v => { m.startAt = clamp(+v, 0, Math.max(0, totalDur() - 0.3)); render(); });
    bind('mLen','input', v => { m.len = clamp(+v, 0.3, Math.max(0.3, totalDur() - m.startAt)); m.autoLen = false; render(); });
    on('mStartNow', () => { m.startAt = clamp(A.playhead, 0, Math.max(0, totalDur() - 0.3)); render(); refreshProp(); });
    on('mLenEnd', () => { m.len = Math.max(0.3, totalDur() - m.startAt); m.autoLen = true; render(); refreshProp(); });
    bind('mOff','input', v => { m.offset = clamp(+v, 0, Math.max(0, m.dur - 0.5)); render(); refreshProp(); });
    bind('mVol','input', v => { m.vol = +v; setVal('mVol', (+v).toFixed(2)); });
    on('mVkAdd', () => {
      const t = A.playhead - m.startAt;
      if (t < -0.01 || t > m.len + 0.01) return toast('播放頭不在這條音軌上', true);
      pushUndo();
      vkAdd(m, clamp(t, 0, m.len), musicGainAt(m, A.playhead));
      render(); refreshProp(); markDirty(300);
    });
    on('mVkClr', () => { pushUndo(); m.vk = []; render(); refreshProp(); markDirty(300);
                         toast('音量曲線已清除'); });
    bind('mFi','input',  v => { m.fadeIn = +v;  setVal('mFi', (+v).toFixed(1) + ' 秒'); });
    bind('mFo','input',  v => { m.fadeOut = +v; setVal('mFo', (+v).toFixed(1) + ' 秒'); });
    on('mUp', () => moveLayer(A.musics, m, -1));
    on('mDn', () => moveLayer(A.musics, m, +1));
    on('mDel', () => { A.sel = { type:'music', id:m.id }; delSelected(); });

  } else {
    $('#propTitle').textContent = '專案設定';
    const res = ASPECTS[A.proj.aspect];
    p.innerHTML =
      `<div class="grp"><h4>畫面比例</h4>
        <div class="chips" id="aspChips">
          ${Object.keys(ASPECTS).map(a => `<div class="chip${a === A.proj.aspect ? ' on' : ''}" data-a="${a}">${a}</div>`).join('')}
        </div></div>
       <div class="grp"><h4>輸出</h4>
        ${rowSel('pRes','解析度', res.map(r => [r[0] + 'x' + r[1], `${r[2]}（${r[0]}×${r[1]}）`]), A.proj.w + 'x' + A.proj.h)}
        ${rowSel('pFps','影格率', [[24,'24 fps'],[25,'25 fps'],[30,'30 fps'],[60,'60 fps']], A.proj.fps)}
        ${rowRange('pBr','位元率',2,40,1,A.proj.bitrate,' Mbps')}
        ${rowSel('pFit','畫面填滿', [['contain','完整顯示（留黑邊）'],['cover','裁切填滿']], A.proj.fit)}</div>
       <div class="grp"><h4>診斷</h4>
        ${rowBtn('pDiag','📋 複製診斷資訊')}
        <div class="hint">匯出或畫面有問題時按這個，會把每一段實際走哪條路、
        判到幾度、有沒有問題整理成文字複製起來。</div></div>
       <div class="grp"><h4>說明</h4>
        <div class="hint">選取左邊的片段、時間軸上的標題或配樂，這裡就會切換成對應的設定。<br><br>
        快捷鍵：空白鍵播放／暫停、Delete 刪除選取、← → 移動一格、Home / End 跳頭尾。</div></div>`;
    $$('#aspChips .chip').forEach(ch => ch.onclick = () => {
      A.proj.aspect = ch.dataset.a;
      const r = ASPECTS[A.proj.aspect][0];
      A.proj.w = r[0]; A.proj.h = r[1];
      render(); refreshProp();
    });
    bind('pRes','change', v => { const [w,h] = v.split('x').map(Number); A.proj.w = w; A.proj.h = h; render(); });
    bind('pFps','change', v => A.proj.fps = +v);
    bind('pBr','input', v => { A.proj.bitrate = +v; setVal('pBr', v + ' Mbps'); });
    bind('pFit','change', v => { A.proj.fit = v; });
    on('pDiag', async () => {
      const btn = $('#pDiag'); if (btn){ btn.disabled = true; btn.textContent = '檢查中…'; }
      let txt = '';
      try { txt = await diagReport(); } catch(e){ txt = '診斷失敗：' + (e && e.message || e); }
      if (btn){ btn.disabled = false; btn.textContent = '📋 複製診斷資訊'; }
      try { await navigator.clipboard.writeText(txt); toast('已複製，可以直接貼上'); }
      catch(e){
        // 沒有剪貼簿權限就顯示出來讓使用者自己選取
        await asrAsk('診斷資訊', `<pre style="white-space:pre-wrap;font-size:11px;max-height:50vh;
          overflow:auto;user-select:text;margin:0">${esc(txt)}</pre>`, [{ k:'ok', label:'關閉', pri:true }]);
      }
      console.log(txt);
    });
  }
}
function bind(id, ev, fn){ const el = $('#' + id); if (el) el.addEventListener(ev, e => fn(el.value, el)); }
function on(id, fn){ const el = $('#' + id); if (el) el.addEventListener('click', fn); }
function setVal(id, v){ const el = $('#' + id + '_v'); if (el) el.textContent = v; }

/* ── 事件綁定 ──────────────────────────────────────────────── */
function initUI(){
  $('#drop').onclick = () => $('#fileAny').click();
  $('#fileAny').onchange = e => { addAnyFiles(e.target.files); e.target.value = ''; };
  $('#fileVideo').onchange = e => { addVideoFiles(e.target.files); e.target.value = ''; };
  $('#fileAudio').onchange = async e => {
    for (const f of [...e.target.files]) await addMusicFile(f);
    e.target.value = '';
  };

  // 時間軸區塊可以上下拉高，放得下更多軌道
  $('#tlgrip').addEventListener('mousedown', e => {
    e.preventDefault();
    const y0 = e.clientY, h0 = $('#tl').offsetHeight;
    const mv = ev => {
      $('#tl').style.height = clamp(h0 - (ev.clientY - y0), 140, window.innerHeight - 260) + 'px';
      renderTimeline(); sizePreview();          // 預覽區高度變了，畫布也要重配
    };
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });
  $('#btnAddMusic').onclick = () => $('#fileAudio').click();
  $('#btnAddImage').onclick = () => { if (!A.clips.length && !confirm('目前還沒有影片，要直接用圖片開始嗎？')) return; $('#fileImage').click(); };
  $('#btnAddOverlay').onclick = () => { if (!A.clips.length) return toast('先加入影片或圖片，再放疊圖', true); $('#fileOverlay').click(); };
  $('#fileImage').onchange = e => { addImageFiles(e.target.files); e.target.value = ''; };
  $('#fileOverlay').onchange = e => { addOverlayFiles(e.target.files); e.target.value = ''; };
  $('#btnAddSub').onclick = () => { if (!A.clips.length) return toast('先加入影片再放字幕', true); $('#fileSub').click(); };
  $('#fileSub').onchange = async e => { for (const f of [...e.target.files]) await importSRT(f); e.target.value = ''; };
  /* 右鍵刪點綁在「軌道」上，方塊每次重畫都是新節點，綁方塊會掉。
     連點兩下加點則由 startMusicDrag 自己判，原因見那邊的註解。 */
  $('#trkMusic').addEventListener('contextmenu', e => {
    const box = e.target.closest && e.target.closest('.mblk');
    if (!box) return;
    const m = A.musics.find(x => x.id === box.dataset.mid);
    if (m) vkDelAtEvent(e, m);
  });
  $('#trkVideo').addEventListener('dblclick', e => {
    if (!e.target.closest('.subtitleLane') || e.target.closest('.sblk')) return;
    if (!A.clips.length) return toast('先加入影片再放字幕', true);
    const r = $('#tlinner').getBoundingClientRect();
    addSub((e.clientX - r.left) / A.pps,+(e.target.closest('.subtitleLane')?.dataset.track||0));
  });
  $('#btnAddTitle').onclick = () => { if (!A.clips.length) return toast('先加入影片再放標題', true); addTitle(); };
  $('#btnProj').onclick = () => { A.sel = { type:'proj', id:null }; render(); refreshProp(); };
  $('#btnDel').onclick = delSelected;
  $('#btnSplit').onclick = splitAtPlayhead;
  $('#playBtn').onclick = () => { if (!A.clips.length) return; setPlaying(!A.playing); };
  $('#btnStart').onclick = () => seekTo(0);
  $('#btnEnd').onclick = () => seekTo(totalDur());
  $('#btnExport').onclick = () => startExport();
  $('#btnFit').onclick = fitZoom;
  // 「完成」以前只在匯出流程裡綁，專案儲存完就關不掉了
  $('#mClose').onclick = () => $('#mask').classList.remove('on');
  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  // 屬性面板上任何一次「開始操作」都先記一個復原點（內容沒變就不會重複記）
  $('#prop').addEventListener('pointerdown', pushUndo, true);
  $('#prop').addEventListener('keydown', e => { if (!e.ctrlKey && !e.metaKey) pushUndo(); }, true);
  // 屬性面板上任何一個控制項動了都重畫，免得漏掉某個沒呼叫 render() 的路徑
  $('#prop').addEventListener('input',  () => markDirty(300), true);
  $('#prop').addEventListener('change', () => markDirty(300), true);
  $('#zoom').oninput = e => { A.pps = +e.target.value; renderTimeline(); followPlayhead(true); };

  // 預覽下方的總進度條：不管時間軸縮放多少，都能直接跳到結尾
  const sb = $('#seekBar');
  sb.addEventListener('pointerdown', () => sb._dragging = true);
  sb.addEventListener('pointerup',   () => sb._dragging = false);
  sb.addEventListener('input', () => { const tot = totalDur(); if (tot > 0) seekTo(+sb.value / 1000 * tot); });

  // 時間軸：滾輪左右捲動、Ctrl＋滾輪縮放
  $('#tlwrap').addEventListener('wheel', e => {
    const wrap = $('#tlwrap');
    if (e.ctrlKey || e.metaKey){
      e.preventDefault();
      const r = $('#tlinner').getBoundingClientRect();
      const tAt = (e.clientX - r.left) / A.pps;
      A.pps = clamp(A.pps * (e.deltaY < 0 ? 1.18 : 1 / 1.18), 2, 400);
      $('#zoom').value = A.pps;
      renderTimeline();
      wrap.scrollLeft = Math.max(0, tAt * A.pps - (e.clientX - wrap.getBoundingClientRect().left));
    } else {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (d){ e.preventDefault(); wrap.scrollLeft += d; }
    }
  }, { passive:false });

  ['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); if (e.dataTransfer.types.includes('Files')) $('#drop').classList.add('on');
  }));
  ['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
    e.preventDefault(); $('#drop').classList.remove('on');
  }));
  document.addEventListener('drop', async e => {
    await addAnyFiles(e.dataTransfer.files);        // 跟左側點擊走同一條路
  });

  // 時間軸空白處按下即可拖曳播放頭（不只刻度尺那一條）
  const scrub = e => {
    const r = $('#tlinner').getBoundingClientRect();
    seekTo((e.clientX - r.left) / A.pps);
  };
  // 在標題軌雙擊空白處 = 在那個時間點新增標題
  $('#trkTitle').addEventListener('dblclick', e => {
    if (e.target.closest('.tblk')) return;
    if (!A.clips.length) return toast('先加入影片再放標題', true);
    const r = $('#tlinner').getBoundingClientRect();
    addTitle((e.clientX - r.left) / A.pps);
  });

  $('#tlinner').addEventListener('mousedown', e => {
    if (e.target.closest('.blk,.tblk,.mblk,.sblk,.oblk')) return;
    scrub(e);
    const mv = ev => scrub(ev);
    const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });

  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (A.exporting) return;
    if ($('#gmask').classList.contains('on')){        // 預覽選單開著時，鍵盤先給它
      if (e.key === 'Escape') closePicker();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault(); return e.shiftKey ? redo() : undo();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); return redo(); }
    if (e.ctrlKey || e.metaKey) return;
    if (e.code === 'Space'){ e.preventDefault(); if (A.clips.length) setPlaying(!A.playing); }
    if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); delSelected(); }
    if (e.key === 's' || e.key === 'S'){ e.preventDefault(); splitAtPlayhead(); }
    if (e.key === 'ArrowLeft')  seekTo(A.playhead - 1 / A.proj.fps);
    if (e.key === 'ArrowRight') seekTo(A.playhead + 1 / A.proj.fps);
    if (e.key === 'Home') seekTo(0);
    if (e.key === 'End')  seekTo(totalDur());
  });

  window.addEventListener('resize', () => { renderTimeline(); sizePreview(); fixInnerWidth(); });
  window.addEventListener('beforeunload', e => {
    if (A.exporting){ e.preventDefault(); e.returnValue = ''; }
  });
  checkSupport(); updateUndoBtns(); initProject(); sizePreview(); applyTrackOrder(true);
  if (typeof initASR === 'function') initASR();
  if (typeof i18nInit === 'function') i18nInit();
  if (typeof themeInit === 'function') themeInit();
  render(); refreshProp(); requestAnimationFrame(loop);
}

function checkSupport(){
  const b = $('#envBadge');
  $('#verTag').textContent = VER;
  $('#verDate').textContent = VER_DATE;
  if (typeof VideoEncoder === 'undefined'){
    b.textContent = '⚠ 此瀏覽器不支援 WebCodecs，無法匯出（請用 Chrome / Edge）';
    b.style.color = 'var(--error-text)'; b.style.borderColor = 'var(--danger)';
    $('#btnExport').disabled = true;
  } else {
    b.textContent = 'WebCodecs 就緒 · 影片不會離開這台電腦';
    b.style.color = 'var(--ok)'; b.style.borderColor = 'var(--ok-line)';
  }
}

/* ══════════════════════════════════════════════════════════════
   預覽選單：轉場與標題動畫都用這個，格子裡是會動的縮圖
   ══════════════════════════════════════════════════════════════ */
let _gRaf = null, _gCells = [], _gKind = 'trans', _gClip = null;

/** 縮圖用的示意畫面：A 冷色、B 暖色，加斜紋才看得出位移方向 */
function demoPaint(ctx, ref, W, H){
  const g = ctx.createLinearGradient(0, 0, W, H);
  if (ref === 0){ g.addColorStop(0, '#4a7fbf'); g.addColorStop(1, '#122238'); }
  else          { g.addColorStop(0, '#e8a33d'); g.addColorStop(1, '#4a2410'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#fff';
  for (let i = -H; i < W; i += Math.max(8, W / 9))
    { ctx.beginPath(); ctx.moveTo(i, H); ctx.lineTo(i + H * 0.5, 0);
      ctx.lineTo(i + H * 0.5 + W / 26, 0); ctx.lineTo(i + W / 26, H); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.font = `700 ${Math.round(H * 0.46)}px Arial,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ref === 0 ? 'A' : 'B', W / 2, H / 2);
}

const _demoTitle = {
  text: '標題ABC', font: FONTS[0].id, size: 200, color: '#ffffff',
  stroke: '#000000', strokeW: 0, bold: true, shadow: true,
  x: 0.5, y: 0.5, align: 'center', start: 0, end: 4,
  animIn: 'fade', animDur: 0.85, animOut: 'none', animOutDur: 0.3
};

function openPicker(kind, cur, onPick, clip){
  _gKind = kind;
  _gClip = clip || null;
  const items = kind === 'trans' ? TRANSITIONS : kind === 'grade' ? GRADE_PRESETS : ANIMS;
  $('#gTitle').textContent =
    kind === 'trans' ? `轉場（共 ${TRANSITIONS.length - 1} 種）` :
    kind === 'grade' ? `畫面風格（共 ${GRADE_PRESETS.length - 1} 組，用你目前這一格畫面預覽）` :
                       `標題進場動畫（共 ${ANIMS.length - 1} 種）`;
  const groups = [];
  items.forEach(o => { if (groups.indexOf(o.g) < 0) groups.push(o.g); });

  let filter = '__all';
  const tabs = $('#gTabs');
  const grid = $('#gGrid');

  const paintTabs = () => {
    tabs.innerHTML = [['__all', '全部']].concat(groups.map(g => [g, g]))
      .map(([id, nm]) => `<div class="chip${id === filter ? ' on' : ''}" data-g="${esc(id)}">${esc(nm)}</div>`).join('');
    tabs.querySelectorAll('.chip').forEach(c => c.onclick = () => { filter = c.dataset.g; paintTabs(); build(); });
  };

  const build = () => {
    _gCells = [];
    const list = items.filter(o => filter === '__all' || o.g === filter);
    grid.innerHTML = list.map(o =>
      `<div class="gcell${o.id === cur ? ' on' : ''}" data-id="${esc(o.id)}">
         <canvas width="176" height="99"></canvas><div class="gn">${esc(o.name)}</div></div>`).join('');
    grid.querySelectorAll('.gcell').forEach(el => {
      _gCells.push({ id: el.dataset.id, ctx: el.querySelector('canvas').getContext('2d') });
      el.onclick = () => {
        grid.querySelectorAll('.gcell').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        cur = el.dataset.id;
        onPick(el.dataset.id);
      };
    });
    if (_gKind === 'grade') paintGradeCells();
  };

  paintTabs(); build();
  $('#gmask').classList.add('on');
  if (kind === 'grade') paintGradeCells();
  $('#gClose').onclick = closePicker;
  $('#gmask').onclick = e => { if (e.target.id === 'gmask') closePicker(); };
  if (!_gRaf) _gRaf = requestAnimationFrame(gTick);
}

function closePicker(){
  $('#gmask').classList.remove('on');
  _gCells = [];
  if (_gRaf){ cancelAnimationFrame(_gRaf); _gRaf = null; }
}

function gTick(){
  _gRaf = requestAnimationFrame(gTick);
  if (!_gCells.length) return;
  const CYC = 1900;                                  // 一輪 1.9 秒：跑完停一下再重來
  const u = (performance.now() % CYC) / CYC;
  if (_gKind === 'grade') return;              // 風格縮圖是靜態的，不用每幀重畫
  for (const c of _gCells){
    const ctx = c.ctx, W = ctx.canvas.width, H = ctx.canvas.height;
    if (_gKind === 'trans'){
      const p = clamp(u / 0.62, 0, 1);
      drawTransition(ctx, c.id, p, 0, 1, W, H, { paint: demoPaint, key: 'thumb' });
    } else {
      ctx.fillStyle = '#14181f'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#232b38'); g.addColorStop(1, '#10141b');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      _demoTitle.animIn = c.id;
      drawTitle(ctx, _demoTitle, u * 1.5, W, H);     // 動畫 0.85 秒＋停 0.65 秒，大半時間都在動
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   畫面調整面板（Stage 2 · E）
   每一段影片／圖片各自獨立；改完馬上在預覽看到。
   ══════════════════════════════════════════════════════════════ */
const gradeRow = (id, label, val, left, right) =>
  `<div class="row"><label>${label}</label><div class="f">
     <input type="range" id="${id}" min="-100" max="100" step="1" value="${val|0}">
     <span class="val" id="${id}_v">${val > 0 ? '+' + (val|0) : (val|0)}</span></div>
   </div><div class="hint" style="margin:-4px 0 8px 82px;font-size:10px">${left} ←→ ${right}</div>`;

function gradePanel(c){
  const g = Object.assign({}, GRADE0, c.grade || {});
  return `<div class="grp"><h4>畫面風格（這一段）</h4>
     ${rowSelG('gPreset','風格', GRADE_PRESETS, g.preset || 'none')}
     ${rowBtn('gPick','▦ 看預覽挑風格（' + (GRADE_PRESETS.length - 1) + ' 組）')}
     <div class="hint">套用預設之後，下面每一項都還可以自己再調。</div>
    </div>
    <div class="grp">
     ${gradeRow('gBri','亮度',  g.bri,  '暗', '亮')}
     ${gradeRow('gCon','對比',  g.con,  '平', '硬')}
     ${gradeRow('gSat','飽和',  g.sat,  '黑白', '鮮豔')}
     ${gradeRow('gTemp','色溫', g.temp, '冷（藍）', '暖（橘）')}
     ${gradeRow('gTint','色調', g.tint, '綠', '洋紅')}
     ${gradeRow('gShp','銳利',  g.sharp,'柔化', '銳利')}
     <div class="row"><label>質感</label><div class="f">
       <button class="gh" id="gMore" style="flex:1">${A._gradeMore ? '收起' : '褪色 · 暗角 · 顆粒 · 光暈'}</button></div></div>
     ${A._gradeMore ? `
       <div class="row"><label>褪色</label><div class="f">
         <input type="range" id="gFade" min="0" max="100" step="1" value="${g.fade|0}">
         <span class="val" id="gFade_v">${g.fade|0}</span></div></div>
       <div class="hint" style="margin:-4px 0 8px 82px;font-size:10px">黑色不再是全黑，底片那種霧面感</div>
       <div class="row"><label>暗角</label><div class="f">
         <input type="range" id="gVig" min="0" max="100" step="1" value="${g.vig|0}">
         <span class="val" id="gVig_v">${g.vig|0}</span></div></div>
       <div class="row"><label>顆粒</label><div class="f">
         <input type="range" id="gGrain" min="0" max="100" step="1" value="${g.grain|0}">
         <span class="val" id="gGrain_v">${g.grain|0}</span></div></div>
       <div class="row"><label>光暈</label><div class="f">
         <input type="range" id="gBloom" min="0" max="100" step="1" value="${g.bloom|0}">
         <span class="val" id="gBloom_v">${g.bloom|0}</span></div></div>
       <div class="row"><label>復古黃</label><div class="f">
         <input type="range" id="gSepia" min="0" max="100" step="1" value="${g.sepia|0}">
         <span class="val" id="gSepia_v">${g.sepia|0}</span></div></div>` : ''}
     ${(g.sharp > 0 || g.bloom > 0)
        ? `<div class="hint" style="margin:-2px 0 8px">⚠ ${[g.sharp > 0 ? '銳利' : '', g.bloom > 0 ? '光暈' : ''].filter(Boolean).join('、')}
           要額外多跑一輪模糊，1080p 匯出會明顯變慢。其他項目幾乎不影響速度。</div>` : ''}
     <div class="row"><div class="f" style="gap:6px">
       <button class="gh" id="gAll" style="flex:1" title="把這一段的設定複製到其他每一段">套用到全部</button>
       <button class="gh" id="gReset" style="flex:1">重設</button>
     </div></div>
     <div class="row"><div class="f">
       <button class="gh" id="gBypass" style="flex:1">${A.gradeBypass ? '● 正在看原始畫面（點一下切回）' : '按一下比對原始畫面'}</button>
     </div></div>
    </div>`;
}

function bindGrade(c){
  if (!c.grade) c.grade = { ...GRADE0 };
  const g = c.grade;
  const upd = (k, id, v) => {
    g[k] = +v; g.preset = null;
    setVal(id, +v > 0 ? '+' + Math.round(v) : String(Math.round(v)));
    render();
  };
  bind('gBri','input',  v => upd('bri','gBri',v));
  bind('gCon','input',  v => upd('con','gCon',v));
  bind('gSat','input',  v => upd('sat','gSat',v));
  bind('gTemp','input', v => upd('temp','gTemp',v));
  bind('gTint','input', v => upd('tint','gTint',v));
  bind('gShp','input',  v => upd('sharp','gShp',v));
  bind('gFade','input', v => upd('fade','gFade',v));
  bind('gVig','input',  v => upd('vig','gVig',v));
  bind('gGrain','input',v => upd('grain','gGrain',v));
  bind('gBloom','input',v => upd('bloom','gBloom',v));
  bind('gSepia','input',v => upd('sepia','gSepia',v));
  // 拉滑桿是連續事件，undo 只在按下去時記一次，不然一拉就吃掉幾十步歷史
  ['gBri','gCon','gSat','gTemp','gTint','gShp','gFade','gVig','gGrain','gBloom','gSepia'].forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('pointerdown', () => pushUndo());
  });
  on('gMore', () => { A._gradeMore = !A._gradeMore; refreshProp(); });
  bind('gPreset','change', v => { applyGradePreset(c, v); render(); refreshProp(); });
  on('gPick', () => openPicker('grade', c.grade.preset || 'none', id => {
    applyGradePreset(c, id);
    const sel = $('#gPreset'); if (sel) sel.value = id;
    render();
  }, c));
  on('gAll', () => {
    if (A.clips.length < 2){ toast('只有一段，不用複製', true); return; }
    copyGradeToAll(c);
    render();
    toast(`已把這一段的畫面調整套到全部 ${A.clips.length} 段`);
  });
  on('gReset', () => { pushUndo(); c.grade = { ...GRADE0 }; render(); refreshProp(); });
  on('gBypass', () => { A.gradeBypass = !A.gradeBypass; render(); refreshProp(); });
}

/** 風格縮圖：直接用目前這一格畫面去套每一組預設，看到的就是套上去的樣子 */
function paintGradeCells(){
  const clip = _gClip;
  if (!clip || !_gCells.length) return;
  const saved = clip.grade;
  const bypass = A.gradeBypass;
  A.gradeBypass = false;
  try {
    for (const cell of _gCells){
      const pre = GRADE_PRESETS.find(x => x.id === cell.id);
      clip.grade = Object.assign({}, GRADE0, pre ? pre.s : {});
      paintClip(cell.ctx, { clip }, cell.ctx.canvas.width, cell.ctx.canvas.height);
    }
  } finally {
    clip.grade = saved;
    A.gradeBypass = bypass;
  }
}

</script>
<script>
/* ==========================================================================
   NiVedit — 連續解碼（Stage 2 · 匯出加速）

   舊做法：每一幀都 video.currentTime = t 然後等 seeked，一次來回數十毫秒。
   新做法：用 mp4box.js 把 MP4/MOV 拆成原始編碼封包，餵給 VideoDecoder
           一路往前解，輸出時間也是一路往前，兩邊都不用回頭。

   任何一步失敗（容器不支援、編碼器不支援、檔案有問題）都回傳 null，
   匯出流程會自動退回原本的逐幀 seek，不會讓使用者匯不出來。
   ========================================================================== */
'use strict';

/* 不受背景分頁節流影響的讓出方式 */
/* 預取幾幀。實機量出來的結果：
     1 幀 → 取幀 80.8ms（每格都在等 GPU 來回）
     4 幀 → 60.4ms
    10 幀 → 70.9ms（反而變慢：解碼器輸出池裝不下，它停住不吐，我們白等）
   最佳值取決於那台機器的解碼器輸出池有多大，猜不準 ——
   所以改成自己找：從 4 開始，湊不滿就往下修，很順就往上加一點。 */
const PREFETCH_START = 4, PREFETCH_MAX = 8;

const decYield = (() => {
  const ch = new MessageChannel();
  const q = [];
  ch.port1.onmessage = () => { const r = q.shift(); if (r) r(); };
  return () => new Promise(res => { q.push(res); ch.port2.postMessage(0); });
})();

/** 把整個檔案讀進來，交給 mp4box 拆解，取出影像軌與所有封包 */
function demuxMP4(file){
  return new Promise((res, rej) => {
    if (typeof MP4Box === 'undefined') return rej(new Error('沒有 mp4box'));
    const mp4 = MP4Box.createFile();
    let info = null;
    const samples = [];
    const to = setTimeout(() => rej(new Error('拆解逾時')), 25000);

    mp4.onError = e => { clearTimeout(to); rej(new Error('拆解失敗：' + e)); };
    mp4.onReady = i => {
      info = i;
      const vt = i.videoTracks && i.videoTracks[0];
      if (!vt){ clearTimeout(to); return rej(new Error('沒有影像軌')); }
      mp4.setExtractionOptions(vt.id, null, { nbSamples: 1e9 });
      mp4.start();
    };
    mp4.onSamples = (id, user, list) => { for (const s of list) samples.push(s); };

    file.arrayBuffer().then(buf => {
      buf.fileStart = 0;
      mp4.appendBuffer(buf);
      mp4.flush();
      clearTimeout(to);
      const vt = info && info.videoTracks && info.videoTracks[0];
      if (!vt || !samples.length) return rej(new Error('沒有取到封包'));
      // 取出解碼器需要的 avcC / hvcC / vpcC 設定資料
      const trak = mp4.getTrackById(vt.id);
      let desc = null;
      for (const e of trak.mdia.minf.stbl.stsd.entries){
        const box = e.avcC || e.hvcC || e.vpcC || e.av1C;
        if (box){
          // mp4box.all.js 把 DataStream 掛在全域，不是掛在 MP4Box 下面
          const DS = (typeof DataStream !== 'undefined') ? DataStream : (MP4Box && MP4Box.DataStream);
          if (!DS) break;
          const st = new DS(undefined, 0, DS.BIG_ENDIAN);
          box.write(st);
          desc = new Uint8Array(st.buffer, 8);       // 去掉 box header
          break;
        }
      }
      // tkhd 的變換矩陣（iPhone 直立拍會寫「轉 90 度」在這裡）。
      // <video> 元素會自動套用它，但我們自己解出來的原始幀不會 —— 要自己轉。
      let matrix = vt.matrix;
      if (!matrix){ try { matrix = trak.tkhd.matrix; } catch(e){} }
      res({ track: vt, samples, description: desc, timescale: vt.timescale, matrix });
    }).catch(e => { clearTimeout(to); rej(e); });
  });
}

/** QuickTime/MP4 的 tkhd 變換矩陣 → 顯示時要順時針轉幾度。
    矩陣把來源座標映到顯示座標：x' = a·x + c·y，y' = b·x + d·y（16.16 定點數）。
      a=1  b=0  → 0 度        a=0  b=1  → 90 度（iPhone 直立拍就是這個）
      a=-1 b=0  → 180 度      a=0  b=-1 → 270 度 */
function rotFromMatrix(m){
  if (!m || m.length < 5) return 0;
  const a = m[0] / 65536, b = m[1] / 65536;
  if (Math.abs(a) > 0.9) return a > 0 ? 0 : 180;
  if (Math.abs(b) > 0.9) return b > 0 ? 90 : 270;
  return 0;
}

/** 一段影片的「往前吐幀」來源。frameAt(t) 只能越叫越晚，不能回頭。 */
class FrameSource {
  constructor(){ this.ok = false; }

  static async create(clip){
    const fs = new FrameSource();
    try {
      const d = await demuxMP4(clip.file);
      fs.samples = d.samples;
      fs.timescale = d.timescale;
      fs.rot = rotFromMatrix(d.matrix);
      // 保險：<video> 報的是「轉好之後」的尺寸。如果它跟編碼尺寸是對調的，
      // 卻算不出旋轉（矩陣讀不到），那就當作 90 度，至少方向會對一邊。
      const cw = d.track.video.width, chh = d.track.video.height;
      if (!fs.rot && clip.w && clip.h && clip.w === chh && clip.h === cw) fs.rot = 90;
      const codec = d.track.codec;
      const cfg = {
        codec,
        codedWidth: d.track.video.width,
        codedHeight: d.track.video.height,
        description: d.description || undefined,
        hardwareAcceleration: 'prefer-hardware'
      };
      let sup = false;
      try { sup = (await VideoDecoder.isConfigSupported(cfg)).supported; } catch(e){}
      if (!sup){
        delete cfg.hardwareAcceleration;
        try { sup = (await VideoDecoder.isConfigSupported(cfg)).supported; } catch(e){}
      }
      if (!sup) return null;

      fs.queue = [];
      fs.err = null;
      fs.dec = new VideoDecoder({
        output: f => fs.queue.push(f),
        error: e => { fs.err = e; }
      });
      fs.cfg = cfg;
      fs.dec.configure(cfg);
      fs.next = 0;                    // 下一個要送進解碼器的封包
      fs.cur = null;                  // 目前保留著的那一幀
      fs.want = PREFETCH_START;       // 預取幾幀，跑起來會自己校準
      fs.started = false;             // 第一次取幀時才決定從哪個關鍵幀開始
      fs.flushed = false;
      fs.ok = true;
      return fs;
    } catch(e){ return null; }
  }

  /** 找出時間點 t（秒，相對原片）之前最後一個關鍵幀的封包索引 */
  _keyBefore(t){
    let k = 0;
    for (let i = 0; i < this.samples.length; i++){
      const st = this.samples[i].cts / this.samples[i].timescale;
      if (st > t + 1e-6) break;
      if (this.samples[i].is_sync) k = i;
    }
    return k;
  }

  _drop(){ for (const f of this.queue) f.close(); this.queue.length = 0; }

  /** 讓解碼器保持有工作可做，然後等它吐幀。
      不要每批都 flush —— flush 會把整條管線排乾，解碼就變成一次一幀的序列動作。 */
  /** 只把封包餵進解碼器，不等結果（同步） */
  _feed(){
    while (this.next < this.samples.length && this.dec.decodeQueueSize < 40){
      const s = this.samples[this.next++];
      try {
        this.dec.decode(new EncodedVideoChunk({
          type: s.is_sync ? 'key' : 'delta',
          timestamp: s.cts / s.timescale * 1e6,
          duration: (s.duration || 0) / s.timescale * 1e6,
          data: s.data
        }));
      } catch(e){ this.err = e; return; }
    }
  }

  /** 等到手上至少有 want 幀可用。
      原本每次只等「一幀」就回去，等於整條線變成
      解一幀 → 等 → 合成 → 編碼 → 再解一幀 → 再等…… 全部串起來排隊，
      解碼器有一半時間在空轉。一次多等幾幀存著，後面幾次取幀就直接命中不用等。
      絕對不能在串流中途 flush：flush 之後解碼器要求下一個必須是關鍵幀。 */
  async _pump(){
    const want = Math.max(1, this.want || PREFETCH_START);
    this._feed();
    const hitFree = this.queue.length >= want;   // 完全沒等就湊滿 → 還有餘裕
    let last = this.queue.length, idle = 0, gaveUp = false;
    for (let i = 0; i < 800 && this.queue.length < want && !this.err; i++){
      await decYield();
      this._feed();                       // 邊等邊補，解碼佇列不要空掉
      if (this.queue.length > last){ last = this.queue.length; idle = 0; }
      // 解碼器的輸出池有上限，湊不滿是正常的 —— 手上有幀就先用。
      // 這裡放棄得越快越好，空等就是純粹的浪費（v4.8 設 24 就是因此變慢）
      else if (++idle > 4 && this.queue.length){ gaveUp = true; break; }
      // 檔尾：剩下的封包湊不滿，有幾幀就用幾幀
      if (this.queue.length && this.next >= this.samples.length && this.dec.decodeQueueSize === 0) break;
    }
    // 自己校準：湊不滿就是要太多了，往下修；毫不費力就湊滿則慢慢往上加
    if (gaveUp) this.want = Math.max(1, Math.min(want, this.queue.length) - 1);
    else if (hitFree && want < PREFETCH_MAX) this.want = want + 1;
    else this.want = want;
    if (this.queue.length){ this.stall = 0; return; }
    if (!this.err && this.next < this.samples.length){
      this.stall = (this.stall || 0) + 1;
      if (this.stall > 3) this.err = new Error('解碼器沒有回應');   // 卡住就讓匯出退回逐幀
    }
  }

  /** 需要的話把幀轉正，回傳一張畫布；不需要就原樣回傳 VideoFrame。
      轉正之後尺寸就跟 <video> 報的一樣，預覽與匯出才會長得一模一樣。 */
  _upright(f){
    if (!f || !this.rot) return f;
    const dw = f.displayWidth || f.codedWidth, dh = f.displayHeight || f.codedHeight;
    if (!dw || !dh) return f;
    const oW = (this.rot % 180) ? dh : dw, oH = (this.rot % 180) ? dw : dh;
    if (!this.rcv){ this.rcv = document.createElement('canvas'); this.rctx = null; }
    if (this.rcv.width !== oW || this.rcv.height !== oH){
      this.rcv.width = oW; this.rcv.height = oH; this.rctx = null; this.rts = -1;
    }
    if (!this.rctx) this.rctx = this.rcv.getContext('2d', { alpha:false });
    if (this.rts === f.timestamp) return this.rcv;      // 同一幀不重畫
    this.rts = f.timestamp;
    const g = this.rctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.translate(oW / 2, oH / 2);
    g.rotate(this.rot * Math.PI / 180);
    try { g.drawImage(f, -dw / 2, -dh / 2, dw, dh); } catch(e){}
    g.setTransform(1, 0, 0, 1, 0, 0);
    return this.rcv;
  }

  /** 取得涵蓋時間 t 的那一幀。往前解到夠為止。 */
  async frameAt(t){
    if (!this.ok || this.err) return null;
    if (!this.started){ this.next = this._keyBefore(t); this.started = true; }
    const tsOf = f => f.timestamp / 1e6;
    for (let guard = 0; guard < 6000; guard++){
      if (this.queue.length){
        const f = this.queue[0];
        if (this.cur && tsOf(f) > t + 1e-9) return this._upright(this.cur);   // 下一幀已經比要的還晚
        this.queue.shift();
        if (this.cur) this.cur.close();
        this.cur = f;
        continue;
      }
      if (this.next >= this.samples.length && this.dec.decodeQueueSize === 0){
        if (this.flushed) return this._upright(this.cur);     // 到檔尾了，維持最後一幀
        this.flushed = true;
        await this.dec.flush().catch(()=>{});
        continue;
      }
      await this._pump();
      if (this.err) return this._upright(this.cur);
    }
    return this._upright(this.cur);
  }

  close(){
    try { this._drop(); if (this.cur) this.cur.close(); } catch(e){}
    try { this.dec.close(); } catch(e){}
    this.ok = false;
  }
}

</script>
<script>
/* ==========================================================================
   NiVedit — 專案管理（新建／開啟／儲存／刪除）

   存在瀏覽器的 IndexedDB，分兩個庫：
     projects — 編輯資料（片段時間、標題、字幕、樣式…），很小
     media    — 影片／圖片／音檔本體，用「檔名+大小+修改時間」當 key，
                同一個檔案跨專案只存一份，重存不會再搬一次

   這樣「開啟專案」可以直接還原，不用每次重新挑檔案。
   ========================================================================== */
'use strict';

const DB_NAME = 'nivedit', DB_VER = 2;
let _curProj = null;              // { id, name }  ← 存在瀏覽器裡的專案（退路用）
let _dir = null;                  // 本機專案資料夾 handle
let _fh  = null;                  // 目前開著的專案檔 handle
const hasFS = typeof window.showDirectoryPicker === 'function';

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath:'id' });
      if (!db.objectStoreNames.contains('media'))    db.createObjectStore('media',    { keyPath:'key' });
      if (!db.objectStoreNames.contains('handles'))  db.createObjectStore('handles',  { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('無法開啟資料庫'));
  });
}
function tx(db, store, mode){ return db.transaction(store, mode).objectStore(store); }
function req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

const mediaKey = f => `${f.name}|${f.size}|${f.lastModified || 0}`;

/* ── 序列化 ────────────────────────────────────────────────── */
const pick = (o, keys) => { const r = {}; for (const k of keys) if (o[k] !== undefined) r[k] = o[k]; return r; };

function serialize(){
  const files = new Map();                       // key → File
  // 順手把 key 蓋回物件上：素材參照失效要重綁時，靠這個對得回來
  // （不能臨時用 mediaKey(o.file) 重算 —— 檔案物件換過就對不上了）
  const reg = (f, o) => {
    if (!f) return null;
    const k = mediaKey(f);
    files.set(k, f);
    if (o) o.mediaKey = k;
    return k;
  };
  const st = {
    ver: VER,
    clips: A.clips.map(c => Object.assign(
      pick(c, ['id','kind','name','dur','w','h','inP','outP','muted','vol','rot',
               'transMode','fadeIn','fadeOut','fadeAudio','track','at','x','y','scale','opacity','motionRot',
               'cropShape','cropX','cropY','cropW','cropH','cropSize','kf','kfT','trans','transOut','thumb','grade']),
      { mediaKey: reg(c.file, c) })),
    musics: A.musics.map(m => Object.assign(
      pick(m, ['id','name','dur','offset','startAt','len','autoLen','vol','fadeIn','fadeOut','loop','xfade','vk']),
      { mediaKey: reg(m.file, m) })),
    overlays: A.overlays.map(o => Object.assign(
      pick(o, ['id','name','w','h','start','end','x','y','scale','opacity','rot','fadeIn','fadeOut','thumb','gifOffset','kf','kfT']),
      { mediaKey: reg(o.file, o) })),
    titles: A.titles.map(t => ({ ...t })),
    subs: A.subs.map(c => ({ ...c })),
    subStyle: { ...A.subStyle },
    subStyleUpper:A.subStyleUpper ? {...A.subStyleUpper} : null,
    proj: { ...A.proj },
    playhead: A.playhead, pps: A.pps
  };
  return { st, files };
}

function elFor(kind, url){
  return new Promise((res, rej) => {
    if (kind === 'image'){
      const im = new Image();                  // blob 網址同源，不設 crossOrigin（見 20_core.js addVideo 的說明）
      const clr = () => { im.onload = null; im.onerror = null; };   // 一次性，用完就拆
      im.onload = () => { clr(); res(im); };
      im.onerror = () => { clr(); rej(new Error('圖片載入失敗')); };
      im.src = url; return;
    }
    const el = document.createElement(kind === 'audio' ? 'audio' : 'video');
    el.src = url; el.preload = 'auto';
    if (kind !== 'audio'){ el.playsInline = true; el.muted = true; }
    const clr = () => { el.onloadedmetadata = null; el.onerror = null; };
    el.onloadedmetadata = () => { clr(); res(el); };
    el.onerror = () => { clr(); rej(new Error('媒體載入失敗')); };
    $('#videoPool').appendChild(el);
  });
}

async function deserialize(st, blobs){
  clearGifMedia();
  const url = k => { const b = blobs.get(k); return b ? URL.createObjectURL(b) : null; };
  const missing = [];

  A.clips = [];
  for (const c of st.clips){
    const u = url(c.mediaKey);
    if (!u){ missing.push(c.name); continue; }
    const isImage = c.kind === 'image';
    let el;
    try { el = await elFor(isImage ? 'image' : 'video', u); }
    catch(e){ missing.push(c.name); continue; }
    const nc = Object.assign({
      x: 0.5, y: 0.5, scale: 1, opacity: 1, motionRot: 0,
      track: 0, at: null,
      cropShape: 'none', cropX: 0.5, cropY: 0.5, cropW: 1, cropH: 1, cropSize: 1, kf: null, kfT: null
    }, c, {
      file: blobs.get(c.mediaKey), url: u,
      video: isImage ? null : el, el, img: isImage ? el : undefined,
      audioBuf: null, audioTried: isImage,
      grade: Object.assign({}, GRADE0, c.grade || {})     // 舊專案沒有這個欄位
    });
    A.clips.push(nc); regMedia(nc);
  }

  A.musics = [];
  for (const m of st.musics){
    const u = url(m.mediaKey);
    if (!u){ missing.push(m.name); continue; }
    let el;
    try { el = await elFor('audio', u); } catch(e){ missing.push(m.name); continue; }
    const nm = Object.assign({}, m, { file: blobs.get(m.mediaKey), url: u, el, buf: null });
    A.musics.push(nm); regMedia(nm);
  }

  A.overlays = [];
  for (const o of st.overlays){
    const u = url(o.mediaKey);
    if (!u){ missing.push(o.name); continue; }
    let im, gif;
    try {
      im = await elFor('image', u);
      gif = await getOverlayGif(blobs.get(o.mediaKey));
    } catch(e){ URL.revokeObjectURL(u); missing.push(o.name + ' (' + (e.message || e) + ')'); continue; }
    const no = Object.assign({}, o, { file: blobs.get(o.mediaKey), url: u, img: im, _gif: gif });
    A.overlays.push(no); regMedia(no);
  }

  A.titles = (st.titles || []).map(t => ({ ...t }));
  A.subs   = (st.subs   || []).map(c => ({track:0, ...c }));
  A.subStyleUpper=st.subStyleUpper ? {...st.subStyleUpper} : null;
  if (st.subStyle) Object.assign(A.subStyle, st.subStyle);
  Object.assign(A.proj, st.proj || {});
  upgradeClipSettings(st.proj || {});
  A.pps = st.pps || A.pps;
  A.playhead = clamp(st.playhead || 0, 0, totalDur());
  A.sel = { type:'proj', id:null };
  return missing;
}

/* ── 存 / 讀 / 刪 ──────────────────────────────────────────── */
async function projSave(asNew){
  const name = (asNew || !_curProj)
    ? (prompt('專案名稱', _curProj ? _curProj.name + ' 複本' : '未命名專案') || '').trim()
    : _curProj.name;
  if (!name) return;
  if (!A.clips.length && !confirm('目前沒有任何素材，還是要存？')) return;

  const { st, files } = serialize();
  mShow('儲存專案', name);
  $('#mCancel').classList.add('hide');      // 存檔中途取消會留下半套資料，不給取消
  try {
    const db = await idb();
    // 素材本體：已經存過的就跳過
    let i = 0, saved = 0, bytes = 0;
    for (const [key, f] of files){
      i++;
      mProg(i / files.size * 85, `檢查素材 ${i} / ${files.size}　${f.name}`);
      const has = await req(tx(db, 'media', 'readonly').get(key));
      if (!has){
        await req(tx(db, 'media', 'readwrite').put({ key, blob: f, name: f.name, size: f.size, type: f.type }));
        saved++; bytes += f.size;
      }
    }
    mProg(92, '寫入專案…');
    const id = (asNew || !_curProj) ? uid() + Date.now().toString(36) : _curProj.id;
    const rec = { id, name, updated: Date.now(), ver: VER, state: st, keys: [...files.keys()] };
    await req(tx(db, 'projects', 'readwrite').put(rec));
    _curProj = { id, name };
    updateProjBar();
    mDone('已儲存', name,
      `素材 ${files.size} 個（新增 ${saved} 個，${(bytes/1048576).toFixed(1)} MB）<br>` +
      `<span style="color:var(--fg3)">同一個檔案跨專案只會存一份，下次儲存會更快。</span>`);
  } catch(e){
    mDone('儲存失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span>` +
      `<br><br><span style="color:var(--fg3)">瀏覽器儲存空間可能不足。可以先刪掉用不到的專案再試。</span>`);
  }
}

async function projList(){
  const db = await idb();
  const all = await req(tx(db, 'projects', 'readonly').getAll());
  return all.sort((a, b) => b.updated - a.updated);
}

async function projOpen(id){
  const db = await idb();
  const rec = await req(tx(db, 'projects', 'readonly').get(id));
  if (!rec){ toast('找不到這個專案', true); return; }
  mShow('開啟專案', rec.name);
  $('#mCancel').classList.add('hide');
  try {
    const blobs = new Map();
    let i = 0;
    for (const k of rec.keys){
      i++;
      mProg(i / Math.max(1, rec.keys.length) * 70, `載入素材 ${i} / ${rec.keys.length}`);
      const m = await req(tx(db, 'media', 'readonly').get(k));
      if (m) blobs.set(k, m.blob);
    }
    mProg(80, '重建時間軸…');
    const missing = await deserialize(rec.state, blobs);
    _curProj = { id: rec.id, name: rec.name };
    _undo.length = 0; _redo.length = 0; updateUndoBtns();
    updateProjBar();
    render(); refreshProp();
    if (missing.length){
      mDone('開啟完成（有缺素材）', rec.name,
        `<span style="color:var(--warn)">這些素材找不到，已略過：${esc(missing.join('、'))}</span>`);
    } else {
      $('#mask').classList.remove('on');
      toast(`已開啟「${rec.name}」`);
    }
  } catch(e){
    mDone('開啟失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span>`);
  }
}

async function projDelete(id, name){
  if (!confirm(`確定刪除專案「${name}」？\n（素材本體會保留給其他專案使用）`)) return;
  const db = await idb();
  await req(tx(db, 'projects', 'readwrite').delete(id));
  if (_curProj && _curProj.id === id){ _curProj = null; updateProjBar(); }
  toast('已刪除');
  showProjDialog();
}

/** 沒有任何專案在用的素材就清掉，把空間還回去 */
async function projGC(){
  const db = await idb();
  const all = await req(tx(db, 'projects', 'readonly').getAll());
  const used = new Set();
  all.forEach(p => (p.keys || []).forEach(k => used.add(k)));
  const media = await req(tx(db, 'media', 'readonly').getAll());
  let n = 0, bytes = 0;
  for (const m of media){
    if (!used.has(m.key)){
      await req(tx(db, 'media', 'readwrite').delete(m.key));
      n++; bytes += m.size || 0;
    }
  }
  toast(n ? `清掉 ${n} 個沒人用的素材，釋放 ${(bytes/1048576).toFixed(1)} MB` : '沒有可以清的素材');
  showProjDialog();
}

/** 清空目前內容（不問名稱，給建立流程內部用） */
function resetProject(){
  clearGifMedia();
  _fh = null;
  A.clips.forEach(c => { if (c.video) c.video.pause(); });
  A.musics.forEach(m => m.el.pause());
  A.clips = []; A.titles = []; A.musics = []; A.overlays = []; A.subs = [];
  A.sel = { type:'proj', id:null };
  A.playhead = 0; setPlaying(false);
  _curProj = null;
  _undo.length = 0; _redo.length = 0; updateUndoBtns();
  updateProjBar();
  render(); refreshProp();
}

/** 新建專案：當下就問名稱與存放位置，建立好檔案，之後儲存直接覆蓋 */
async function showNewDialog(){
  if (A.clips.length && !confirm('要開新專案嗎？目前沒存的修改會不見。')) return;
  const box = $('#pbody');
  $('#pquota').textContent = '';
  $('#pfoot').classList.add('hide');
  $('#pmask').classList.add('on');
  const draw = () => {
    box.innerHTML =
      `<div class="row"><label>專案名稱</label><div class="f">
         <input id="npName" value="未命名專案" spellcheck="false"></div></div>` +
      (hasFS
        ? `<div class="row"><label>存放資料夾</label><div class="f">
             <span class="hint" id="npDir" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
               ${_dir ? esc(_dir.name) : '尚未選擇'}</span>
             <button id="npPick">${_dir ? '換資料夾' : '選擇資料夾'}</button></div></div>
           <div class="hint">建立後會在資料夾裡產生一個 .nvproj 檔案，之後按「儲存」直接覆蓋，不會再問你。</div>`
        : `<div class="hint">這個瀏覽器不支援直接存到資料夾，專案會存在瀏覽器裡。</div>`) +
      `<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
         <button id="npSkip">先不指定，直接開始</button>
         <button class="pri" id="npCreate">建立</button></div>`;
    $('#npPick').onclick = async () => { if (await ensureDir(true)) draw(); };
    $('#npSkip').onclick = () => { $('#pmask').classList.remove('on'); $('#pfoot').classList.remove('hide');
                                   resetProject(); toast('已建立新專案（尚未指定存放位置）'); };
    $('#npCreate').onclick = async () => {
      const name = ($('#npName').value || '').trim();
      if (!name){ toast('請輸入專案名稱', true); return; }
      if (hasFS){
        const d = await ensureDir(true);
        if (!d){ toast('沒有選資料夾', true); return; }
        const fn = name.replace(/[\\/:*?"<>|]/g,'_') + '.nvproj';
        try {
          // 檔名已存在就先問過
          let exists = false;
          try { await d.getFileHandle(fn); exists = true; } catch(e){}
          if (exists && !confirm(`資料夾裡已經有「${fn}」，要覆蓋嗎？`)) return;
          const fh = await d.getFileHandle(fn, { create:true });
          resetProject();
          _curProj = { id:null, name };
          _fh = fh;
          const w = await fh.createWritable();
          await w.write(await buildProjBlob());
          await w.close();
          updateProjBar();
          $('#pmask').classList.remove('on'); $('#pfoot').classList.remove('hide');
          toast(`已建立「${name}」，存放於 ${d.name}`);
        } catch(e){ toast('建立失敗：' + e.message, true); }
      } else {
        resetProject();
        _curProj = { id: uid() + Date.now().toString(36), name };
        updateProjBar();
        $('#pmask').classList.remove('on'); $('#pfoot').classList.remove('hide');
        toast(`已建立「${name}」`);
      }
    };
  };
  draw();
}

/** 存完之後，把素材重新綁到剛寫出去的那個檔案上。

    為什麼一定要做：開專案時每段素材是「從 .nvproj 切出來的 Blob」，
    瀏覽器記的是「這個檔案的第幾個 byte 起、多長、修改時間是多少」。
    存檔一蓋回同一個檔，修改時間就變了，那些切片全部失效 ——
    第一次存還讀得到（寫入前就讀完了），第二次存就會噴
    「The requested file could not be read…」。
    重綁之後指向的是新檔案，存幾次都沒問題。 */
/** 等元素載到「真的有畫面可用」為止（readyState>=2），不只是有檔頭。
    只等到檔頭的話，畫布上畫出來會是空的。 */
function onceReady(el, ms, force){
  return new Promise(res => {
    if (!el) return res();
    const ev = (el.tagName === 'IMG') ? 'load' : 'loadeddata';
    // force：剛剛才重設 src，readyState 還沒歸零，這時候查是查到舊值，一定要等事件
    if (!force && (el.tagName === 'IMG' ? el.complete : el.readyState >= 2)) return res();
    const ok = () => { el.removeEventListener(ev, ok); el.removeEventListener('error', ok); res(); };
    el.addEventListener(ev, ok); el.addEventListener('error', ok);
    setTimeout(ok, ms || 8000);
  });
}

/** 把一個素材重新接到新的檔案上：新的 blob 網址 ＋ 讓元素重新載入。

    只換 o.file 是不夠的 —— <video> 的 src 還指著舊的 blob 網址，
    那個網址背後的檔案已經被改掉了。小檔案因為整個都在記憶體裡還能播，
    大檔案播到一半要回去讀就死掉，readyState 掉回 1：沒畫面、沒聲音。 */
async function reattach(o, nf){
  const el = o.video || o.img || o.el;
  o.file = nf;
  o.audioBuf = null; o.audioTried = false; o._ab = null; o.buf = null;
  const old = o.url;
  const url = URL.createObjectURL(nf);
  o.url = url;
  if (el){
    const at = (o.video && isFinite(o.video.currentTime)) ? o.video.currentTime : 0;
    try {
      el.src = url;
      if (el.load) el.load();
      await onceReady(el, 12000, true);
      if (o.video){ try { o.video.currentTime = at; } catch(e){} }
    } catch(e){}
  }
  const m = MEDIA.get(o.id);
  if (m){ m.file = nf; m.url = url; if ('audioBuf' in m) m.audioBuf = null; }
  // 舊網址晚一點再收，免得還有讀到一半的動作
  if (old && old !== url) setTimeout(() => { try { URL.revokeObjectURL(old); } catch(e){} }, 5000);
}

async function rebindMedia(fh, base, index){
  if (!fh || !index || !index.length) return;
  let f;
  try { f = await fh.getFile(); } catch(e){ return; }
  const byKey = new Map();
  for (const it of index){
    const part = f.slice(base + it.off, base + it.off + it.len);
    byKey.set(it.key, new File([part], it.name, { type: it.type || '' }));
  }
  let n = 0;
  for (const arr of [A.clips, A.musics, A.overlays]){
    for (const o of arr){
      if (!o.file) continue;
      const nf = byKey.get(o.mediaKey) || byKey.get(mediaKey(o.file));
      if (!nf) continue;
      await reattach(o, nf);            // 檔案物件、blob 網址、元素三個一起換
      n++;
    }
  }
  return n;
}

/** 這個素材現在還讀得到嗎？（讀 1 個 byte 就知道） */
async function fileAlive(f){
  if (!f) return false;
  try { await f.slice(0, 1).arrayBuffer(); return true; } catch(e){ return false; }
}

/** 檢查所有素材還讀不讀得到；有失效的就從目前的專案檔重新切一次。

    為什麼會失效：開專案時素材是「.nvproj 檔案的切片」，瀏覽器記的是
    「哪個檔、第幾個 byte、修改時間多少」。那個檔一被動到（自己存檔、改名、
    搬位置、雲端同步回寫）全部切片同時失效，而且不會有任何提示 ——
    症狀就是聲音不見、存檔失敗、匯出失敗。
    所以在「要用到素材之前」先驗一次，壞了就自己接回去。 */
async function revalidateMedia(){
  const all = [].concat(A.clips, A.musics, A.overlays).filter(o => o.file);
  const bad = [];
  for (const o of all) if (!await fileAlive(o.file)) bad.push(o);
  if (!bad.length) return { ok:true, fixed:0, lost:[] };
  if (!_fh) return { ok:false, fixed:0, lost: bad.map(o => o.name) };
  try {
    const f = await _fh.getFile();
    const ml = NV_MAGIC.length;
    const h0 = await f.slice(0, ml + 4).arrayBuffer();
    if (new TextDecoder().decode(h0.slice(0, ml)) !== NV_MAGIC) throw new Error('不是專案檔');
    const hlen = new DataView(h0).getUint32(ml, true);
    const head = JSON.parse(new TextDecoder().decode(await f.slice(ml + 4, ml + 4 + hlen).arrayBuffer()));
    await rebindMedia(_fh, ml + 4 + hlen, head.index);
  } catch(e){ return { ok:false, fixed:0, lost: bad.map(o => o.name), err: e.message }; }
  const lost = [];
  for (const o of bad) if (!await fileAlive(o.file)) lost.push(o.name);
  return { ok: lost.length === 0, fixed: bad.length - lost.length, lost };
}

/* ── 本機資料夾（File System Access API）────────────────────────
   跟尤書日誌一樣：選一次資料夾，之後專案就是那個資料夾裡的真實檔案，
   不依賴瀏覽器儲存，換電腦拷貝資料夾就好。
   ─────────────────────────────────────────────────────────── */
async function saveDirHandle(h){
  try { const db = await idb(); await req(tx(db,'handles','readwrite').put({ id:'projDir', h })); } catch(e){}
}
async function loadDirHandle(){
  try { const db = await idb(); const r = await req(tx(db,'handles','readonly').get('projDir'));
        return r ? r.h : null; } catch(e){ return null; }
}
/** 拿到可讀寫的資料夾。沒有就請使用者選一個（必須由點擊觸發） */
async function ensureDir(ask){
  if (_dir){
    let st = 'denied';
    try { st = await _dir.queryPermission({ mode:'readwrite' }); } catch(e){}
    if (st === 'granted') return _dir;
    if (ask){
      try { st = await _dir.requestPermission({ mode:'readwrite' }); } catch(e){}
      if (st === 'granted') return _dir;
    }
  }
  if (!ask) return null;
  try {
    _dir = await window.showDirectoryPicker({ mode:'readwrite', id:'nivedit-projects' });
    await saveDirHandle(_dir);
    return _dir;
  } catch(e){ return null; }          // 使用者取消
}

/** 列出資料夾裡的專案檔 */
async function dirList(){
  const d = await ensureDir(false);
  if (!d) return null;
  const out = [];
  try {
    for await (const [name, h] of d.entries()){
      if (h.kind !== 'file' || !/\.nvproj$/i.test(name)) continue;
      let f = null;
      try { f = await h.getFile(); } catch(e){}
      out.push({ name, handle: h, size: f ? f.size : 0, updated: f ? f.lastModified : 0 });
    }
  } catch(e){ return null; }
  return out.sort((a, b) => b.updated - a.updated);
}

/** 把目前專案寫進資料夾。asNew=true 會問新檔名 */
const hasSavePicker = typeof window.showSaveFilePicker === 'function';

async function dirSave(asNew){
  let fh = (!asNew && _fh) ? _fh : null;
  if (!fh){
    const base = (_curProj ? _curProj.name : '未命名專案').replace(/[\\/:*?"<>|]/g,'_');
    if (hasSavePicker){
      // 用瀏覽器原生的「另存新檔」：資料夾跟檔名一次選好。
      // 之前是先拿記住的資料夾、再用 prompt 問檔名，等於另存永遠只能存回同一個資料夾。
      try {
        fh = await window.showSaveFilePicker({
          suggestedName: base + '.nvproj',
          id: 'nivedit-projects',
          types: [{ description:'NiVedit 專案', accept:{ 'application/octet-stream':['.nvproj'] } }]
        });
      } catch(e){ return false; }                    // 使用者取消
      _curProj = { id:null, name: fh.name.replace(/\.nvproj$/i, '') };
    } else {
      const d = await ensureDir(true);
      if (!d){ toast('沒有選資料夾', true); return false; }
      const name = (prompt('專案檔名（會存進你選的資料夾）', base) || '').trim();
      if (!name) return false;
      try { fh = await d.getFileHandle(name.replace(/[\\/:*?"<>|]/g,'_') + '.nvproj', { create:true }); }
      catch(e){ toast('建立檔案失敗：' + e.message, true); return false; }
      _curProj = { id:null, name };
    }
  }
  mShow('儲存到資料夾', _curProj ? _curProj.name : '');
  $('#mCancel').classList.add('hide');
  try {
    // 素材如果已經失效（檔案被搬走、被別的程式改過），先想辦法接回來再存，
    // 不然存出去的專案檔會缺素材
    const rv = await revalidateMedia();
    if (rv.fixed) toast(`重新接上 ${rv.fixed} 個素材`);
    if (!rv.ok && rv.lost.length)
      throw new Error('這些素材已經讀不到了：' + rv.lost.join('、') +
        '。請把它們重新拖進來（或重新開啟專案）再存，否則存出去的檔案會缺素材。');
    const info = {};
    const blob = await buildProjBlob(info);
    mProg(80, '寫入檔案…');
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    _fh = fh;
    // 素材要改指向剛寫出去的這個檔，不然下一次存會讀不到（見 rebindMedia）
    await rebindMedia(fh, info.base, info.index);
    updateProjBar();
    mDone('已儲存到電腦', fh.name,
      `${(blob.size/1048576).toFixed(1)} MB<br><span style="color:var(--fg3)">真實檔案，跟瀏覽器儲存無關。` +
      `<br>「開啟」列表讀的是你在專案視窗選的資料夾；如果剛才存到別的地方，用「換一個資料夾」指過去就看得到。</span>`);
    return true;
  } catch(e){
    const msg = String(e && e.message || e);
    const stale = /could not be read|NotReadableError|not be read/i.test(msg);
    mDone('儲存失敗', '', `<span style="color:var(--danger)">${esc(msg)}</span>` +
      (stale ? `<br><br><span style="color:var(--fg3)">素材的檔案參照失效了 ——
        多半是素材檔在外面被移動、改名或改過內容。<br>
        重新開啟這個專案（或把素材重新拖進來）就會好。</span>` : ''));
    return false;
  }
}

async function dirOpen(entry){
  try {
    const f = await entry.handle.getFile();
    await projImportFile(f, entry.handle);
  } catch(e){ toast('開啟失敗：' + e.message, true); }
}
async function dirDelete(entry){
  if (!confirm(`確定刪除「${entry.name}」？\n這會刪掉電腦上的檔案。`)) return;
  const d = await ensureDir(true);
  if (!d) return;
  try {
    await d.removeEntry(entry.name);
    if (_fh && _fh.name === entry.name){ _fh = null; _curProj = null; updateProjBar(); }
    toast('已刪除');
    showProjDialog();
  } catch(e){ toast('刪除失敗：' + e.message, true); }
}

/* ── 匯出／匯入專案檔 ──────────────────────────────────────────
   瀏覽器儲存是「可回收」等級，磁碟吃緊或清除瀏覽資料就會不見。
   這裡把整個專案（編輯資料＋所有素材）打包成一個檔案，放哪都行。

   格式：NVPROJ1 magic ‖ 4 bytes JSON 長度 ‖ JSON ‖ 素材依序接在後面
   匯入時用 File.slice 取素材，不會把整個檔案讀進記憶體。
   ─────────────────────────────────────────────────────────── */
const NV_MAGIC = 'NVPROJ1';

/** 把整個專案打包成一個 Blob（資料夾儲存與檔案匯出共用） */
/** 建出專案檔的內容。
    out 給進來的話，會回填 { base, index } —— 存完之後要用它把素材
    重新綁到「剛剛寫出去的那個檔案」上，見 rebindMedia()。 */
async function buildProjBlob(out){
  const { st, files } = serialize();
  const index = [], parts = [];
  let off = 0;
  for (const [key, f] of files){
    index.push({ key, name: f.name, type: f.type, size: f.size, off, len: f.size });
    parts.push(f); off += f.size;
  }
  const head = JSON.stringify({ magic: NV_MAGIC, ver: VER,
    name: _curProj ? _curProj.name : '未命名專案', state: st, index });
  const headBytes = new TextEncoder().encode(head);
  const lenBuf = new Uint8Array(4);
  new DataView(lenBuf.buffer).setUint32(0, headBytes.length, true);
  if (out){ out.base = NV_MAGIC.length + 4 + headBytes.length; out.index = index; }
  return new Blob([new TextEncoder().encode(NV_MAGIC), lenBuf, headBytes, ...parts],
                  { type: 'application/octet-stream' });
}

async function projExportFile(){
  if (!A.clips.length){ toast('沒有東西可以匯出', true); return; }
  mShow('匯出專案檔', _curProj ? _curProj.name : '未命名專案');
  $('#mCancel').classList.add('hide');
  try {
    const blob = await buildProjBlob();
    mProg(90, '寫出檔案…');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    // file:// 開啟時瀏覽器可能把非 ASCII 檔名整個丟掉，加前綴保住副檔名
    const safe = (_curProj ? _curProj.name : 'project').replace(/[\\/:*?"<>|]/g, '_');
    const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
    a.download = `NiVedit_${safe}_${stamp}.nvproj`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    mDone('已匯出', a.download,
      `共 ${(blob.size/1048576).toFixed(1)} MB<br>` +
      `<span style="color:var(--fg3)">這個檔案跟瀏覽器無關，換電腦、備份到雲端都可以。</span>`);
  } catch(e){
    mDone('匯出失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span>`);
  }
}

async function projImportFile(file, handle){
  mShow('匯入專案檔', file.name);
  $('#mCancel').classList.add('hide');
  try {
    const magicLen = NV_MAGIC.length;
    const head0 = await file.slice(0, magicLen + 4).arrayBuffer();
    const magic = new TextDecoder().decode(head0.slice(0, magicLen));
    if (magic !== NV_MAGIC) throw new Error('這不是 NiVedit 專案檔');
    const hlen = new DataView(head0).getUint32(magicLen, true);
    const headBytes = await file.slice(magicLen + 4, magicLen + 4 + hlen).arrayBuffer();
    const head = JSON.parse(new TextDecoder().decode(headBytes));
    const base = magicLen + 4 + hlen;

    const blobs = new Map();
    head.index.forEach(m => blobs.set(m.key,
      new File([file.slice(base + m.off, base + m.off + m.len)], m.name, { type: m.type })));

    mProg(60, '重建時間軸…');
    const missing = await deserialize(head.state, blobs);
    _fh = handle || null;
    _curProj = { id:null, name: (head.name || file.name).replace(/\.nvproj$/i, '') };
    _undo.length = 0; _redo.length = 0; updateUndoBtns();
    updateProjBar();
    render(); refreshProp();
    if (missing.length){
      mDone('已開啟（有缺素材）', head.name || file.name,
        `<span style="color:var(--warn)">缺少素材：${esc(missing.join('、'))}</span>`);
    } else {
      $('#mask').classList.remove('on');
      toast(`已開啟「${_curProj.name}」`);
    }
  } catch(e){
    mDone('匯入失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span>`);
  }
}

/* ── 介面 ──────────────────────────────────────────────────── */

  }

  if (s) s.textContent = _fh ? '儲存' : '儲存…';
}

let _dirEntries = [];

async function showProjDialog(){
  const box = $('#pbody');
  $('#pfoot').classList.remove('hide');
  $('#pmask').classList.add('on');
  box.innerHTML = '<div class="hint" style="padding:12px 4px">讀取中…</div>';

  if (!hasFS){
    $('#pquota').innerHTML = '<span style="color:var(--warn)">這個瀏覽器不支援直接存到資料夾，只能用瀏覽器儲存或匯出檔案。</span>';
    return renderIdbList(box);
  }

  _dirEntries = await dirList();
  if (_dirEntries === null){
    $('#pquota').textContent = '';
    box.innerHTML =
      `<div class="hint" style="padding:6px 4px 12px">
         專案會存成你電腦上的真實檔案（.nvproj）。選一個資料夾放它們，之後開啟和儲存都直接讀寫那裡。</div>
       <button class="pri" id="pPickDir" style="width:100%">選擇專案資料夾</button>
       <div class="hint" style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
         也可以用下面的「匯入專案檔」直接開啟單一 .nvproj 檔案。</div>`;

  $('#pquota').innerHTML = `資料夾：<b data-nt>${esc(_dir.name)}</b>　${_dirEntries.length} 個專案`;

    ? _dirEntries.map((p, i) => `
        <div class="prow${_fh && _fh.name === p.name ? ' cur' : ''}">
          <div class="pmeta"><b data-nt>${esc(p.name.replace(/\.nvproj$/i,''))}</b>
            <span>${p.updated ? new Date(p.updated).toLocaleString(LANG === 'en' ? 'en-US' : 'zh-TW') : ''}　${(p.size/1048576).toFixed(1)} MB</span></div>
          <button class="pri" data-open="${i}">開啟</button>
          <button data-del="${i}">刪除</button>
        </div>`).join('')

  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {

  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => dirDelete(_dirEntries[+b.dataset.del]));

}

/** 退路：瀏覽器儲存的專案清單 */
async function renderIdbList(box){
  const list = await projList().catch(() => []);
  box.innerHTML = list.length
    ? list.map(p => `
        <div class="prow${_curProj && _curProj.id === p.id ? ' cur' : ''}">
          <div class="pmeta"><b data-nt>${esc(p.name)}</b>
            <span>${new Date(p.updated).toLocaleString(LANG === 'en' ? 'en-US' : 'zh-TW')}　${p.state.clips.length} 段</span></div>
          <button class="pri" data-open="${p.id}">開啟</button>
          <button data-del="${p.id}" data-name="${esc(p.name)}">刪除</button>
        </div>`).join('')
    : '<div class="hint" style="padding:12px 4px">還沒有存過任何專案。</div>';
  box.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { $('#pmask').classList.remove('on'); projOpen(b.dataset.open); });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => projDelete(b.dataset.del, b.dataset.name));
}

async function initProject(){

  $('#btnProjOpen').onclick = showProjDialog;

  $('#pGC').onclick = projGC;
  $('#pExport').onclick = () => { $('#pmask').classList.remove('on'); projExportFile(); };
  $('#pImport').onclick = () => $('#fileProj').click();
  $('#fileProj').onchange = e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f){ $('#pmask').classList.remove('on'); projImportFile(f); }
  };
  updateProjBar();
}

</script>

function _twPass(cps, pmap, pfirst, pmax, cmap){

    const ch = cps[i];
