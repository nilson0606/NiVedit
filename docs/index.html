<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// 在畫面出現前套用偏好；第一次使用及儲存不可用時一律為夜間。
try {
  document.documentElement.dataset.theme = localStorage.getItem('nv.theme') === 'light' ? 'light' : 'dark';
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<title>NiVedit — 網頁版影音編輯器</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101216; --bg2:#171a20; --bg3:#1e222a; --line:#2b303a;
  --fg:#e6e9ef; --fg2:#9aa3b2; --fg3:#6b7382;
  --acc:#4c8dff; --acc2:#2f6fd0; --warn:#ff9f43; --danger:#ff5c5c; --ok:#3ecf8e;
  --error-text:#ffb3b3; --ok-line:#2f5c4a; --warn-soft:#ffc46b;
  --kf-start-bg:#192e47; --kf-start-line:#527fae; --kf-start-fg:#cce3ff;
  --kf-end-bg:#322341; --kf-end-line:#936cb7; --kf-end-fg:#eedcff;
  --r:8px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --kf-start-bg:#e5f0ff; --kf-start-line:#5f87ba; --kf-start-fg:#204c7b;
  --kf-end-bg:#f1e6ff; --kf-end-line:#9b73bf; --kf-end-fg:#613d82;
  --bg:#f2f5f9; --bg2:#ffffff; --bg3:#e9eef5; --line:#c6cfdb;
  --fg:#202a39; --fg2:#4d5c70; --fg3:#617086;
  --acc:#2463d4; --acc2:#194eaf; --warn:#955000; --danger:#c9323c; --ok:#16734d;
  --error-text:var(--danger); --ok-line:var(--ok); --warn-soft:var(--warn);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column}
body{
  background:var(--bg); color:var(--fg); overflow:auto;
  font:13px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;cursor:pointer;transition:.12s;white-space:nowrap}
button:hover:not(:disabled){background:#272c36;border-color:#3a4150}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
button.gh{background:transparent}
#themeBtn{padding:3px 9px;font-size:12px;line-height:1.4}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=range]{padding:0;border:none;background:transparent;accent-color:var(--acc)}
input[type=color]{padding:2px;height:32px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
label{color:var(--fg2);font-size:11px}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-thumb{background:#4a5464;border-radius:7px;border:3px solid var(--bg2);min-height:40px}
::-webkit-scrollbar-thumb:hover{background:#5d6879}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-corner{background:var(--bg2)}

/* ── layout ───────────────────────────── */
/* 視窗太小時整頁出現捲軸，不會把面板切掉 */
/* 高度取自 body 的內容框（已經扣掉橫向捲軸），不用 100vh，
   才不會發生「橫捲軸一出現就逼出直捲軸、直捲軸又讓橫捲軸消失」的來回抖動 */
#app{display:flex;flex-direction:column;flex:1 1 auto;min-height:620px;min-width:1024px}
header{display:flex;align-items:center;gap:13px;padding:0 13px;height:48px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.logo{font-weight:800;font-size:16px;letter-spacing:.5px}
.logo span{color:var(--acc)}
.badge{font-size:11px;color:var(--fg3);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.ver{font-size:11px;font-weight:700;color:#101216;background:var(--acc);border-radius:20px;
  padding:2px 9px;letter-spacing:.5px}
.verdate{font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.3px;margin-left:-2px}
.spacer{flex:1}
main{flex:1;display:flex;min-height:0}
aside{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#left{flex:0 0 252px;border-right:1px solid var(--line)}
#right{flex:0 1 300px;min-width:210px;border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--fg2);letter-spacing:.5px;flex:none}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;scrollbar-gutter:stable}
#center{flex:1 1 auto;display:flex;flex-direction:column;min-width:300px;background:var(--bg)}

/* ── stage ────────────────────────────── */
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;position:relative}
#preview{background:#000;border-radius:6px;max-width:100%;max-height:100%;
  box-shadow:0 8px 30px rgba(0,0,0,.5);display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;color:var(--fg3);pointer-events:none;text-align:center}
#empty b{color:var(--fg2);font-size:15px}

/* ── transport ────────────────────────── */
#transport{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);
  background:var(--bg2);flex:none;flex-wrap:wrap}
#playBtn{width:38px;height:34px;display:grid;place-items:center;font-size:14px}
.tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg2);white-space:nowrap;flex:none}
.tc b{color:var(--fg)}

/* ── timeline ─────────────────────────── */
#tlgrip{height:7px;flex:none;background:var(--bg2);border-top:1px solid var(--line);
  cursor:row-resize;position:relative}
#tlgrip::after{content:"";position:absolute;left:50%;top:2px;width:56px;height:3px;margin-left:-28px;
  border-radius:2px;background:#3d4553}
#tlgrip:hover::after{background:var(--acc)}
#tl{height:min(440px,calc(100vh - 330px));background:var(--bg2);border-top:1px solid var(--line);
  display:flex;flex-direction:column;flex:none;user-select:none}
#tlbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg2)}
#tlwrap{flex:1;overflow:auto;position:relative;scrollbar-gutter:stable}
#tlinner{position:relative;min-height:100%;min-width:100%;padding-bottom:4px}
#ruler{height:22px;position:relative;border-bottom:1px solid var(--line);background:var(--bg3)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid #333a46;font-size:10px;
  color:var(--fg3);padding-left:4px;line-height:22px;white-space:nowrap}
.trk{position:relative;margin-top:6px;height:42px}
/* 標籤壓在軌道上緣的留白裡，盡量不要蓋到方塊 */
.trklb{position:absolute;left:5px;top:-4px;font-size:10px;color:var(--fg3);z-index:6;pointer-events:none;
  background:rgba(23,26,32,.9);padding:0 3px;border-radius:3px;display:flex;align-items:center;gap:1px;
  line-height:12px;height:12px}
/* 只有上下箭頭吃得到滑鼠，標籤本身不擋下面的方塊 */
.trklb .ord{pointer-events:auto;cursor:pointer;width:12px;height:11px;line-height:9px;text-align:center;
  border:1px solid var(--line);border-radius:3px;background:var(--bg3);color:var(--fg2);font-size:7px;
  padding:0;user-select:none;flex:none}
.trklb .ord:hover{border-color:var(--acc);color:var(--acc)}
/* 軌道名稱＝拖曳把手。只有這幾個字吃得到滑鼠，其餘標籤照樣不擋方塊 */
.trklb .tkname{pointer-events:auto;cursor:grab;user-select:none;margin-left:2px;
  padding:0 3px;border-radius:3px}
.trklb .tkname:hover{color:var(--fg2);background:var(--bg3)}
.trk.tkdrag{outline:1px dashed var(--acc);outline-offset:-1px;border-radius:6px;
  background:rgba(90,150,255,.09)}
.trk.tkdrag .tkname{cursor:grabbing;color:var(--acc)}
body.tkdragging{cursor:grabbing}
body.tkdragging .blk,body.tkdragging .tblk,body.tkdragging .sblk,
body.tkdragging .oblk,body.tkdragging .mblk{pointer-events:none}
/* 配樂音量曲線：整片不吃滑鼠，只有圓點吃，拖方塊的手感才不會變 */
.vkline{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
.vkline polyline{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5;
  stroke-linejoin:round;stroke-linecap:round}
.vkline.flat polyline{stroke:rgba(255,255,255,.14);stroke-dasharray:3 4}
.vkline .vkd{fill:var(--acc);stroke:#0b0d10;stroke-width:1.2;pointer-events:auto;cursor:ns-resize}
.vkline .vkd:hover{fill:#fff}
/* 動態的兩個時間標記（疊圖／標題方塊上）。只有菱形吃滑鼠，方塊照樣拖得動 */
.kfbar{position:absolute;top:5px;height:2px;background:var(--acc);opacity:.5;
  pointer-events:none;z-index:6;border-radius:1px}
.kfm{position:absolute;top:1px;width:9px;height:9px;margin-left:-4.5px;
  background:var(--acc);border:1px solid rgba(0,0,0,.55);transform:rotate(45deg);
  pointer-events:auto;cursor:ew-resize;z-index:7}
.kfm:hover{background:#fff}
.trklb .ord[disabled]{opacity:.28;cursor:default;border-color:var(--line);color:var(--fg3)}
.trkhint{position:absolute;left:78px;top:14px;font-size:11px;color:#5a6270;pointer-events:none;
  white-space:nowrap;border:1px dashed #2f353f;border-radius:5px;padding:3px 10px}
.blk{position:absolute;top:8px;height:34px;border-radius:5px;overflow:hidden;cursor:pointer;
  border:1px solid #3a4150;background:linear-gradient(180deg,#2c3442,#232a35);display:flex;align-items:center}
.videoLane .blk,.videoLane .trx{height:28px}
.blk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.blk .tn{width:44px;height:100%;object-fit:cover;flex:none;opacity:.85}
.blk .nm{font-size:11px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .mu{position:absolute;right:4px;top:3px;font-size:10px;color:var(--warn)}
.tblk{position:absolute;top:9px;height:32px;border-radius:5px;background:linear-gradient(180deg,#4a3a6b,#382c52);
  border:1px solid #5b4a80;cursor:move;display:flex;align-items:center;padding:0 8px;overflow:hidden}
.tblk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tblk .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tblk .hd,.blk .hd{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;z-index:4}
.tblk .hd.l,.blk .hd.l{left:0}.tblk .hd.r,.blk .hd.r{right:0}
.blk .hd{background:linear-gradient(90deg,rgba(76,141,255,.0),rgba(76,141,255,.0))}
.blk:hover .hd.l{background:linear-gradient(90deg,rgba(76,141,255,.85),rgba(76,141,255,0))}
.blk:hover .hd.r{background:linear-gradient(270deg,rgba(76,141,255,.85),rgba(76,141,255,0))}
.mblk .rep{position:absolute;top:0;height:100%;width:0;border-left:1px dashed rgba(255,255,255,.35)}
.mblk .empty{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,
  rgba(0,0,0,.35) 0 6px,rgba(0,0,0,.15) 6px 12px)}
.sblk{position:absolute;top:9px;height:32px;border-radius:5px;overflow:hidden;cursor:move;
  border:1px solid #2f6f5e;background:linear-gradient(180deg,#1f5a4a,#173f34);display:flex;align-items:center;padding:0 8px}
.sblk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sblk .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.sblk .hd{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;z-index:4}
.sblk .hd.l{left:0}.sblk .hd.r{right:0}
.sblk:hover .hd.l{background:linear-gradient(90deg,rgba(62,207,142,.9),rgba(62,207,142,0))}
.sblk:hover .hd.r{background:linear-gradient(270deg,rgba(62,207,142,.9),rgba(62,207,142,0))}
.oblk{position:absolute;top:9px;height:32px;border-radius:5px;overflow:hidden;cursor:move;
  border:1px solid #7a5a2e;background:linear-gradient(180deg,#5a4526,#3d2f19);display:flex;align-items:center}
.oblk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.oblk .tn{width:40px;height:100%;object-fit:cover;flex:none;opacity:.9}
.oblk .nm{font-size:11px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.oblk .hd{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;z-index:4}
.oblk .hd.l{left:0}.oblk .hd.r{right:0}
.oblk:hover .hd.l{background:linear-gradient(90deg,rgba(255,190,90,.9),rgba(255,190,90,0))}
.oblk:hover .hd.r{background:linear-gradient(270deg,rgba(255,190,90,.9),rgba(255,190,90,0))}
.mblk .hd{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;z-index:4}
.mblk .hd.l{left:0}.mblk .hd.r{right:0}
.mblk:hover .hd.l{background:linear-gradient(90deg,rgba(62,207,142,.85),rgba(62,207,142,0))}
.mblk:hover .hd.r{background:linear-gradient(270deg,rgba(62,207,142,.85),rgba(62,207,142,0))}
.mblk{position:absolute;top:9px;height:32px;border-radius:5px;background:linear-gradient(180deg,#2b5346,#1f3f36);
  border:1px solid #37705d;display:flex;align-items:center;padding:0 8px;cursor:pointer;overflow:hidden}
.mblk.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.trx{position:absolute;top:8px;height:34px;background:rgba(76,141,255,.22);
  border-left:1px dashed var(--acc);border-right:1px dashed var(--acc);pointer-events:none;z-index:2}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:5;pointer-events:none}
#head::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--danger)}

/* ── clip list ────────────────────────── */
.ci{display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg3);margin-bottom:7px;cursor:pointer}
.ci .ops{display:flex;gap:1px;flex:none}
.ci.sel{border-color:var(--acc)}
.ci.drag{opacity:.4}
.ci.over{border-color:var(--ok)}
.ci img{width:52px;height:32px;object-fit:cover;border-radius:4px;background:#000;flex:none}
.ci .meta{flex:1;min-width:0}
.ci .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .s{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .x{flex:none;opacity:.45;padding:1px 3px;font-size:11px;line-height:1.2;
  background:transparent;border:none;color:var(--fg3)}
.ci:hover .x{opacity:1}
.ci .x:disabled{opacity:.12}
.ci .x:hover{color:var(--danger)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px 10px;text-align:center;
  color:var(--fg3);font-size:12px;cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:var(--acc);color:var(--acc);background:rgba(76,141,255,.06)}

/* ── property panel ───────────────────── */
.grp{margin-bottom:12px}
.grp>h4{margin:0 0 8px;font-size:11px;letter-spacing:.6px;color:var(--fg3);
  text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:5px}
.grp>h4.transition-heading,.grp>h4.keyframe-heading,.grp>h4.animation-heading{font-size:15px;font-weight:700;color:var(--fg);letter-spacing:.1px;
  line-height:1.5;border-bottom:2px solid var(--acc);padding-bottom:6px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row.keyframe-toggle>label{font-size:13px;font-weight:600;color:var(--fg)}
.row.keyframe-toggle input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.row.kf-row{padding:5px 6px;border-radius:6px;
  background:var(--kf-start-bg);box-shadow:inset 3px 0 var(--kf-start-line)}
.row.kf-row[data-kf-role="end"]{background:var(--kf-end-bg);box-shadow:inset 3px 0 var(--kf-end-line)}
.row.kf-row>label,.row.kf-row .val{color:var(--kf-start-fg)}
.row.kf-row[data-kf-role="end"]>label,.row.kf-row[data-kf-role="end"] .val{color:var(--kf-end-fg)}
.row.kf-row>label::before{content:"◆ ";font-size:9px}
.row>label{flex:none;width:74px}
.row>.f{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .val{font-size:11px;color:var(--fg3);width:44px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.hint{font-size:11px;color:var(--fg3);line-height:1.6}
/* 僅音量曲線區塊加強可讀性，其他音軌說明維持原樣。 */
#prop .volume-curve-help .hint{font-size:13px;color:var(--fg);line-height:1.75}
#prop .volume-curve-help>h4{font-size:14px;font-weight:700;color:var(--fg)}
.row .f .hint{white-space:nowrap}
.trx .tname{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:9px;
  color:#cfe0ff;background:rgba(16,18,22,.75);border-radius:3px;padding:1px 4px;white-space:nowrap}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:78px;flex:none}
.nine button{padding:0;height:20px;font-size:9px;color:var(--fg3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;font-size:11px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ── modal ────────────────────────────── */
#projbar{padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
#projName{font-size:12px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
#projbar .pbtns{display:flex;gap:4px}
#projbar .pbtns button{flex:1;padding:5px 2px;font-size:12px}
.prow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:7px;background:var(--bg3)}
.prow.cur{border-color:var(--acc)}
.prow .pmeta{flex:1;min-width:0}
.prow .pmeta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pmeta span{font-size:11px;color:var(--fg3)}
#pmask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
  justify-content:center;z-index:110;backdrop-filter:blur(3px)}
#pmask.on{display:flex}
#gmask{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;
  justify-content:center;z-index:60}
#gmask.on{display:flex}
#gGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:9px;
  max-height:56vh;overflow:auto;margin-top:10px;padding:2px}
.gcell{border:1px solid var(--line);border-radius:8px;background:var(--bg3);padding:5px;
  cursor:pointer;text-align:center;transition:.12s}
.gcell:hover{border-color:var(--acc)}
.gcell.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.gcell canvas{width:100%;height:auto;display:block;border-radius:5px;background:#000}
.gcell .gn{font-size:11px;color:var(--fg2);margin-top:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
  justify-content:center;z-index:100;backdrop-filter:blur(3px)}
#mask.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:20px;width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 6px;font-size:16px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7ab0ff);transition:width .2s}
.log{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;min-height:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);
  border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;z-index:200;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#toast.err{border-color:var(--danger);color:#ffb3b3}
.hide{display:none!important}

/* ── AI 字幕 ────────────────────────────────────────────── */
.trx.out{background:rgba(255,159,67,.22);border-color:rgba(255,159,67,.65)}
.rotb.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ckl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);margin:5px 0;cursor:pointer}
.ckl input{margin:0}
#asrbox{flex:0 0 auto;max-height:46%}
#asrbox .row>label{width:36px}
#asrHead{cursor:pointer;user-select:none}
#asrHead:hover{color:var(--acc)}
#left.asrfold #asrbox{display:none}
#qmask{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;
  justify-content:center;z-index:130;backdrop-filter:blur(3px)}
#qmask.on{display:flex}
#emask{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;
  justify-content:center;z-index:120;backdrop-filter:blur(3px)}
#emask.on{display:flex}
#emask .modal h3{display:flex;align-items:center;gap:8px}
.etools{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0;align-items:center}
.etools input{font-size:12px;padding:4px 7px}
#eList{max-height:58vh;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:6px 2px;scrollbar-gutter:stable}
.scue{display:flex;gap:7px;align-items:flex-start;padding:5px 4px;border-radius:6px;
  border:1px solid transparent}
.scue:hover{background:var(--bg3)}
.scue.sel{border-color:var(--acc);background:rgba(76,141,255,.08)}
.scue .n{flex:none;width:96px;text-align:right;font-size:11px;color:var(--fg3);
  font-variant-numeric:tabular-nums;padding-top:6px}
.scue .subTrackSelect{width:96px;font-size:11px;padding:3px;margin-top:4px}
.scue .tm{flex:none;width:104px;display:flex;flex-direction:column;gap:2px}
.scue .ts{font-size:11px;padding:2px 4px;font-variant-numeric:tabular-nums;width:100%}
.scue .dur{font-size:10px;color:var(--fg3);text-align:right}
.scue .tx{flex:1;min-width:0;font-size:13px;line-height:1.5;resize:vertical;padding:5px 7px}
.scue .ops{flex:none;display:flex;flex-direction:column;gap:2px}
.scue .ops .x{padding:1px 5px;font-size:11px;opacity:.5}
.scue:hover .ops .x{opacity:1}
.scue .ops .x:disabled{opacity:.15}
/* 白天模式只改編輯器介面；canvas、縮圖與影片效果保持原色。 */
:root[data-theme="light"] button:hover:not(:disabled){background:#dce5f2;border-color:#95a6bd}
:root[data-theme="light"] button.pri:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
:root[data-theme="light"] .ver{color:#fff}
:root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#a6b3c5}
:root[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:#8394ab}
:root[data-theme="light"] ::-webkit-scrollbar-track{background:rgba(20,40,70,.04)}
:root[data-theme="light"] #tlgrip::after{background:#9daec3}
:root[data-theme="light"] #tlgrip:hover::after{background:var(--acc)}
:root[data-theme="light"] .tick{border-left-color:#b9c5d4}
:root[data-theme="light"] .trklb{background:rgba(255,255,255,.94)}
:root[data-theme="light"] .trkhint{color:var(--fg3);border-color:var(--line)}
:root[data-theme="light"] .blk{background:linear-gradient(180deg,#e3ebf7,#d5e0ef);border-color:#9cafc9}
:root[data-theme="light"] .tblk{background:linear-gradient(180deg,#ede4fa,#dfd0f3);border-color:#b39acc}
:root[data-theme="light"] .sblk{background:linear-gradient(180deg,#dbf2e8,#c3e7d7);border-color:#81b49f}
:root[data-theme="light"] .oblk{background:linear-gradient(180deg,#faecd4,#efdcba);border-color:#c3a373}
:root[data-theme="light"] .mblk{background:linear-gradient(180deg,#ddede7,#c9e2d7);border-color:#85ae9d}
:root[data-theme="light"] :is(.blk,.tblk,.sblk,.oblk,.mblk).sel{border-color:var(--acc)}
:root[data-theme="light"] .mblk .rep{border-left-color:rgba(25,85,65,.4)}
:root[data-theme="light"] .vkline polyline{stroke:rgba(20,50,90,.55)}
:root[data-theme="light"] .vkline.flat polyline{stroke:rgba(20,50,90,.18)}
:root[data-theme="light"] .vkline .vkd{stroke:#fff}
:root[data-theme="light"] .kfm{border-color:rgba(255,255,255,.8)}
:root[data-theme="light"] .mblk .empty{background:repeating-linear-gradient(45deg,rgba(20,60,40,.15) 0 6px,rgba(20,60,40,.05) 6px 12px)}
:root[data-theme="light"] .trx .tname{color:#174884;background:rgba(255,255,255,.9)}
:root[data-theme="light"] #toast.err{color:var(--danger)}
:root[data-theme="light"] .modal{box-shadow:0 20px 60px rgba(20,35,55,.25)}
:root[data-theme="light"] #toast{box-shadow:0 8px 24px rgba(20,35,55,.18)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Ni<span>Vedit</span></div>
    <div class="ver" id="verTag">—</div>
    <div class="verdate" id="verDate" data-nt></div>
    <button class="gh" id="langBtn" data-nt title="English / 繁體中文"
            style="padding:3px 9px;font-size:12px;line-height:1.4">EN</button>
    <button class="gh" id="themeBtn" type="button" data-nt aria-label="白天模式" aria-pressed="false" title="切換至白天模式">☾ 夜間模式</button>
    <div class="badge" id="envBadge">檢查瀏覽器支援中…</div>
    <div class="spacer"></div>
    <div class="tc">總長 <b id="totalDur">00:00.0</b></div>
    <button id="btnExport" class="pri">匯出影片</button>
  </header>

  <main>
    <!-- ── 左：片段 ─────────────────────── -->
    <aside id="left">
      <div class="ph">專案</div>
      <div id="projbar">
        <div id="projName" data-nt>未命名（尚未儲存）</div>
        <div class="pbtns">
          <button class="gh" id="btnProjNew" title="清空目前內容，開始新的專案">新建</button>
          <button class="gh" id="btnProjOpen" title="開啟已儲存的專案">開啟</button>
          <button class="gh" id="btnProjSave" title="儲存到瀏覽器（連素材一起）">儲存…</button>
          <button class="gh" id="btnProjSaveAs" title="另存成新的專案">另存</button>
        </div>
      </div>
      <div class="ph">片段 <span class="spacer"></span><span id="clipCount" style="font-weight:400">0</span></div>
      <div class="pb">
        <div class="drop" id="drop">拖放影片 / 圖片 / 音樂到這裡<br>或點擊選擇檔案
          <div class="hint" style="margin-top:5px">音檔會自動放到音軌，SRT 會變成字幕</div></div>
        <div id="clipList" style="margin-top:10px"></div>
      </div>
      <div class="ph" id="asrHead" title="點一下可以收起來">AI 字幕
        <span class="spacer"></span><span id="asrState" style="font-weight:400">—</span>
        <span id="asrFold" style="font-weight:400;color:var(--fg3)">▾</span></div>
      <div class="pb" id="asrbox"></div>
    </aside>

    <!-- ── 中：預覽 ─────────────────────── -->
    <section id="center">
      <div id="stage">
        <canvas id="preview" width="1920" height="1080"></canvas>
        <div id="empty">
          <b>還沒有素材</b>
          <div>從左邊加入影片就可以開始剪了</div>
        </div>
      </div>

      <div id="transport">
        <button id="playBtn" title="播放 / 暫停（空白鍵）">▶</button>
        <button class="gh" id="btnStart" title="回到開頭">⏮</button>
        <button class="gh" id="btnEnd" title="跳到結尾">⏭</button>
        <div class="tc"><b id="curTime">00:00.0</b> / <span id="endTime">00:00.0</span></div>
        <input type="range" id="seekBar" min="0" max="1000" step="1" value="0"
               title="拖曳可跳到影片任何位置" style="flex:1;min-width:110px;margin:0 6px">
        <button class="gh" id="btnAddImage" title="把圖片插進影片軌，佔一段時間">＋ 圖片</button>
        <button class="gh" id="btnAddOverlay" title="把圖片疊在畫面上方，底下影片照播">＋ 疊圖</button>
        <button class="gh" id="btnAddSub" title="匯入 SRT 字幕檔，或在字幕軌雙擊新增一句">＋ 字幕</button>
        <button class="gh" id="btnAddTitle">＋ 標題</button>
        <button class="gh" id="btnAddMusic">＋ 音軌</button>
        <button class="gh" id="btnProj">專案設定</button>
      </div>

      <!-- ── 時間軸 ────────────────────── -->
      <div id="tlgrip" title="上下拖曳可以調整時間軸區塊的高度"></div>
      <div id="tl">
        <div id="tlbar">
          <span>時間軸</span>
          <span class="spacer" style="flex:1"></span>
          <button class="gh" id="btnUndo" disabled>↶ 復原</button>
          <button class="gh" id="btnRedo" disabled>↷ 重做</button>
          <span class="hint" style="margin-right:6px">滾輪左右捲動 · Ctrl＋滾輪縮放</span>
          <span>縮放</span>
          <input type="range" id="zoom" min="2" max="400" value="80" style="width:110px">
          <button class="gh" id="btnFit" title="讓整支影片剛好塞進視窗">符合視窗</button>
          <button class="gh" id="btnSplit" title="在播放頭切開目前片段">✂ 分割</button>
          <button class="gh" id="btnDel" title="刪除選取項目（Delete）">刪除</button>
        </div>
        <div id="tlwrap">
          <div id="tlinner">
            <div id="ruler"></div>
            <div class="trk" id="trkVideo" data-tk="video"></div>
            <div class="trk" id="trkOver"  data-tk="over"></div>
            <div class="trk" id="trkSub"   data-tk="sub"></div>
            <div class="trk" id="trkTitle" data-tk="title"></div>
            <div class="trk" id="trkMusic" data-tk="music"></div>
            <div id="head" style="left:0"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── 右：屬性 ─────────────────────── -->
    <aside id="right">
      <div class="ph" id="propTitle">屬性</div>
      <div class="pb" id="prop"></div>
    </aside>
  </main>
</div>

<div id="mask">
  <div class="modal">
    <h3 id="mTitle">匯出中</h3>
    <div class="hint" id="mSub">正在合成影格…</div>
    <div class="bar"><i id="mBar"></i></div>
    <div class="log" id="mLog">—</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button id="mCancel">取消</button>
      <button id="mClose" class="pri hide">完成</button>
    </div>
  </div>
</div>

<div id="pmask">
  <div class="modal" style="width:520px">
    <h3>專案</h3>
    <div class="hint" id="pquota" style="margin-bottom:8px"></div>
    <div id="pbody" style="max-height:46vh;overflow:auto"></div>
    <div id="pfoot">
      <div style="display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <button id="pExport" style="flex:1">匯出專案檔</button>
        <button id="pImport" style="flex:1">匯入專案檔</button>
        <button id="pGC" title="刪掉沒有任何專案在使用的素材">清理素材</button>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px">
      <button id="pClose" class="pri">關閉</button>
    </div>
  </div>
</div>

<div id="gmask">
  <div class="modal" style="width:min(900px,94vw)">
    <h3 id="gTitle">選擇</h3>
    <div class="hint" style="margin-bottom:8px">點一下就直接套用，可以邊看邊挑。</div>
    <div class="chips" id="gTabs"></div>
    <div id="gGrid"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button id="gClose" class="pri">關閉</button>
    </div>
  </div>
</div>

<div id="qmask">
  <div class="modal" style="width:440px">
    <h3 id="qTitle">請選擇</h3>
    <div class="hint" id="qMsg" style="line-height:1.7"></div>
    <div id="qBtns" style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"></div>
  </div>
</div>

<div id="emask">
  <div class="modal" style="width:min(760px,95vw)">
    <h3>字幕編輯器 <span class="spacer"></span><span id="eCount" class="hint"></span></h3>
    <div class="row">
      <label for="eTrack" style="font-weight:700;color:var(--fg)">編輯軌道</label>
      <div class="f"><select id="eTrack" style="font-weight:700;max-width:220px">
        <option value="1">字幕上軌</option><option value="0">字幕下軌</option>
      </select></div>
    </div>
    <div class="hint" style="margin-bottom:10px">只顯示目前軌道；新增、整批操作與存成 SRT 都只作用於本軌。</div>
    <div class="etools">
      <input id="eFind" placeholder="找這個字…" style="flex:1;min-width:90px">
      <input id="eRepl" placeholder="換成…" style="flex:1;min-width:90px">
      <button class="gh" id="eRepl2">整批取代</button>
      <button class="gh" id="eTW" title="把還是簡體的句子轉成台灣正體">轉台灣正體</button>
      <button class="gh" id="eAdd" title="在播放頭的位置插一句">＋ 一句</button>
      <button class="gh" id="eSrt">存成 SRT</button>
      <button class="gh" id="eClear" title="刪掉目前字幕軌的全部字幕">清空本軌</button>
    </div>
    <div id="eList"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <span class="hint">改完直接關掉就好，預覽會即時跟著變。時間格式：時:分:秒,毫秒</span>
      <span class="spacer"></span>
      <button id="eClose" class="pri">關閉</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileAny" multiple class="hide"
       accept="video/*,audio/*,image/*,.srt,.vtt,.mp4,.mov,.webm,.mkv,.m4v,.mp3,.wav,.m4a,.aac,.ogg,.flac">
<input type="file" id="fileVideo" accept="video/*" multiple class="hide">
<input type="file" id="fileAudio" accept="audio/*" multiple class="hide">
<input type="file" id="fileImage" accept="image/*" multiple class="hide">
<input type="file" id="fileOverlay" accept="image/*" multiple class="hide">
<input type="file" id="fileProj" accept=".nvproj" class="hide">
<input type="file" id="fileSub" accept=".srt,.txt,text/plain" multiple class="hide">
<div id="videoPool" class="hide"></div>

<script>
/* ══ 介面語言（English / 繁體中文）══════════════════════════════
   做法：程式碼裡的字串一律維持中文（那也是這個專案的文件），
   畫完之後再掃一次 DOM 把文字換掉。這樣有幾個好處：

   1. 呼叫端一行都不用改，1600 多處字串不會變成 T('some.key')。
   2. 查不到的字自動留中文，永遠不會出現空白或 key。
   3. 只動 DOM，不動資料 —— 檔名、字幕內容、專案名都不會被翻到。

   兩層比對：
     第一層 整個文字節點完全吻合（面板、按鈕、選單、說明幾乎都是這種）
     第二層 沒吻合就用「長的優先」把片語換掉，
            拿來處理 `已匯入 ${n} 句字幕` 這種夾了變數的訊息。
            「」" " 裡面的東西（多半是使用者的檔名）不碰。

   使用者自己的文字（片段名稱、時間軸上的字幕）掛 data-nt，整段跳過。 */

let LANG = 'en';
try { const s = localStorage.getItem('nv.lang'); if (s === 'zh' || s === 'en') LANG = s; } catch (e) {}

const _TRMAP = new Map();     // 正規化後的中文 → 英文
const _TRRAW = new Map();     // 原樣中文 → 英文（第二層用）
let   _TRRE  = null;          // 第二層的比對式（長的排前面）

const _HAN = /[㐀-鿿豈-﫿\uD840-\uD87F]/;
const _norm = s => s.replace(/\s+/g, ' ').trim();

(function buildDict(){
  const rows = (typeof I18N_EN === 'string' ? I18N_EN : '').split('\n');
  const keys = [];
  for (const row of rows){
    if (!row) continue;
    const i = row.indexOf('\t');
    if (i < 0) continue;
    const zh = row.slice(0, i), en = row.slice(i + 1);
    if (!zh) continue;
    _TRMAP.set(_norm(zh), en);
    _TRRAW.set(zh, en);
    keys.push(zh);
  }
  keys.sort((a, b) => b.length - a.length);       // 長的先比，短的才不會先咬掉
  if (keys.length){
    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    _TRRE = new RegExp(keys.map(esc).join('|'), 'g');
  }
})();

/** 一段文字 → 英文。查不到就原樣回去。 */
function L(s){
  if (LANG !== 'en' || !s) return s;
  const hit = _TRMAP.get(_norm(s));
  if (hit !== undefined) return _keepPad(s, hit);
  if (!_HAN.test(s) || !_TRRE) return s;
  return _frag(s);
}

/** 原字串前後的空白留著，換掉的只有中間那塊 */
function _keepPad(s, out){
  const a = s.match(/^\s*/)[0], b = s.match(/\s*$/)[0];
  return (a && !/^\s/.test(out) ? a : '') + out + (b && !/\s$/.test(out) ? b : '');
}

/** 第二層：片語替換。「」『』“” 裡面是使用者的東西（多半是檔名），不碰；
    引號本身留在可翻譯的那一段，「」載入失敗：」這種以引號開頭的片語才比對得到。 */
const _QUOTED = /((?<=「)[^」]*(?=」)|(?<=『)[^』]*(?=』)|(?<=“)[^”]*(?=”))/;
function _frag(s){
  const parts = s.split(_QUOTED);
  for (let i = 0; i < parts.length; i += 2)
    parts[i] = parts[i].replace(_TRRE, m => _TRRAW.get(m));
  // 中文本來就沒有詞間空白，換成英文之後常常會多出一格
  return parts.join('').replace(/ {2,}/g, ' ');
}

/* ── DOM 掃描 ────────────────────────────────────────────────
   每個節點記著 { src 原文, out 我們寫出去的字 }。
   下次再掃時如果現在的字就是 out，代表沒人動過，用 src 重翻；
   不一樣就表示程式自己改過（例如時間碼），把新的當成新原文。
   —— 少了這一段，每秒重寫的時間碼會被舊字蓋回去。 */
const _oT = new WeakMap();    // 文字節點
const _oA = new WeakMap();    // 元素的 title / placeholder / aria-label
const _ATTRS = ['title', 'placeholder', 'aria-label'];
const _SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, CANVAS: 1, NOSCRIPT: 1 };

function _skip(el){
  for (let n = el; n && n !== document.documentElement; n = n.parentElement)
    if (n.nodeType === 1 && n.hasAttribute('data-nt')) return true;
  return false;
}

function _doText(n){
  const rec = _oT.get(n);
  let src = n.nodeValue;
  if (rec && rec.out === src) src = rec.src;
  else if (!rec && !_HAN.test(src)) return;          // 沒中文又沒翻過，跳過
  const out = LANG === 'en' ? L(src) : src;
  if (out !== n.nodeValue) n.nodeValue = out;
  _oT.set(n, { src, out });
}

function _doAttrs(el){
  let rec = _oA.get(el);
  for (const a of _ATTRS){
    if (!el.hasAttribute(a)) continue;
    const cur = el.getAttribute(a);
    const r = rec && rec[a];
    let src = cur;
    if (r && r.out === cur) src = r.src;
    else if (!r && !_HAN.test(cur)) continue;
    const out = LANG === 'en' ? L(src) : src;
    if (out !== cur) el.setAttribute(a, out);
    if (!rec){ rec = {}; _oA.set(el, rec); }
    rec[a] = { src, out };
  }
}

function i18nSweep(root){
  if (!root) return;
  if (root.nodeType === 3){ if (!_skip(root.parentElement)) _doText(root); return; }
  if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
  if (root.nodeType === 1 && (_SKIP[root.tagName] || _skip(root))) return;
  if (root.nodeType === 1) _doAttrs(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode(n){
      if (n.nodeType === 1)
        return (_SKIP[n.tagName] || n.hasAttribute('data-nt'))
          ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while ((n = w.nextNode())) n.nodeType === 1 ? _doAttrs(n) : _doText(n);
}

/* 任何新畫出來的東西都掃一次。只掃「這次多出來的」，所以很便宜。 */
let _mo = null;
function i18nWatch(){
  if (_mo || typeof MutationObserver === 'undefined') return;
  _mo = new MutationObserver(recs => {
    for (const r of recs){
      if (r.type === 'characterData') { if (!_skip(r.target.parentElement)) _doText(r.target); }
      else if (r.type === 'attributes'){ if (!_skip(r.target)) _doAttrs(r.target); }
      else for (const n of r.addedNodes) i18nSweep(n);
    }
    _mo.takeRecords();          // 丟掉剛剛自己改出來的那些，免得無限繞
  });
  _mo.observe(document.body, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: _ATTRS
  });
}

function _setTitle(){
  const v = (typeof VER === 'string' && VER) ? ' ' + VER : '';
  document.title = LANG === 'en'
    ? `NiVedit${v} — Web Video Editor`
    : `NiVedit${v} — 網頁版影音編輯器`;
}

function setLang(l){
  if (l !== 'en' && l !== 'zh') return;
  LANG = l;
  try { localStorage.setItem('nv.lang', l); } catch (e) {}
  document.documentElement.lang = l === 'en' ? 'en' : 'zh-Hant-TW';
  _setTitle();
  const b = document.getElementById('langBtn');
  if (b) b.textContent = l === 'en' ? 'EN' : '繁中';
  if (typeof updateThemeButton === 'function') updateThemeButton();
  i18nSweep(document.body);
  try { if (typeof render === 'function') render(); } catch (e) {}
}

function i18nInit(){
  const b = document.getElementById('langBtn');
  if (b){
    b.textContent = LANG === 'en' ? 'EN' : '繁中';
    b.onclick = () => setLang(LANG === 'en' ? 'zh' : 'en');
  }
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant-TW';
  _setTitle();
  i18nSweep(document.body);
  i18nWatch();
}

  if (!b) return;
  const light = document.documentElement.dataset.theme === 'light';
  b.textContent = (light ? '☀ ' : '☾ ') + L(light ? '白天模式' : '夜間模式');
  b.title = L(light ? '切換至夜間模式' : '切換至白天模式');

}
function setTheme(theme){
  if (theme !== 'light' && theme !== 'dark') return;
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('nv.theme', theme); } catch (e) {}
  updateThemeButton();
}
function themeInit(){
  const b = document.getElementById('themeBtn');
  if (!b) return;
  b.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  // 空白鍵保留原生按鈕操作，不讓時間軸快捷鍵攔走。
  b.addEventListener('keydown', e => { if (e.code === 'Space') e.stopPropagation(); });
  updateThemeButton();
}

/** 有沒有真的做了調整（全部是 0 就不用多跑那幾個 pass） */
function hasGrade(g){
  return !!g && (g.bri || g.con || g.sat || g.temp || g.tint || g.sharp ||
                 g.sepia || g.fade || g.vig || g.grain || g.bloom);
}

/** 把風格預設套到某一段上 */
function applyGradePreset(c, id){
  const p = GRADE_PRESETS.find(x => x.id === id);
  if (!p || !c) return;
  pushUndo();
  c.grade = Object.assign({}, GRADE0, p.s, { preset: id });
}

/** 把這一段的調整複製到其他所有片段 */
function copyGradeToAll(c){
  if (!c) return;
  pushUndo();
  for (const x of A.clips) if (x !== c) x.grade = Object.assign({}, GRADE0, c.grade);
}

/* ── 復原 / 重做 ────────────────────────────────────────────────
   只把「編輯資料」存進歷史，媒體本身（video/img/audio 元素、檔案、
   解碼後的音訊）放在 MEDIA 這個登記表，用 id 對回去。
   所以復原不會重載檔案，刪掉的東西也還原得回來。
   ─────────────────────────────────────────────────────────── */
const MEDIA = new Map();
const UNDO_MAX = 60;
const _undo = [], _redo = [];

function regMedia(item, extra){
  MEDIA.set(item.id, Object.assign({
    file: item.file, url: item.url, el: item.el, video: item.video,
    img: item.img, thumb: item.thumb, _gif: item._gif
  }, extra || {}));
  if (item._gif) item._gif.pending = false;
}
const _OMIT = ['file','url','el','video','img','thumb','buf','audioBuf','_ab','_gif'];
const _strip = o => { const r = {}; for (const k in o) if (!_OMIT.includes(k)) r[k] = o[k]; return r; };

function snapshot(){
  return JSON.stringify({
    clips: A.clips.map(_strip), titles: A.titles.map(_strip),
    musics: A.musics.map(_strip), overlays: A.overlays.map(_strip),
    subs: A.subs.map(_strip), subStyle: { ...A.subStyle }, subStyleUpper:A.subStyleUpper || null,
    proj: { ...A.proj }, sel: { ...A.sel }
  });
}
/** 動作發生「之前」呼叫。內容沒變就不會重複記。 */
function pushUndo(){
  const s = snapshot();
  if (_undo.length && _undo[_undo.length - 1] === s) return;
  _undo.push(s);
  if (_undo.length > UNDO_MAX) _undo.shift();
  _redo.length = 0;
  pruneGifMedia();
  updateUndoBtns();
}
function applySnapshot(json){
  const s = JSON.parse(json);
  const hydrate = arr => arr.map(o => Object.assign({}, o, MEDIA.get(o.id) || {}));
  A.clips = hydrate(s.clips);
  A.titles = hydrate(s.titles);
  A.musics = hydrate(s.musics);
  A.overlays = hydrate(s.overlays);
  A.subs = (s.subs || []).map(o => ({ ...o }));
  if (s.subStyle) Object.assign(A.subStyle, s.subStyle);
  A.subStyleUpper=s.subStyleUpper ? {...s.subStyleUpper} : null;
  Object.assign(A.proj, s.proj);
  upgradeClipSettings(s.proj || {});
  A.sel = s.sel;
  A.playhead = clamp(A.playhead, 0, totalDur());
  render(); refreshProp(); updateUndoBtns();
}
function undo(){
  if (!_undo.length){ toast('沒有可以復原的動作'); return; }
  _redo.push(snapshot());
  applySnapshot(_undo.pop());
  toast(`已復原（還可復原 ${_undo.length} 步）`);
}
function redo(){
  if (!_redo.length){ toast('沒有可以重做的動作'); return; }
  _undo.push(snapshot());
  applySnapshot(_redo.pop());
  toast(`已重做（還可重做 ${_redo.length} 步）`);
}
function updateUndoBtns(){
  const u = $('#btnUndo'), r = $('#btnRedo');
  if (u){ u.disabled = !_undo.length; u.title = `復原（Ctrl+Z）　剩 ${_undo.length} 步`; }
  if (r){ r.disabled = !_redo.length; r.title = `重做（Ctrl+Y）　剩 ${_redo.length} 步`; }
}

/* ── 小工具 ────────────────────────────────────────────────── */
function fmt(t){
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`;
}
let toastTimer;
function toast(msg, err){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'on' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', err ? 4200 : 2400);
}

/* ── 時間軸計算 ────────────────────────────────────────────────
   轉場採「重疊」模式：轉場時間由前後兩段共用，總長會縮短。
   clip.trans 代表「進入這一段」的轉場（第一段沒有接縫，故忽略）。
   ─────────────────────────────────────────────────────────── */
const clipDur = c => Math.max(0.05, c.outP - c.inP);
/** 這一段最後畫出來的尺寸（含使用者自己轉的角度） */
function clipSize(c){
  const r = ((c.rot || 0) % 360 + 360) % 360;
  return (r % 180) ? { w: c.h, h: c.w } : { w: c.w, h: c.h };
}

/** 片段拿來畫的來源：影片是 <video>，圖片是 <img> */
const clipSource = c => c.exportSrc || c.el;
const isImg = c => c.kind === 'image';
const IMG_MAX = 600;          // 圖片最長可以停留幾秒
/** 配樂一輪可用的長度（扣掉從音檔第幾秒開始） */
const musicSeg = m => Math.max(0.5, (m.dur || 0) - m.offset);
/** 沒有手動拉過長度的音軌，跟著影片總長自動延伸 */
function syncAutoLens(){
  const tot = totalDur();
  for (const m of A.musics){
    if (m.autoLen) m.len = Math.max(0.5, (m.loop ? tot : Math.min(musicSeg(m), tot)) - m.startAt);
    m.len = Math.max(0.3, Math.min(m.len, Math.max(0.3, tot - m.startAt)));
  }
}

// track 0 = 下軌（舊專案），track 1 = 上軌；兩軌各自串接。
const clipTrack = c => c && c.track === 1 ? 1 : 0;
const VIDEO_MODES = [
  ['overlap','內扣（使用原片動態畫面）'],
  ['add','外加（延長首尾定格畫面）']
];
function clipMode(c){return c.transMode==='add'?'add':'overlap';}
function clipFadeLens(c,span){
  let fi=Math.max(0,Number(c.fadeIn)||0),fo=Math.max(0,Number(c.fadeOut)||0);
  if(fi+fo>span&&fi+fo>0){const k=span/(fi+fo);fi*=k;fo*=k;}
  return [fi,fo];
}
function clipFadeGain(c,T,q){
  const [fi,fo]=clipFadeLens(c,q.span),t=T-q.startAt;
  return clamp(Math.min(1,fi>0?t/fi:1,fo>0?(q.span-t)/fo:1),0,1);
}
// 舊版每軌轉場複製到各片段；整片淡化移到每軌首段／末段，之後各段獨立。
function upgradeClipSettings(proj){
  for(const track of [0,1]){
    const clips=A.clips.filter(c=>clipTrack(c)===track);
    const legacy=proj.videoModes&&proj.videoModes[track];
    for(const [i,c] of clips.entries()){
      if(c.transMode==null)c.transMode=legacy==='add'||(!legacy&&proj.transAdd===true)?'add':'overlap';
      if(c.fadeIn==null)c.fadeIn=i===0?Math.max(0,+proj.fadeIn||0):0;
      if(c.fadeOut==null)c.fadeOut=i===clips.length-1?Math.max(0,+proj.fadeOut||0):0;
      if(c.fadeAudio==null)c.fadeAudio=proj.fadeAudio!==false;
    }
  }
  for(const key of ['videoModes','transAdd','fadeIn','fadeOut','fadeAudio'])delete A.proj[key];
}
function clipEdges(c){
  const add=clipMode(c)==='add',d=clipDur(c);
  let head=c.trans&&c.trans.type!=='none'?Math.max(0,c.trans.dur||0):0;
  let tail=c.transOut&&c.transOut.type!=='none'?Math.max(0,c.transOut.dur||0):0;
  if(!add&&head+tail>d*.95){const k=d*.95/(head+tail);head*=k;tail*=k;}
  return {add,head,tail,span:d+(add?head+tail:0)};
}
function layout(){
  const L=[],prev=[-1,-1];
  A.clips.forEach((c,i)=>{
    const track=clipTrack(c),pi=prev[track],edge=clipEdges(c),dur=clipDur(c);
    const startAt=Math.max(pi<0?0:L[pi].end,Number.isFinite(c.at)?c.at:0);
    const start=startAt+(edge.add?edge.head:0),end=startAt+edge.span;
    L.push({startAt,start,end,span:edge.span,dur,track,prev:pi,mode:clipMode(c),
      add:edge.add,inDur:edge.head,outDur:edge.tail,tr:edge.head,trAt:startAt});
    prev[track]=i;
  });
  return L;
}
function totalDur(){return layout().reduce((end,q)=>Math.max(end,q.end),0);}
function nextClipIndex(i, L){
  L = L || layout();
  return L.findIndex(q => q.prev === i);
}
/** 放進指定影片軌與時間。同軌按先後串接，不產生第三層重疊。 */
function placeClip(c,track,at){
  pinFreeClips();
  const L=layout(),i=A.clips.indexOf(c);if(i<0)return;
  at=Math.max(0,Number.isFinite(at)?at:L[i].startAt);
  const peers=A.clips.filter(x=>x!==c&&clipTrack(x)===track),span=clipEdges(c).span;
  for(const x of peers){
    const q=L[A.clips.indexOf(x)];
    if(at<q.end-1e-6&&at+span>q.startAt+1e-6)at=q.end;
  }
  const before=peers.find(x=>at<L[A.clips.indexOf(x)].startAt);
  A.clips.splice(i,1);c.track=track;c.at=at;
  const to=before?A.clips.indexOf(before):peers.length?A.clips.indexOf(peers[peers.length-1])+1:A.clips.length;
  A.clips.splice(to,0,c);
}
function pinFreeClips(){
  const L=layout();A.clips.forEach((c,i)=>c.at=L[i].startAt);
}
/** 屬性裁切保持時間軸起點；向右延長不能覆蓋同軌下一段。 */
function clipRoom(c){
  const L=layout(),i=A.clips.indexOf(c),ni=nextClipIndex(i,L);
  return ni<0 ? Infinity : Math.max(.1,L[ni].startAt-L[i].start-(L[i].add?L[i].outDur:0));
}
function trimClip(c,from,to){
  c.inP=clamp(from,0,c.outP-.1);
  c.outP=clamp(to,c.inP+.1,Math.min(c.dur,c.inP+clipRoom(c)));
}

/** 回傳某個時間點該畫什麼：a=主片段，b=轉場中的下一段 */
/* ── 字幕跟著影片走 ──────────────────────────────────────────
   字幕存的是「時間軸上的絕對秒數」，可是片段一被搬動、裁切、
   換轉場接法，每一段的起點就都變了，字幕會整批對不上。
   解法：每一句字幕記住「我屬於哪一段、在那一段素材的第幾秒」，
   排版一變就把它搬回同一個畫面上。
   ─────────────────────────────────────────────────────────── */
/** 記住某一句字幕現在對到哪一段素材的哪一秒 */
const subTrack=c=>c && c.track===1 ? 1 : 0;
function subStyleFor(track){
  if(track!==1)return A.subStyle;
  if(!A.subStyleUpper)A.subStyleUpper={...A.subStyle,marginY:.2};
  return A.subStyleUpper;
}
function subtitleTargetTrack(){
  if(A.sel.type==='sub')return subTrack(A.subs.find(c=>c.id===A.sel.id));
  if(A.sel.type==='clip')return clipTrack(A.clips.find(c=>c.id===A.sel.id));
  return 0;
}
function tagSub(c, L, preferred){
  L = L || layout();
  c.cid = null; c.cs = 0;
  const indices=L.map((_,i)=>i).reverse();
  const pi=A.clips.findIndex(x=>x.id===preferred);
  if(pi>=0){indices.splice(indices.indexOf(pi),1);indices.unshift(pi);}
  for (const i of indices){
    if (c.start >= L[i].start - 1e-9 && c.start < L[i].start + L[i].dur + 1e-6){
      c.cid = A.clips[i].id;
      c.cs = A.clips[i].inP + (c.start - L[i].start);   // 記素材時間，裁頭也跟得上
      break;
    }
  }
  c._at = c.start;                 // 記下「我們認可的位置」，用來分辨後來有沒有被手動搬過
}
function tagSubs(){ const L = layout(); for (const c of A.subs) tagSub(c, L); A._laySig = layoutSig(L); }

function layoutSig(L){
  L = L || layout();
  return A.clips.map((c, i) => c.id + '@' + L[i].start.toFixed(4) + '+' + L[i].dur.toFixed(4)
                               + '#' + c.inP.toFixed(4)).join('|');
}

/** 排版變了就把字幕搬回原來對到的畫面上。
    自己會分辨「使用者手動拖過的字幕」（start 跟上次記的不一樣），那種就重新記位置，
    所以不用在每個會動到字幕的地方都補一行呼叫。 */
function syncSubsToClips(){
  const L = layout();
  const sig = layoutSig(L);
  const changed = sig !== A._laySig;
  A._laySig = sig;
  let moved = 0;
  for (const c of A.subs){
    if (c.cid === undefined || c._at === undefined || Math.abs(c.start - c._at) > 1e-4){
      tagSub(c, L);                     // 新加的、匯入的、剛被拖過的 —— 以現在的位置為準
      continue;
    }
    if (!changed || !c.cid) continue;
    const i = A.clips.findIndex(x => x.id === c.cid);
    if (i < 0) continue;
    const want = L[i].start + (c.cs - A.clips[i].inP);
    const d = want - c.start;
    if (Math.abs(d) > 1e-4){ c.start += d; c.end += d; moved++; }
    // 只有還落在自己那一段裡面才重新記位置。
    // 被裁到段外的（那句話已經被剪掉了）維持原本的對應關係，
    // 之後把裁切拉回來，字幕就會自己回到原位。
    if (c.start >= L[i].start - 1e-9 && c.start < L[i].start + L[i].dur + 1e-6) tagSub(c, L, A.clips[i].id);
    else c._at = c.start;
  }
  return moved;
}

/** 舊排版的某個時間點，換算成新排版的同一個位置（以「在第幾段的第幾秒」為準） */
function remapTime(t, Lold, Lnew){
  for (let i = Lold.length - 1; i >= 0; i--){
    if (t >= Lold[i].start - 1e-9) return Math.max(0, Lnew[i].start + (t - Lold[i].start));
  }
  return t;
}
/** 舊版全片重排工具（保留供相容）；v9.1 各片段轉場設定不呼叫此函式 */
function remapAllTimes(Lold, Lnew){
  if (!Lold.length || Lold.length !== Lnew.length) return;
  const R = t => remapTime(t, Lold, Lnew);
  for (const arr of [A.titles, A.overlays]){
    for (const o of arr){
      const st = R(o.start), en = R(o.end);
      o.start = st;
      o.end = Math.max(st + 0.2, en);
    }
  }
  for (const m of A.musics) m.startAt = R(m.startAt);
}

/** 這一段「離開時的轉場」佔用的時間窗（絕對秒數）。沒設就回 null。

    內扣使用原片尾段，外加在原片之後延長定格時間；均由本段 layout 邊界決定。 */
function outWindow(i,L=layout()){
  const c=A.clips[i],q=L[i];
  if(!c||!q||!(q.outDur>0))return null;
  return {start:q.end-q.outDur,end:q.end,dur:q.outDur,type:c.transOut.type};
}
function outGain(i,T,L){const w=outWindow(i,L);return !w||T<=w.start?1:T>=w.end?0:1-(T-w.start)/w.dur;}
function clipMixGain(i,T,L){
  const q=L[i],c=A.clips[i],t=T-q.start,fade=c.fadeAudio===false?1:clipFadeGain(c,T,q);
  if(t<0||t>=q.dur)return 0;
  if(q.add){const e=Math.min(.04,q.dur/4);return fade*Math.min(1,t/e,(q.dur-t)/e);}
  let g=outGain(i,T,L);
  if(q.inDur>0)g=Math.min(g,clamp(t/q.inDur,0,1));
  return fade*g;
}
function activeAt(T,track=0,L=layout()){
  let i=-1;
  for(let k=0;k<L.length;k++){
    const q=L[k];
    if(q.track===track&&T>=q.startAt-1e-9&&T<q.end)i=k;
  }
  const total=L.reduce((end,q)=>Math.max(end,q.end),0);
  if(i<0&&Math.abs(T-total)<1e-6)i=L.findIndex(q=>q.track===track&&Math.abs(q.end-total)<1e-6);
  if(i<0)return null;
  const c=A.clips[i],q=L[i],held=q.add&&(T<q.start||T>=q.start+q.dur);
  const a={clip:c,t:c.inP+clamp(T-q.start,0,Math.max(0,q.dur-.0001)),T,hold:held};
  const entering=q.inDur>0&&T<q.startAt+q.inDur;
  const w=outWindow(i,L),out=w&&T>=w.start?{type:w.type,p:clamp((T-w.start)/w.dur,0,1)}:null;
  return {a,b:null,p:0,type:null,idx:i,track,
    intro:entering?{type:c.trans.type,p:clamp((T-q.startAt)/q.inDur,0,1)}:null,out};
}
function activeTracksAt(T){const L=layout();return [activeAt(T,0,L),activeAt(T,1,L)].filter(Boolean);}

/* ── 素材匯入 ──────────────────────────────────────────────── */
/** 一批檔案進來，依副檔名／型別各自送到對的地方。
    左側素材區的點擊、拖曳到視窗，兩條路都走這裡，行為才會一致。 */
async function addAnyFiles(files){
  const fs = [...(files || [])];
  if (!fs.length) return;
  const au = fs.filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|m4a|aac|ogg|flac|opus)$/i.test(f.name));
  const sr = fs.filter(f => /\.(srt|vtt)$/i.test(f.name));
  const pj = fs.filter(f => /\.nvproj$/i.test(f.name));
  const im = fs.filter(f => f.type.startsWith('image/') || /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(f.name));
  const vi = fs.filter(f => !au.includes(f) && !im.includes(f) && !sr.includes(f) && !pj.includes(f));
  if (vi.length) await addVideoFiles(vi);
  if (im.length) await addImageFiles(im);          // 圖片預設插進影片軌
  for (const f of au) await addMusicFile(f);
  for (const f of sr) await importSRT(f);
  if (pj.length && typeof projImportFile === 'function') await projImportFile(pj[0]);
}

async function addVideoFiles(files){
  const list = [...files].filter(f => f.type.startsWith('video/') || /\.(mp4|mov|webm|mkv|m4v|avi)$/i.test(f.name));
  if (!list.length){ toast('沒有偵測到影片檔', true); return; }
  pushUndo();
  for (const f of list){
    try { await addVideo(f); }
    catch(e){ console.error(e); toast(`「${f.name}」載入失敗：${e.message}`, true); }
  }
  render();
  fitZoom();          // 匯入後自動把整支影片縮到看得完
  refreshProp();
}

function addVideo(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    // 這裡刻意「不設」crossOrigin：素材一律是 URL.createObjectURL(File)，
    // blob 網址本來就同源，不需要 CORS；而 file:// 開的頁面沒有正常來源，
    // 設了反而讓 CORS 檢查過不了，畫面照放但畫布會被當成被汙染，匯出就死。
    // 萬一某個環境相反，匯出前的 healSources() 會實測後自動換掉。
    v.src = url; v.preload = 'auto'; v.playsInline = true; v.muted = true;
    const fail = () => rej(new Error('瀏覽器無法解碼這個檔案'));
    v.onerror = fail;
    v.onloadedmetadata = async () => {
      // 一次性：用完就拆掉。這個元素之後可能會被重新指定 src（素材重接、
      // 修畫布汙染），沒拆掉的話「建立片段」會再跑一次，片段就無限增生。
      v.onloadedmetadata = null; v.onerror = null;
      if (!isFinite(v.duration) || v.duration <= 0) return fail();
      const c = {
        id: uid(), kind: 'video', name: file.name, file, url, video: v, el: v,
        dur: v.duration, w: v.videoWidth, h: v.videoHeight,
        inP: 0, outP: v.duration, muted: false, vol: 1,
        x: 0.5, y: 0.5, scale: 1, opacity: 1, motionRot: 0,
        track: 0, at: null, transMode: 'overlap', fadeIn: 0, fadeOut: 0, fadeAudio: true,
        cropShape: 'none', cropX: 0.5, cropY: 0.5, cropW: 1, cropH: 1, cropSize: 1,
        rot: 0,                    // 使用者自己再轉的角度（0/90/180/270），跟檔案本身的矩陣無關
        trans:    { type: A.clips.length ? 'dissolve' : 'none', dur: 0.6 },
        transOut: { type: 'none', dur: 0.6 },     // 離開這一段時的轉場（轉到黑），聲音一起淡出
        grade: { ...GRADE0 },
        thumb: '', audioBuf: null, audioTried: false
      };
      A.clips.push(c); pinFreeClips();
      $('#videoPool').appendChild(v);
      try { c.thumb = await grabThumb(v); } catch(e){}
      regMedia(c);
      res(c);
    };
  });
}

function grabThumb(v){
  return new Promise(res => {
    const done = () => {
      const cv = document.createElement('canvas');
      cv.width = 104; cv.height = 64;
      const g = cv.getContext('2d');
      g.fillStyle = '#000'; g.fillRect(0,0,104,64);
      const s = Math.min(104 / v.videoWidth, 64 / v.videoHeight);
      const w = v.videoWidth * s, h = v.videoHeight * s;
      try { g.drawImage(v, (104-w)/2, (64-h)/2, w, h); } catch(e){}
      v.removeEventListener('seeked', done);
      res(cv.toDataURL('image/jpeg', .7));
    };
    v.addEventListener('seeked', done, { once:true });
    v.currentTime = Math.min(0.15, v.duration * 0.1);
    setTimeout(() => { v.removeEventListener('seeked', done); res(''); }, 3000);
  });
}

/* ── 圖片 ──────────────────────────────────────────────────── */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();                  // 同上：blob 同源，不設 crossOrigin
    im.onload = () => res({ im, url });
    im.onerror = () => rej(new Error('無法讀取這個圖檔'));
    im.src = url;
  });
}
function imgThumb(im){
  const cv = document.createElement('canvas');
  cv.width = 104; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 104, 64);
  const s = Math.min(104 / im.naturalWidth, 64 / im.naturalHeight);
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  try { g.drawImage(im, (104 - w) / 2, (64 - h) / 2, w, h); } catch(e){}
  return cv.toDataURL('image/jpeg', .7);
}

/** 把圖片當成一段插進影片軌：佔一段時間、可接轉場、可拖曳排序 */

/* ── 字幕 ──────────────────────────────────────────────────── */
const srtTime = t => {
  t = Math.max(0, t);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60);
  const s = Math.floor(t % 60), ms = Math.round((t % 1) * 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
};
function parseSRT(text){
  const out = [];
  let skipped = 0;
  const blocks = String(text).replace(/\r/g, '').replace(/^﻿/, '').split(/\n{2,}/);
  for (const b of blocks){
    const lines = b.split('\n').filter(l => l.trim() !== '');
    if (!lines.length) continue;
    let i = 0;
    if (/^\d+$/.test(lines[0].trim())) i = 1;             // 序號可有可無
    // 小數位不限長度，遇到寫壞的檔（例如 ,1000）也讀得進來
    const m = (lines[i] || '').match(
      /(\d{1,3}):(\d{1,2}):(\d{1,2})[,.](\d+)\s*-->\s*(\d{1,3}):(\d{1,2}):(\d{1,2})[,.](\d+)/);
    if (!m){ if (b.indexOf('-->') >= 0) skipped++; continue; }
    const frac = d => +d / Math.pow(10, Math.max(3, d.length));   // 3 位以內當毫秒
    const sec = (h, mi, s, d) => +h * 3600 + +mi * 60 + +s + frac(d) * (d.length <= 3 ? Math.pow(10, 3 - d.length) : 1);
    const st = sec(m[1], m[2], m[3], m[4]), en = sec(m[5], m[6], m[7], m[8]);
    const txt = lines.slice(i + 1).join('\n').trim();
    if (en > st) out.push({ id: uid(), start: st, end: en, text: txt });
  }
  out.skipped = skipped;
  return out;
}
function toSRT(cues){
  return [...cues].sort((a, b) => a.start - b.start)
    .map((c, i) => `${i+1}\n${srtTime(c.start)} --> ${srtTime(c.end)}\n${c.text}\n`)
    .join('\n');
}
async function importSRT(file){
  const cues = parseSRT(await file.text());
  if (!cues.length){ toast('這個檔案裡沒有讀到字幕', true); return; }
  pushUndo();
  cues.forEach(c=>c.track=subtitleTargetTrack());
  A.subs.push(...cues);
  A.sel = { type:'sub', id: cues[0].id };
  render(); refreshProp();
  toast(`已匯入 ${cues.length} 句字幕（${fmt(cues[0].start)} ~ ${fmt(cues[cues.length-1].end)}）` +
        (cues.skipped ? `，另有 ${cues.skipped} 句時間碼格式有問題讀不進來` : ''), !!cues.skipped);
}
function exportSRT(cues, name){
  cues = Array.isArray(cues) ? cues : A.subs;
  if (!cues.length){ toast('目前沒有字幕', true); return; }
  const blob = new Blob([toSRT(cues)], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = typeof name === 'string' ? name : 'NiVedit字幕.srt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  toast(`已匯出 ${cues.length} 句字幕`);
}
function addSub(startAt,track=subtitleTargetTrack()){
  const s = Math.max(0, startAt === undefined ? A.playhead : startAt);
  const c = { id: uid(), track, start: s, end: Math.min(totalDur() || s + 3, s + 3), text: '在這裡輸入字幕' };

/** 整批位移，用來把某一段的字幕對到正確位置 */
function shiftSubs(delta){

}
function applySubPreset(id,track=subtitleTargetTrack()){

/** 在播放頭把音軌切成兩塊，切完各自可以移動、刪除、調音量 */
/* ── 影片／疊圖／標題的動態（v7.6，v8.1 加入影片）────────────────
   obj.kf = { x:[{t,v,e}], y:[…], scale:[…], opacity:[…], rot/motionRot:[…] }

   兩個刻意的設計：

   1. **t 是「佔這一段長度的比例」0～1，不是秒。** 這樣拖動或裁切方塊時
      動態自動跟著縮放，「從頭走到尾」永遠成立，不用在六個地方補平移程式碼。
   2. **起點不存。** 陣列裡只放「之後要走到的目標」，t=0 的值就是面板上原本
      那組滑桿（o.x / o.y / o.scale …）。所以沒有任何關鍵幀時行為完全不變，
      舊專案讀進來也一樣；之後要升級成多個關鍵幀，往同一個陣列加點就好。

   關鍵：這一層動的是「基準值」。51 種進場、18 種退場動畫吐的是
   dx/dy/rot/sx/sy/alpha 這種「相對量」，照樣疊在上面，一行都不用改。 */
const EASES = [
  ['linear', '等速'],
  ['inout',  '慢進慢出'],
  ['out',    '結尾放慢'],
  ['in',     '開頭放慢'],
];
function easeK(id, p){
  if (id === 'inout') return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  if (id === 'out')   return 1 - Math.pow(1 - p, 3);
  if (id === 'in')    return p * p * p;
  return p;
}

/** 動態發生在哪一段（佔方塊長度的比例）。沒設就是整段 0～1。 */
function kfWin(obj){
  const w = obj && obj.kfT;
  if (!w || w.length < 2) return [0, 1];
  return [clamp(Math.min(w[0], w[1]), 0, 1), clamp(Math.max(w[0], w[1]), 0, 1)];
}

/** 動態物件在總時間軸上的起訖。疊圖／標題自己有 start/end；
    影片片段的位置由 layout() 依 track/at 與各軌接法決定。 */
function kfBounds(obj){
  if (obj && Number.isFinite(obj.start) && Number.isFinite(obj.end)) return [obj.start, obj.end];
  const i = A.clips.indexOf(obj);
  if (i >= 0){
    const q = layout()[i];
    if (q) return [q.start, q.start + q.dur];
  }
  return [0, 0.05];
}

/** 這個物件在時間 T 的某個屬性值。沒有關鍵幀就原封不動回傳 base。
    起點之前維持起點的樣子、終點之後維持終點的樣子，中間才走。 */
function kfAt(obj, prop, base, T){
  const k = obj && obj.kf && obj.kf[prop];
  if (!k || !k.length) return base;
  const [start, end] = kfBounds(obj);
  const span = Math.max(0.05, end - start);
  let t = clamp((T - start) / span, 0, 1);
  const [w0, w1] = kfWin(obj);
  t = (w1 > w0 + 1e-6) ? clamp((t - w0) / (w1 - w0), 0, 1) : (t < w0 ? 0 : 1);
  let pt = 0, pv = base;
  for (const q of k){
    if (t <= q.t){
      const w = q.t - pt;
      const p = w > 1e-6 ? clamp((t - pt) / w, 0, 1) : 1;
      return pv + (q.v - pv) * easeK(q.e, p);
    }
    pt = q.t; pv = q.v;
  }
  return pv;
}

/** B1 的介面只動「終點」那一個關鍵幀 */
function kfEnd(obj, prop){ const k = obj.kf && obj.kf[prop]; return k && k.length ? k[k.length - 1] : null; }
function kfSetEnd(obj, prop, v, e){
  if (!obj.kf) obj.kf = {};
  const k = obj.kf[prop];
  if (k && k.length) { k[k.length - 1].v = v; if (e) k[k.length - 1].e = e; }
  else obj.kf[prop] = [{ t: 1, v, e: e || 'inout' }];
}
/** 某個屬性的「起點」是物件上同名的欄位；舊標題缺少 opacity 欄位時預設 1 */
function kfBase(obj, prop){
  const v = obj[prop];
  return typeof v === 'number' ? v : (prop === 'opacity' ? 1 : 0);
}

/** 把動態視窗搬到分割後的兩半上：c 是切點佔原本長度的比例 */
function kfSplitWin(a, b, c){
  const [w0, w1] = kfWin(a);
  a.kfT = c > 1e-6 ? [clamp(w0 / c, 0, 1), clamp(w1 / c, 0, 1)] : [0, 1];
  const r = 1 - c;
  b.kfT = r > 1e-6 ? [clamp((w0 - c) / r, 0, 1), clamp((w1 - c) / r, 0, 1)] : [0, 1];
}

/** 分割時把動態也切成兩段，接縫才不會跳。
    注意 { ...o } 是淺拷貝，kf 會被兩半共用 —— 一定要自己重建。 */
function kfSplit(a, b, T){
  if (!kfOn(a)){ b.kf = null; b.kfT = null; return; }
  const props = Object.keys(a.kf).filter(k => a.kf[k] && a.kf[k].length);
  const mid = {}, la = {}, lb = {};
  for (const pr of props) mid[pr] = kfAt(a, pr, kfBase(a, pr), T);
  const [start, end] = kfBounds(a);
  const c = clamp((T - start) / Math.max(0.05, end - start), 0, 1);
  for (const pr of props){
    const last = a.kf[pr][a.kf[pr].length - 1];
    la[pr] = [{ t: 1, v: mid[pr], e: last.e }];      // 左半：走到切點的值
    lb[pr] = [{ t: 1, v: last.v,  e: last.e }];      // 右半：從切點的值走到原本的終點
    b[pr] = mid[pr];                                  // 右半的起點 = 切點的值
  }
  a.kf = la; b.kf = lb;
  kfSplitWin(a, b, c);
}

function kfOn(obj){ return !!(obj.kf && Object.keys(obj.kf).some(k => obj.kf[k] && obj.kf[k].length)); }
function kfClear(obj){ obj.kf = null; obj.kfT = null; }

/* ── 配樂音量曲線（v7.5）──────────────────────────────────────
   m.vk = [{ t, v }]：t 是「相對這一塊配樂起點」的秒數，v 是 0～1 的倍率。
   最後乘在 m.vol 上 —— 沒有任何點時恆為 1，行為跟以前一模一樣，
   舊專案讀進來沒有這個欄位也照常運作。

   為什麼是倍率而不是直接當音量：這樣「音量」滑桿還是整體音量，
   曲線只管「這一段要壓多低」，兩者不會互相打架。

   t 相對方塊起點，所以移動方塊時曲線自動跟著走；裁切左端時
   音檔內容也是相對方塊起點固定的（offset 不變），兩者一致。

   預覽（syncMedia 每幀設 el.volume）與匯出（OfflineAudioContext 的
   linearRamp）必須算出同一條線，所以兩邊都只認 musicGainAt 這個公式。 */
function musicGainAt(m, T){
  const k = m && m.vk;
  if (!k || !k.length) return 1;
  const t = T - m.startAt;
  if (t <= k[0].t) return clamp(k[0].v, 0, 1);
  const last = k[k.length - 1];
  if (t >= last.t) return clamp(last.v, 0, 1);
  for (let i = 1; i < k.length; i++){
    if (t <= k[i].t){
      const a = k[i - 1], b = k[i], w = b.t - a.t;
      const p = w > 1e-6 ? (t - a.t) / w : 0;
      return clamp(a.v + (b.v - a.v) * p, 0, 1);
    }
  }
  return 1;
}

/** 加一個點；永遠保持照時間排好，求值與匯出才不用每次重排 */
function vkAdd(m, t, v){
  m.vk = (m.vk || []).concat([{ t: Math.max(0, t), v: clamp(v, 0, 1) }])
                     .sort((a, b) => a.t - b.t);
}
function vkTidy(m){ if (m.vk) m.vk.sort((a, b) => a.t - b.t); }

function splitMusic(){
  const _u = () => pushUndo();
  const m = A.musics.find(x => x.id === A.sel.id);
  if (!m){ toast('先選一條音軌', true); return; }
  const T = A.playhead, end = m.startAt + m.len;
  if (T <= m.startAt + 0.2 || T >= end - 0.2){ toast('播放頭不在這條音軌上，或太靠近邊緣', true); return; }
  const seg = musicSeg(m);
  const consumed = m.loop ? ((T - m.startAt) % Math.max(0.2, seg - m.xfade)) : (T - m.startAt);
  const a = document.createElement('audio');
  a.src = m.url; a.preload = 'auto';
  $('#videoPool').appendChild(a);
  _u();
  // 切點的音量先算好，兩半各補一個點，切開之後音量不會在接縫跳一下
  const cut = T - m.startAt, gv = musicGainAt(m, T), had = !!(m.vk && m.vk.length);
  const right = { ...m, id: uid(), el: a, startAt: T, len: end - T, autoLen: false,
                  offset: clamp(m.offset + consumed, 0, Math.max(0, m.dur - 0.3)),
                  vk: had ? [{ t: 0, v: gv }].concat(
                        m.vk.filter(x => x.t > cut).map(x => ({ t: x.t - cut, v: x.v }))) : [] };
  regMedia(right);
  if (had) m.vk = m.vk.filter(x => x.t < cut).concat([{ t: cut, v: gv }]);
  m.len = T - m.startAt; m.autoLen = false;
  A.musics.splice(A.musics.indexOf(m) + 1, 0, right);
  A.sel = { type:'music', id: right.id };
  render(); refreshProp();
  toast('音軌已分割成兩塊');
}

/** 在播放頭把標題切成兩個，後半可以獨立換文字或動畫 */
function splitTitle(){
  const _u = () => pushUndo();
  const t = A.titles.find(x => x.id === A.sel.id);
  if (!t){ toast('先選一個標題', true); return; }
  const T = A.playhead;
  if (T <= t.start + 0.2 || T >= t.end - 0.2){ toast('播放頭不在這個標題上，或太靠近邊緣', true); return; }
  _u();
  const right = { ...t, id: uid(), start: T, animIn: 'none' };
  kfSplit(t, right, T);                  // 動態也要切開（順便把共用的 kf 拆乾淨）
  t.end = T;
  t.animOut = 'none';                    // 接縫處不要淡出，兩半看起來才是連著的
  A.titles.push(right);
  A.sel = { type:'title', id: right.id };
  render(); refreshProp();
  toast('標題已分割');
}

/** 在播放頭把目前片段切成兩段 */
function splitClip(){
  const L = layout(), T = A.playhead;
  let i = A.sel.type === 'clip' ? A.clips.findIndex(c => c.id === A.sel.id) : -1;
  if (i >= 0 && !(T >= L[i].start && T < L[i].start + L[i].dur)) i = -1;
  if (i < 0 && A.sel.type !== 'clip'){
    const act = activeAt(T,1,L) || activeAt(T,0,L);
    if (act) i = A.clips.indexOf((act.b || act.a).clip);
  }
  if (i < 0){ toast('播放頭不在目前選取的影片片段上', true); return; }
  const c = A.clips[i];
  const local = c.inP + (T - L[i].start);
  if (local - c.inP < 0.2 || c.outP - local < 0.2){ toast('太靠近片段邊緣，切不了', true); return; }
  pushUndo();
  let nc;
  if (isImg(c)){                                   // 圖片直接共用同一個 <img>
    nc = { ...c, id: uid(), inP: 0, outP: c.outP - local,
           trans: { type:'none', dur:0.6 },
           transOut: { ...(c.transOut || { type:'none', dur:0.6 }) },
           grade: { ...(c.grade || GRADE0) } };
    nc.fadeIn = 0; c.fadeOut = 0;
    nc.at = A.playhead;
    kfSplit(c, nc, T);                         // 影片構圖動態也切成連續的兩半
    c.transOut = { type:'none', dur:0.6 };      // 結尾效果留給後半段，前半段接著播不用收尾
    regMedia(nc);
    c.outP = local;
    A.clips.splice(i + 1, 0, nc);
    A.sel = { type:'clip', id:nc.id };
    render(); refreshProp(); toast('已分割');
    return;
  }
  const v = document.createElement('video');   // 跟 addVideo 一樣，blob 同源不設 crossOrigin
  v.src = c.url;
  v.preload = 'auto'; v.playsInline = true; v.muted = true;
  $('#videoPool').appendChild(v);
  nc = { ...c, id: uid(), video: v, el: v, inP: local, outP: c.outP,
         trans: { type:'none', dur:0.6 },
         transOut: { ...(c.transOut || { type:'none', dur:0.6 }) },
         grade: { ...(c.grade || GRADE0) }, audioBuf: c.audioBuf };
  nc.fadeIn = 0; c.fadeOut = 0;
  nc.at = A.playhead;
  kfSplit(c, nc, T);                            // 兩半不共用 kf，接縫畫面也不跳
  c.transOut = { type:'none', dur:0.6 };
  regMedia(nc, { audioBuf: c.audioBuf });
  c.outP = local;
  A.clips.splice(i + 1, 0, nc);
  A.sel = { type:'clip', id:nc.id };
  render(); refreshProp();
  toast('已分割');
}

<script>
/* GIF 疊圖：先解出完整透明畫格，再用時間軸時間選幀。
   不依賴 <img> 的牆鐘動畫，預覽／seek／匯出使用同一份畫格。
   ImageDecoder 處理 GIF 的局部畫格、透明度與 disposal 合成。 */
let _gifCache = new WeakMap();
const _gifAssets = new Set();
let _gifBytes = 0, _gifEpoch = 0;
const GIF_MEMORY_LIMIT = 256 * 1024 * 1024;
const GIF_ASSET_LIMIT = 128 * 1024 * 1024;

function closeGifAsset(g){
  if (!g || g.closed) return;
  g.closed = true;
  for (const f of g.frames) f.close();
  g.frames.length = 0;
  _gifAssets.delete(g);
  _gifBytes = Math.max(0, _gifBytes - g.bytes);
}

// 目前專案及復原／重做仍用到的畫格保留，其餘釋放。
function pruneGifMedia(){
  const keep = new Set(A.overlays.map(o => o._gif).filter(Boolean));
  for (const json of [..._undo, ..._redo]){
    for (const o of JSON.parse(json).overlays || []){
      const m = MEDIA.get(o.id);
      if (m && m._gif) keep.add(m._gif);
    }
  }
  for (const g of _gifAssets) if (!g.pending && !keep.has(g)) closeGifAsset(g);
  for (const m of MEDIA.values()) if (m._gif && m._gif.closed) delete m._gif;
}

function clearGifMedia(){
  ++_gifEpoch;                         // 取消舊專案尚在解碼的 GIF
  for (const g of _gifAssets) closeGifAsset(g);
  _gifCache = new WeakMap();
  _gifBytes = 0;
  for (const m of MEDIA.values()) delete m._gif;
}

async function decodeOverlayGif(file, epoch = _gifEpoch){
  // 看檔頭，不只看副檔名：專案重新綁定後 MIME 可能是空的。
  const sig = new Uint8Array(await file.slice(0, 10).arrayBuffer());
  const magic = String.fromCharCode(...sig.subarray(0, 6));
  if (magic !== 'GIF87a' && magic !== 'GIF89a') return null;
  if (typeof ImageDecoder === 'undefined' || !await ImageDecoder.isTypeSupported('image/gif'))
    throw new Error(L('此瀏覽器不支援 GIF 動畫解碼，請更新 Edge 後重試。'));
  const w = sig[6] | (sig[7] << 8), h = sig[8] | (sig[9] << 8);
  if (!w || !h || w * h * 4 > GIF_ASSET_LIMIT)
    throw new Error(L('GIF 動畫太大，請縮小尺寸或縮短動畫後再匯入。'));
  const frames = [], ends = [];
  let decoder = null, bytes = 0, reserved = false, duration = 0;
  const check = () => { if (epoch !== _gifEpoch) throw new Error(L('專案已切換，GIF 載入已取消。')); };
  try {
    const data = await file.arrayBuffer();
    check();
    decoder = new ImageDecoder({ data, type:'image/gif', preferAnimation:true });
    await Promise.all([decoder.tracks.ready, decoder.completed]);
    check();
    const track = decoder.tracks.selectedTrack;
    if (!track || !track.frameCount) throw new Error(L('GIF 沒有可讀取的畫格。'));
    bytes = w * h * 4 * track.frameCount;
    if (!Number.isSafeInteger(bytes) || bytes > GIF_ASSET_LIMIT)
      throw new Error(L('GIF 動畫太大，請縮小尺寸或縮短動畫後再匯入。'));
    if (_gifBytes + bytes > GIF_MEMORY_LIMIT)
      throw new Error(L('GIF 動畫記憶體不足，請縮小素材或另開專案後再試。'));
    _gifBytes += bytes; reserved = true;
    for (let i = 0; i < track.frameCount; ++i){
      check();
      const { image } = await decoder.decode({ frameIndex:i, completeFramesOnly:true });
      try {
        // 使用完整合成畫格；立刻關閉 VideoFrame，避免耗盡解碼器資源。
        const bitmap = await createImageBitmap(image);
        frames.push(bitmap);
        duration += Number.isFinite(image.duration) && image.duration > 0 ? image.duration : 100000;
        ends.push(duration);
      } finally { image.close(); }
    }
    check();
    const g = { frames, ends, duration, bytes, closed:false, pending:true };
    _gifAssets.add(g);
    return g;
  } catch(e){
    for (const f of frames) f.close();
    if (reserved && epoch === _gifEpoch) _gifBytes = Math.max(0, _gifBytes - bytes);
    throw e;
  } finally { if (decoder) decoder.close(); }
}

async function getOverlayGif(file){
  const cache = _gifCache, epoch = _gifEpoch;
  const old = cache.get(file);
  if (old){
    const g = await old;
    if (epoch !== _gifEpoch) throw new Error(L('專案已切換，GIF 載入已取消。'));
    if (!g || !g.closed) return g;
  }
  const pending = decodeOverlayGif(file, epoch);
  cache.set(file, pending);
  try { return await pending; }
  catch(e){ cache.delete(file); throw e; }
}

async function loadOverlayImage(file){
  const epoch = _gifEpoch;
  const loaded = await loadImage(file);
  try {
    if (epoch !== _gifEpoch) throw new Error(L('專案已切換，GIF 載入已取消。'));
    const gif = await getOverlayGif(file);
    if (epoch !== _gifEpoch) throw new Error(L('專案已切換，GIF 載入已取消。'));
    return { ...loaded, gif };
  }
  catch(e){ URL.revokeObjectURL(loaded.url); throw e; }
}

function overlaySourceAt(o, T){
  const g = o._gif;
  if (!g || g.closed) return o.img;
  // 疊圖存活期間循環；左右裁切與分割用 gifOffset 保留原動畫相位。
  const us = Math.round((T - o.start + (o.gifOffset || 0)) * 1e6);
  const t = ((us % g.duration) + g.duration) % g.duration;
  let lo = 0, hi = g.ends.length - 1;
  while (lo < hi){
    const mid = (lo + hi) >> 1;
    if (t < g.ends[mid]) hi = mid; else lo = mid + 1;
  }
  return g.frames[lo];
}

<script>
/* ==========================================================================
   NiVedit — 畫面合成：片段繪製、轉場、標題動畫
   預覽與匯出共用同一套繪製程式碼，所見即所得。
   ========================================================================== */
'use strict';

/* 離屏畫布池。預覽、匯出、轉場預覽縮圖各用一組，互不干擾。 */
const _pools = {};
function bufs(key, n, W, H){
  let b = _pools[key] || (_pools[key] = []);
  while (b.length < n){ const c = document.createElement('canvas'); b.push({ c, x: c.getContext('2d') }); }
  for (let i = 0; i < n; i++){
    const o = b[i];
    if (o.c.width !== W || o.c.height !== H){ o.c.width = W; o.c.height = H; }
  }
  return b;
}

/** 把所有離屏畫布丟掉重開。
    canvas 一旦被「汙染」（畫過跨來源的影片或圖片）就永遠回不去，
    而這些畫布是整頁共用的 —— 只要汙染過一次，之後每次匯出都會失敗，
    只有重新整理才會好。匯出前先全部換新的，就不會被上一輪的髒東西卡住。 */
function resetBuffers(){
  for (const k of Object.keys(_pools)) delete _pools[k];
  if (typeof _pix !== 'undefined'){ _pix.width = 1; _pix.height = 1; }
}

const TAU = Math.PI * 2;
/** 固定亂數：同樣的 (i, seed) 永遠得到同一個 0~1，
    這樣預覽跟匯出的「隨機」特效才會長得一模一樣。 */
function rnd1(i, seed){
  const x = Math.sin(i * 127.1 + seed * 311.7 + 13.7) * 43758.5453;
  return x - Math.floor(x);
}

/* ── 字體視覺大小校正 ──────────────────────────────────────────
   同樣是 84px，標楷體的字縮在 em 框裡、Impact 幾乎撐滿，看起來差很多。
   這裡實際量測每個字體的字高，換算成相對於預設黑體的倍率，
   讓「大小」這個數字在所有字體下看起來一致。
   ─────────────────────────────────────────────────────────── */
const _meas = document.createElement('canvas').getContext('2d');
const _inkCache = new Map();
const INK_K = 0.72;        // 「大小」這個數字換算成實際字高的比例

/** 這一串字用這個字體畫出來，實際墨水高度是字級的幾倍？
    直接量使用者輸入的字，所以就算字體缺中文被瀏覽器換掉，量到的也是真正畫出來的東西。 */
/** 空字串或壞掉的字體字串會讓 ctx.font 整行失效，一律換回預設字體 */
function safeFont(f){
  return (typeof f === 'string' && f.trim() && f.indexOf('undefined') < 0) ? f : FONTS[0].id;
}

function inkRatio(family, bold, text){
  family = safeFont(family);
  const key = family + '|' + (bold ? 1 : 0) + '|' + text;
  if (_inkCache.has(key)) return _inkCache.get(key);
  let r = INK_K;
  try {
    _meas.font = `${bold ? '700 ' : '400 '}100px ${family}`;
    const m = _meas.measureText((text || '') + 'H');     // 補一個 H 當基準，純小寫也不會爆大
    const h = (m.actualBoundingBoxAscent || 0) + (m.actualBoundingBoxDescent || 0);
    // 只接受合理範圍。字體不存在時瀏覽器會用最後備援字體，量出來的數字可能離譜到 3 倍，
    // 以前沒擋，結果字級被壓扁成四分之一。
    if (h >= 55 && h <= 115) r = h / 100;
  } catch(e){}
  if (_inkCache.size > 400) _inkCache.clear();
  _inkCache.set(key, r);
  return r;
}

/** 校正倍率＝這個字體相對於「預設字體」該放大縮小多少。
    預設字體永遠是 1.0，其他字體最多調整 ±25%，再怪的量測也不會把字弄不見。 */
function sizeCorrection(family, bold, text){
  const base = inkRatio(FONTS[0].id, bold, text);
  const cur  = inkRatio(family, bold, text);
  return clamp(base / cur, 0.8, 1.25);
}

/** 這台電腦有沒有裝這串字體裡的任何一個？（generic 關鍵字不算） */
function fontAvailable(family){
  const names = String(family).split(',')
    .map(s => s.replace(/["']/g, '').trim())
    .filter(s => !/^(sans-serif|serif|monospace|cursive|fantasy|system-ui)$/i.test(s));
  if (!names.length) return true;
  const probe = 'mmmwwwii國字測試';
  const w = fam => { _meas.font = `100px ${fam}`; return _meas.measureText(probe).width; };
  return names.some(n =>
    ['monospace', 'sans-serif', 'serif'].some(g => Math.abs(w(`"${n}",${g}`) - w(g)) > 0.5));
}

const ease = p => 1 - Math.pow(1 - p, 3);                     // easeOutCubic
const easeBack = p => { const s = 1.70158 + 1; return 1 + (s+1)*Math.pow(p-1,3) + s*Math.pow(p-1,2); };

/** 把影片畫進畫布，維持比例（contain 留黑邊 / cover 裁切填滿） */
function drawSource(ctx, v, W, H, fit, rot){
  if (!v) return;
  // 最後的 v.width/height 是給畫布用的（轉正過的幀會包成畫布回來）
  const sw0 = v.videoWidth || v.naturalWidth || v.displayWidth || v.codedWidth || v.width;
  const sh0 = v.videoHeight || v.naturalHeight || v.displayHeight || v.codedHeight || v.height;
  if (!sw0 || !sh0) return;
  const r = ((rot || 0) % 360 + 360) % 360;
  // 轉 90/270 度時，長寬要對調之後再去算怎麼塞進畫面
  const sw = (r % 180) ? sh0 : sw0, sh = (r % 180) ? sw0 : sh0;
  const sr = sw / sh, dr = W / H;
  let w, h;
  if ((fit === 'cover') ? (sr > dr) : (sr < dr)){ h = H; w = H * sr; }
  else { w = W; h = W / sr; }
  try {
    if (!r){ ctx.drawImage(v, (W - w) / 2, (H - h) / 2, w, h); return; }
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(r * Math.PI / 180);
    // 旋轉後的目標框是 w×h，那麼旋轉前要畫的框就是把它轉回來
    const dw = (r % 180) ? h : w, dh = (r % 180) ? w : h;
    ctx.drawImage(v, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  } catch(e){ try { ctx.restore(); } catch(_){} }
}

/* ── 畫面調整（Stage 2 · E） ─────────────────────────────────
   亮度／對比／飽和／復古用 ctx.filter 一次做完（GPU，最便宜）。
   色溫用 multiply 疊一層色版（通道增益，跟白平衡同個道理）。
   銳利度用 high-pass + overlay 疊加，這是標準的 unsharp mask 做法。
   預覽跟匯出走的是同一段程式，所見即所得。
   ─────────────────────────────────────────────────────── */
function gradeFilter(g, W){
  const f = [];
  // 色溫是用 multiply 做的，一定會壓暗，這裡先補回來
  const tempLift = Math.abs(g.temp || 0) / 100 * 0.07;
  const bri = (g.bri || 0) / 100 + tempLift;
  if (bri)      f.push(`brightness(${(1 + bri).toFixed(3)})`);
  if (g.con)    f.push(`contrast(${Math.max(0, 1 + g.con / 100).toFixed(3)})`);
  if (g.sat)    f.push(`saturate(${Math.max(0, 1 + g.sat / 100).toFixed(3)})`);
  if (g.sepia)  f.push(`sepia(${clamp(g.sepia / 100, 0, 1).toFixed(3)})`);
  return f.join(' ');   // 銳利／柔化不走 filter，見下面 applySharpen / applySoften
}

/** 色溫：暖＝壓綠藍，冷＝壓紅。黑邊乘完還是黑的，不會被染色 */
function applyTemp(ctx, temp, W, H){
  const k = clamp(temp / 100, -1, 1);
  const c255 = x => Math.round(255 * x);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = k > 0
    ? `rgb(255,${c255(1 - k * 0.07)},${c255(1 - k * 0.24)})`
    : `rgb(${c255(1 + k * 0.20)},${c255(1 + k * 0.06)},255)`;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/** 色調：色溫的另一半（綠 ↔ 洋紅），調膚色偏綠或偏紅時用 */
function applyTint(ctx, tint, W, H){
  const k = clamp(tint / 100, -1, 1);
  const c255 = x => Math.round(255 * x);
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = k > 0
    ? `rgb(255,${c255(1 - k * 0.20)},255)`                       // 洋紅：壓綠
    : `rgb(${c255(1 + k * 0.16)},255,${c255(1 + k * 0.16)})`;     // 綠：壓紅藍
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/** 褪色：把黑階抬起來。lighten 會讓比這個灰暗的地方統統變成這個灰，
    就是底片那種「黑不到底」的霧面感，電影調色的關鍵一味。 */
function applyFade(ctx, amt, W, H){
  const v = Math.round(clamp(amt / 100, 0, 1) * 58);
  ctx.save();
  ctx.globalCompositeOperation = 'lighten';
  ctx.fillStyle = `rgb(${v},${v},${Math.min(255, v + 6)})`;      // 藍一點點，比較像底片
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/** 暗角：四角壓暗，視線會自動往中間集中 */
function applyVig(ctx, amt, W, H){
  const a = clamp(amt / 100, 0, 1);
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.28,
                                     W/2, H/2, Math.hypot(W,H) * 0.58);
  g.addColorStop(0,   'rgba(0,0,0,0)');
  g.addColorStop(0.55,`rgba(0,0,0,${(a * 0.12).toFixed(3)})`);
  g.addColorStop(1,   `rgba(0,0,0,${(a * 0.85).toFixed(3)})`);
  ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}

/* 顆粒用一張固定的雜訊圖平鋪。每次重畫都重算雜訊的話，
   顆粒會自己跳動變成「爬蟲」，而且很貴 —— 所以只做一次。 */
let _grainCv = null;
const _grainPats = new WeakMap();          // pattern 綁在建立它的 context 上，每個畫布各存一份
function grainPattern(ctx){
  const hit = _grainPats.get(ctx);
  if (hit) return hit;
  if (_grainCv){ const pt = ctx.createPattern(_grainCv, 'repeat'); _grainPats.set(ctx, pt); return pt; }
  const N = 256;
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d');
  const im = x.createImageData(N, N);
  for (let i = 0; i < N * N; i++){
    const v = 128 + Math.round((rnd1(i, 91) - 0.5) * 150);
    im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v;
    im.data[i*4+3] = 255;
  }
  x.putImageData(im, 0, 0);
  _grainCv = c;
  const pt = ctx.createPattern(c, 'repeat');
  _grainPats.set(ctx, pt);
  return pt;
}

/** 顆粒：中灰的雜訊用 overlay 疊上去，亮的地方變亮、暗的地方變暗 */
function applyGrain(ctx, amt, W, H){
  const pat = grainPattern(ctx);
  if (!pat) return;
  // 顆粒要跟著解析度縮放，不然預覽（比較小）看到的顆粒會比匯出的粗
  if (pat.setTransform){
