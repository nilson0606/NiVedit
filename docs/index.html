  if (!/[\u3400-\u9FFF\uF900-\uFAFF\uD840-\uD87F]/.test(s0)) return s0;
  const t = twTables();
  let s = _twPass(Array.from(s0), t.pmap, t.pfirst, t.pmax, t.cmap);      // STPhrases + STCharacters
  s = _twPass(Array.from(s), t.wmap, t.wfirst, t.wmax, t.wcmap);          // TWPhrases（台灣用語）
  return Array.from(s).map(c => t.vmap.get(c) || c).join('');             // TWVariants（台灣字形）
}

</script>
<script>
/* ══════════════════════════════════════════════════════════════
   AI 字幕產生器
   在瀏覽器裡跑 Whisper（transformers.js + onnxruntime-web），
   影片一樣不上傳，聲音也不上傳 —— 只有第一次要從 CDN 抓模型檔，
   抓完存在 IndexedDB，之後斷網也能用。

   為什麼要開 Worker：辨識是純算力，跑在主執行緒畫面會整個卡住。
   file:// 開的網頁不能用 module worker（瀏覽器擋掉），
   但「classic worker + 動態 import()」可以 —— 這條路是實測出來的。
   ══════════════════════════════════════════════════════════════ */

/* 語音辨識模型。都是 transformers.js 能直接讀的 ONNX 版本。 */
const ASR_MODELS = [
  { id:'onnx-community/whisper-base',            name:'快速（base，約 80MB）' },
  { id:'onnx-community/whisper-small',           name:'平衡（small，約 250MB）— 推薦' },
  { id:'onnx-community/whisper-large-v3-turbo',  name:'最準（large-v3-turbo，約 800MB，要 WebGPU）' },
  { id:'Xenova/whisper-small',                   name:'平衡（small）— 備用來源' },
  { id:'Xenova/whisper-base',                    name:'快速（base）— 備用來源' },
  { id:'Xenova/whisper-tiny',                    name:'極速（tiny，約 40MB，中文常聽錯）' },
];

/* transformers.js 主程式。第一個抓不到就換下一個。
   一定要用 dist/transformers.min.js —— 這一版把 onnxruntime 打包進去了，
   沒有裸模組名要解析，動態 import 才不會失敗。 */
const ASR_LIBS = [
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js',
  'https://unpkg.com/@huggingface/transformers@3.7.6/dist/transformers.min.js',
  'https://fastly.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js',
];

const ASR = {
  model: 'onnx-community/whisper-small',
  lang: 'zh',          // zh = 中文為主（可混英文）、en = 英文、auto = 自動
  tw: true,            // 轉成台灣正體
  split: true,         // 自動斷句
  scope: 'all',        // all = 整條時間軸，或某個 clip 的 id
  device: 'auto',      // auto / webgpu / wasm
  busy: false,
  worker: null,
  cancel: false,
};

/* ── Worker 原始碼 ──────────────────────────────────────────
   注意：這一整段是字串，跑在另一個執行緒，看不到外面任何變數。 */
const ASR_WORKER_SRC = String.raw`
let T = null, pipe = null, curKey = '', LIB_BASE = '';
const post = (t, o) => self.postMessage(Object.assign({ t }, o || {}));

/* ══ 檔案快取 ══════════════════════════════════════════════
   模型與程式庫都存成「資料夾裡的真實檔案」（D:\NiVedit\asr\），
   跟專案檔一樣的作風：看得到、備份得了、換電腦拷貝過去就能用，
   也不會被瀏覽器當成快取回收掉。
   資料夾 handle 可以直接 postMessage 給 worker，所以讀寫都在這裡做。
   沒有選資料夾時退回 IndexedDB，功能還是能用，只是東西藏在瀏覽器裡。 */
let DIR = null;                          // asr 資料夾的 handle（主執行緒傳進來）

const DB = 'nivedit-asr', STORE = 'files';
const idb = () => new Promise((res, rej) => {
  const q = indexedDB.open(DB, 1);
  q.onupgradeneeded = () => q.result.createObjectStore(STORE);
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
});
const idbGet = k => idb().then(db => new Promise((res, rej) => {
  const r = db.transaction(STORE).objectStore(STORE).get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idbPut = (k, v) => idb().then(db => new Promise((res, rej) => {
  const tx = db.transaction(STORE, 'readwrite');
  tx.objectStore(STORE).put(v, k);
  tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
}));

/** 網址 → 資料夾裡的相對路徑。刻意保留原本的目錄結構，人看得懂。
    https://huggingface.co/Xenova/whisper-small/resolve/main/onnx/x.onnx
      → models/Xenova/whisper-small/onnx/x.onnx
    https://cdn.jsdelivr.net/.../dist/transformers.min.js
      → lib/transformers.min.js                                        */
function urlToPath(url){
  const u = String(url);
  let m = u.match(/huggingface\.co\/([^?#]+)/);
  if (m){
    const parts = m[1].split('/').filter(Boolean);
    const i = parts.indexOf('resolve');
    const repo = (i > 0 ? parts.slice(0, i) : parts.slice(0, 2));
    const file = (i > 0 ? parts.slice(i + 2) : parts.slice(2));
    return ['models'].concat(repo, file.length ? file : ['file']);
  }
  const name = u.split('?')[0].split('/').pop() || 'file';
  return ['lib', name];
}
const safeSeg = x => String(x).replace(/[\\/:*?"<>|]/g, '_');

async function dirFor(parts, create){
  let d = DIR;
  for (let i = 0; i < parts.length - 1; i++){
    if (!d) return null;
    try { d = await d.getDirectoryHandle(safeSeg(parts[i]), { create: !!create }); }
    catch(e){ return null; }
  }
  return d;
}
/** 從資料夾讀。讀不到（或沒選資料夾）回 null。 */
async function fileGet(url){
  const parts = urlToPath(url);
  if (DIR){
    const d = await dirFor(parts, false);
    if (d){
      try {
        const fh = await d.getFileHandle(safeSeg(parts[parts.length-1]));
        const f = await fh.getFile();
        if (f.size > 0) return f;
      } catch(e){}
    }
  }
  try { const v = await idbGet(url); if (v && v.blob && v.blob.size > 0) return v.blob; } catch(e){}
  return null;
}
/** 寫進資料夾；沒有資料夾就退回 IndexedDB。回傳存到哪裡（給訊息用）。 */
async function filePut(url, blob){
  const parts = urlToPath(url);
  if (DIR){
    const d = await dirFor(parts, true);
    if (d){
      try {
        const fh = await d.getFileHandle(safeSeg(parts[parts.length-1]), { create:true });
        const w = await fh.createWritable();
        await w.write(blob); await w.close();
        return 'asr/' + parts.join('/');
      } catch(e){ post('warn', { msg: '寫進資料夾失敗（改存瀏覽器）：' + e.message }); }
    }
  }
  try { await idbPut(url, { blob, type: blob.type, at: Date.now() }); return '瀏覽器'; }
  catch(e){ post('warn', { msg: '存不下來，下次還要再抓一次：' + e.message }); return null; }
}

/* transformers.js 的模型檔快取介面（要有 match / put，跟 Cache API 同樣的形狀） */
const modelCache = {
  async match(key){
    try {
      const f = await fileGet(key);
      if (!f) return undefined;
      return new Response(f, { headers: {
        'Content-Type': f.type || 'application/octet-stream',
        'Content-Length': String(f.size) } });
    } catch(e){ return undefined; }
  },
  async put(key, response){
    try { await filePut(key, await response.blob()); }
    catch(e){ post('warn', { msg: '模型存檔失敗（下次要重新下載）：' + e.message }); }
  }
};

/** 抓一個檔案，順便存成資料夾裡的真實檔案。抓過一次之後就完全不用網路。 */
async function cachedFetch(url, label){
  const hit = await fileGet(url);
  if (hit){ post('status', { s: label + '（本機檔案）' }); return hit; }
  post('status', { s: label + '…' });
  let r;
  try { r = await fetch(url); }
  catch(e){ throw new Error(label + '失敗：連不到 ' + url.replace(/^https?:\/\//,'').split('/')[0] + '（' + e.message + '）'); }
  if (!r.ok) throw new Error(label + '失敗：' + url + ' 回應 ' + r.status);
  // 一邊收一邊回報進度，大檔（wasm 引擎 21MB）才不會看起來像當掉
  const total = +(r.headers.get('content-length') || 0);
  let blob;
  if (total > 2e6 && r.body){
    const rd = r.body.getReader(); const parts = []; let got = 0;
    for (;;){
      const { done, value } = await rd.read();
      if (done) break;
      parts.push(value); got += value.length;
      post('dl', { status:'progress', file: label, loaded: got, total });
    }
    blob = new Blob(parts, { type: r.headers.get('content-type') || '' });
  } else blob = await r.blob();
  const where = await filePut(url, blob);
  if (where) post('status', { s: label + ' 已存到 ' + where });
  return blob;
}

/** 把 onnxruntime 的 wasm 引擎也存進快取，並直接餵給它 —— 這樣整套就離線可用。
    失敗就退回「每次跟 CDN 拿」，不會讓功能整個掛掉。 */
async function primeWasm(base){
  const w = T.env && T.env.backends && T.env.backends.onnx && T.env.backends.onnx.wasm;
  if (!w) return;
  w.numThreads = 1;          // file:// 沒有 SharedArrayBuffer，多執行緒起不來
  w.proxy = false;
  w.wasmPaths = base;        // 先給預設，下面成功了再換成本機的
  try {
    const mjs = await cachedFetch(base + 'ort-wasm-simd-threaded.jsep.mjs',  '取得 wasm 載入器');
    const bin = await cachedFetch(base + 'ort-wasm-simd-threaded.jsep.wasm', '取得 wasm 引擎（21MB）');
    // 兩個都用 blob 網址交給 ORT。
    // ※ 不要再設 wasmBinary —— 實測「blob 版載入器 ＋ wasmBinary」會直接卡死不回來
    //   （blob 網址單獨用沒問題，加上 wasmBinary 就掛）。
    w.wasmPaths = {
      mjs:  URL.createObjectURL(new Blob([await mjs.text()],        { type:'text/javascript' })),
      wasm: URL.createObjectURL(new Blob([await bin.arrayBuffer()], { type:'application/wasm' }))
    };
    w.wasmBinary = undefined;
    post('status', { s: 'wasm 引擎就緒（本機）' });
  } catch(e){
    w.wasmPaths = base;
    post('warn', { msg: 'wasm 引擎沒能存到本機，改成每次跟 CDN 拿：' + e.message });
  }
}

async function loadLib(urls){
  if (T) return;
  let last = null;
  for (const u of urls){
    try {
      // 先存進 IndexedDB 再從 blob 載入，之後斷網也開得起來
      const blob = await cachedFetch(u, '取得語音辨識程式庫');
      const src  = await blob.text();
      // 擋掉「CDN 回了一頁 HTML 錯誤頁」這種情形：ESM 一定有 export
      if (src.length < 500 || src.indexOf('export') < 0)
        throw new Error('抓到的不是程式庫（' + src.length + ' 個字元，開頭是「'
                        + src.slice(0, 40).replace(/\s+/g, ' ') + '」）');
      T = await import(URL.createObjectURL(new Blob([src], { type:'text/javascript' })));
      LIB_BASE = u.slice(0, u.lastIndexOf('/') + 1);
      post('status', { s: '程式庫就緒' });
      break;
    }
    catch(e){ last = e; post('status', { s: '換一個來源再試…' }); }
  }
  if (!T) throw new Error('載入語音辨識程式庫失敗：' + (last ? last.message : '未知原因')
                          + '。第一次使用需要連得上網路（cdn.jsdelivr.net）。');
  T.env.allowLocalModels = false;
  T.env.useBrowserCache = false;
  T.env.useCustomCache  = true;
  T.env.customCache     = modelCache;
  await primeWasm(LIB_BASE);
}

/** navigator.gpu 存在不代表真的要得到顯示卡。
    （把瀏覽器的硬體加速關掉時就是這樣：物件在，requestAdapter() 回 null。）
    所以一定要真的問一次。 */
async function gpuUsable(){
  try {
    if (!navigator.gpu) return false;
    const a = await navigator.gpu.requestAdapter();
    return !!a;
  } catch(e){ return false; }
}

async function getPipe(model, device){
  if (device === 'webgpu' && !(await gpuUsable())){
    device = 'wasm';
    post('warn', { msg: '這個瀏覽器要不到顯示卡（多半是硬體加速被關掉），改用 CPU 跑' });
    post('nogpu', {});
  }
  const key = model + '|' + device;
  if (pipe && curKey === key) return pipe;
  if (pipe){ try { await pipe.dispose(); } catch(e){} pipe = null; }

  // 各家模型倉庫收的檔案不一樣：Xenova/* 通常只有原尺寸與 _quantized，
  // onnx-community/* 才有 _q4、_fp16。所以排一串組合依序試，
  // 哪一個真的有檔案就用哪一個 —— 不要因為猜錯檔名就整個失敗。
  const plans = [];
  if (device === 'webgpu'){
    plans.push({ device:'webgpu', dtype:{ encoder_model:'fp32', decoder_model_merged:'q4' } });
    plans.push({ device:'webgpu', dtype:{ encoder_model:'fp32', decoder_model_merged:'fp32' } });
    plans.push({ device:'webgpu', dtype:'fp32' });
  }
  plans.push({ device:'wasm', dtype:'q8' });
  plans.push({ device:'wasm', dtype:'fp32' });

  const name = pl => pl.device + ' / ' + (typeof pl.dtype === 'string' ? pl.dtype
                : Object.keys(pl.dtype).map(k => k.split('_')[0] + '=' + pl.dtype[k]).join(' '));
  const fails = [];
  for (const pl of plans){
    try {
      post('status', { s: '嘗試 ' + name(pl) + '…' });
      pipe = await T.pipeline('automatic-speech-recognition', model,
        { device: pl.device, dtype: pl.dtype, progress_callback: p => post('dl', p) });
      curKey = model + '|' + pl.device;
      post('plan', { name: name(pl), device: pl.device });
      return pipe;
    } catch(e){
      const msg = String((e && e.message) || e).replace(/\s+/g, ' ').slice(0, 220);
      fails.push(name(pl) + ' → ' + msg);
      post('warn', { msg: name(pl) + ' 不行：' + msg });
    }
  }
  // 每一組都列出來，不要只留最後一個 —— 只看最後一個會誤判成 GPU 的問題
  throw new Error('這個模型的所有檔案組合都載不起來：\n' + fails.map(x => '· ' + x).join('\n'));
}

async function walk(d, prefix, out){
  for await (const [name, h] of d.entries()){
    const pth = prefix ? prefix + '/' + name : name;
    if (h.kind === 'directory') await walk(h, pth, out);
    else { try { const f = await h.getFile(); out.push({ path: pth, size: f.size }); } catch(e){} }
  }
}
async function rmTree(d, name){
  try { await d.removeEntry(name, { recursive:true }); return true; } catch(e){ return false; }
}

self.onmessage = async e => {
  const m = e.data;
  if (m.dir !== undefined) DIR = m.dir || null;

  if (m.cmd === 'cache'){                       // 列出已經存下來的東西
    const out = [];
    let where = '瀏覽器（沒有選資料夾）';
    if (DIR){
      where = 'asr 資料夾';
      try { await walk(DIR, '', out); } catch(err){ where = '資料夾讀取失敗：' + err.message; }
    } else {
      try {
        const db = await idb();
        const keys = await new Promise((res, rej) => { const r = db.transaction(STORE).objectStore(STORE).getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
        const vals = await new Promise((res, rej) => { const r = db.transaction(STORE).objectStore(STORE).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
        keys.forEach((k, i) => out.push({ path: urlToPath(k).join('/'), size: (vals[i] && vals[i].blob) ? vals[i].blob.size : 0 }));
      } catch(err){}
    }
    post('cache', { files: out, where });
    return;
  }
  if (m.cmd === 'clear'){
    try {
      if (DIR && m.path){
        // path 形如 models/Xenova/whisper-small 或 lib
        const parts = m.path.split('/').filter(Boolean);
        let d = DIR;
        for (let i = 0; i < parts.length - 1; i++) d = await d.getDirectoryHandle(parts[i]);
        await rmTree(d, parts[parts.length - 1]);
      } else if (!DIR){
        const db = await idb();
        const tx = db.transaction(STORE, 'readwrite');
        const st = tx.objectStore(STORE);
        const r = st.getAllKeys();
        r.onsuccess = () => { for (const k of r.result)
          if (!m.path || urlToPath(k).join('/').indexOf(m.path) === 0) st.delete(k); };
        await new Promise(res => { tx.oncomplete = res; tx.onerror = res; });
      }
      post('cleared', {});
    } catch(err){ post('cleared', { err: err.message }); }
    return;
  }
  if (m.cmd === 'prime'){                       // 先把程式庫與 wasm 抓下來存好（離線準備）
    try { await loadLib(m.libs); post('primed', {}); }
    catch(err){ post('primed', { err: err.message }); }
    return;
  }
  if (m.cmd !== 'run') return;
  let stage = '載入程式庫';
  try {
    await loadLib(m.libs);
    stage = '下載模型';
    post('status', { s: '準備模型…' });
    let p;
    try { p = await getPipe(m.model, m.device); }
    catch(e){
      // 有可能是本機快取的 wasm 引擎餵不進去。退回「跟 CDN 拿」再試一次，
      // 不要因為一個最佳化就讓整個功能不能用。
      const w = T.env.backends && T.env.backends.onnx && T.env.backends.onnx.wasm;
      if (w && typeof w.wasmPaths === 'object'){
        post('warn', { msg: '本機 wasm 引擎啟動失敗，改用 CDN 再試一次：' + e.message });
        w.wasmPaths = LIB_BASE; w.wasmBinary = undefined;
        p = await getPipe(m.model, m.device);
      } else throw e;
    }
    stage = '辨識';

    // 自己包一層 generate，才知道跑到第幾段（函式庫沒有給進度回呼）
    const SR = 16000, WIN = SR * 30, JUMP = SR * 20;
    const total = Math.max(1, Math.ceil(Math.max(0, m.audio.length - WIN) / JUMP) + 1);
    let done = 0;
    const model = p.model;
    if (!model.__nvWrapped){
      const orig = model.generate.bind(model);
      model.generate = async (...a) => { const r = await orig(...a); post('step', { done: ++done, total }); return r; };
      model.__nvWrapped = true;
    } else { done = 0; }
    post('status', { s: '開始辨識…' });
    post('step', { done: 0, total });

    const opt = { chunk_length_s: 30, stride_length_s: 5, return_timestamps: true };
    if (m.lang !== 'auto'){ opt.language = m.lang; opt.task = 'transcribe'; }
    const out = await p(m.audio, opt);
    post('done', { text: out.text || '', chunks: out.chunks || [] });
  } catch(err){
    post('error', { stage, msg: '[' + stage + '] ' + ((err && err.message) || String(err)) });
  }
};
`;

/** 拿到 <專案資料夾>/asr。ask=true 時沒選過會請使用者選一次。
    模型與程式庫都存成那裡的真實檔案 —— 看得到、備份得了、換電腦拷貝就能用。 */
async function asrDir(ask){
  try {
    if (typeof ensureDir !== 'function') return null;
    const d = await ensureDir(!!ask);
    if (!d) return null;
    return await d.getDirectoryHandle('asr', { create:true });
  } catch(e){ return null; }
}

function asrWorker(){
  if (ASR.worker) return ASR.worker;
  const url = URL.createObjectURL(new Blob([ASR_WORKER_SRC], { type: 'text/javascript' }));
  ASR.worker = new Worker(url);          // 一定要 classic worker，module worker 在 file:// 起不來
  ASR.worker.onerror = () => {};
  return ASR.worker;
}
function asrKillWorker(){
  if (ASR.worker){ try { ASR.worker.terminate(); } catch(e){} ASR.worker = null; }
}

/* ── 把時間軸的聲音抽成 16kHz 單聲道 ────────────────────────
   Whisper 只吃 16kHz mono。這裡刻意「不管靜音、不管音量、不管淡入淡出」：
   那些是給觀眾聽的設定，辨識要聽的是原始講話。
   位置用 layout()，所以字幕時間跟剪完的影片對得上。 */
async function asrExtract16k(scopeId, onProg){
  const SR = 16000;
  const L = layout();
  let t0 = 0, t1 = totalDur();
  let list = A.clips.map((c, i) => ({ c, i }));
  if (scopeId && scopeId !== 'all'){
    const i = A.clips.findIndex(c => c.id === scopeId);
    if (i < 0) throw new Error('找不到那一段影片');
    list = [{ c: A.clips[i], i }];
    t0 = L[i].start; t1 = t0 + L[i].dur;
  }
  const dur = Math.max(0.1, t1 - t0);
  if (dur > 3 * 3600) throw new Error('超過 3 小時，記憶體會爆，請分段處理');

  const oc = new OfflineAudioContext(1, Math.ceil(dur * SR), SR);
  let got = 0;
  for (const { c, i } of list){
    if (onProg) onProg(`解碼「${c.name}」…`);
    const buf = await getClipAudio(c, oc);
    if (!buf) continue;
    const d = Math.min(L[i].dur, Math.max(0, buf.duration - c.inP));
    if (d <= 0.01) continue;
    const src = oc.createBufferSource();
    src.buffer = buf;
    src.connect(oc.destination);
    src.start(Math.max(0, L[i].start - t0), c.inP, d);
    got++;
  }
  if (!got) throw new Error('這些片段裡沒有可以辨識的聲音（可能是純畫面或圖片）');
  if (onProg) onProg('混音中…');
  const out = await oc.startRendering();
  return { pcm: out.getChannelData(0), offset: t0, dur };
}

/* ── 辨識結果 → 字幕 ────────────────────────────────────── */

/* Whisper 在沒人講話的地方很愛「幻聽」出這幾句固定的話，直接濾掉。
   規則刻意寫得很窄：只擋整句都是招呼語的樣子。
   像「記得訂閱」這種人真的會講的話，不能因為有「訂閱」兩個字就被吃掉。 */
const ASR_JUNK = [
  /字幕(由|組|志[願愿]者)/, /Amara\.?org/i, /MING\s*PAO/i,
  /[点點][贊赞].*[订訂][阅閱]|[订訂][阅閱].*[转轉][发發]/,      // 「請不吝點贊 訂閱 轉發…」
  /明[镜鏡][与與]?[点點][点點]|[点點][点點][栏欄]目/,
  /^\s*(thanks?\s+for\s+watching|thank you|you|bye|please subscribe[^]*?)[\s.!?…]*$/i,
  /^\s*[.。,，、!！?？~～\-—…\s]*$/,                            // 只有標點
];
const asrIsJunk = s => ASR_JUNK.some(re => re.test(s));

/** 一句太長就在標點處切開，時間照字數分配 */
function asrSplitCue(cue, maxLen){
  const t = cue.text;
  if (Array.from(t).length <= maxLen) return [cue];
  const parts = t.split(/(?<=[。！？!?，,、;；:：])/).filter(s => s.trim());
  if (parts.length < 2) return [cue];
  // 相鄰的短塊先黏起來，避免切出一堆兩個字的字幕
  const merged = [];
  for (const p of parts){
    const last = merged[merged.length - 1];
    if (last && Array.from(last + p).length <= maxLen) merged[merged.length - 1] = last + p;
    else merged.push(p);
  }
  if (merged.length < 2) return [cue];
  const totalCh = merged.reduce((s, p) => s + Array.from(p).length, 0) || 1;
  const span = cue.end - cue.start;
  const out = []; let acc = 0;
  for (const p of merged){
    const n = Array.from(p).length;
    const st = cue.start + span * (acc / totalCh);
    acc += n;
    const en = cue.start + span * (acc / totalCh);
    const txt = p.replace(/[，,、;；]\s*$/, '').trim();
    if (txt) out.push({ id: uid(), start: st, end: Math.max(st + 0.25, en), text: txt });
  }
  return out.length ? out : [cue];
}

/** 把 Whisper 的 chunks 整理成字幕 */
function asrToCues(chunks, offset, dur, opt){
  const raw = [];
  for (const ch of (chunks || [])){
    const ts = ch.timestamp || [];
    let s = +ts[0], e = +ts[1];
    if (!Number.isFinite(s)) continue;
    if (!Number.isFinite(e) || e <= s) e = Math.min(dur, s + 3);
    let text = String(ch.text || '').trim();
    if (!text || asrIsJunk(text)) continue;
    raw.push({ start: offset + Math.max(0, s), end: offset + Math.min(dur, e), text });
  }
  raw.sort((a, b) => a.start - b.start);

  const out = [];
  for (const c of raw){
    const prev = out[out.length - 1];
    if (prev && prev.text === c.text && c.start - prev.end < 0.6) continue;   // 重複的整句丟掉
    if (prev && c.start < prev.end) c.start = prev.end;                        // 不重疊
    if (c.end <= c.start + 0.15) c.end = c.start + 0.5;
    out.push(c);
  }
  let cues = out.map(c => ({ id: uid(), start: c.start, end: c.end,
                             text: opt.tw ? toTW(c.text) : c.text }));
  if (opt.split){
    const flat = [];
    for (const c of cues) flat.push(...asrSplitCue(c, 20));
    cues = flat;
  }
  // 這裡只清空句子。幻聽在上面轉繁體之前就擋過了，
  // 不能再擋一次 —— 否則「記得訂閱」這種真的講出來的話會被誤殺。
  return cues.filter(c => c.text.trim());
}

/** 小小的三選一對話框。回傳被按下的那個 key（點外面或 Esc ＝ cancel）。 */
function asrAsk(title, msg, choices){
  return new Promise(res => {
    const mask = $('#qmask');
    $('#qTitle').textContent = title;
    $('#qMsg').innerHTML = msg;
    const box = $('#qBtns');
    box.innerHTML = '';
    const done = k => { mask.classList.remove('on'); mask.onmousedown = null;
                        document.removeEventListener('keydown', esc, true); res(k); };
    const esc = e => { if (e.key === 'Escape'){ e.stopPropagation(); done('cancel'); } };
    for (const c of choices){
      const b = document.createElement('button');
      b.textContent = c.label;
      if (c.pri) b.className = 'pri';
      if (c.title) b.title = c.title;
      b.onclick = () => done(c.k);
      box.appendChild(b);
    }
    mask.onmousedown = e => { if (e.target === mask) done('cancel'); };
    document.addEventListener('keydown', esc, true);
    mask.classList.add('on');
  });
}

/* ── 主流程 ───────────────────────────────────────────────── */
async function asrRun(){
  if (ASR.busy){ toast('已經在辨識了', true); return; }
  if (!A.clips.length){ toast('先加影片再產生字幕', true); return; }

  // 時間軸上已經有字幕的話先問清楚 —— 不問就直接疊上去，會變成兩套字幕
  let replace = false;
  if (A.subs.length){
    const a = await asrAsk('時間軸上已經有字幕',
      `目前有 <b>${A.subs.length}</b> 句字幕。新產生的要怎麼處理？`,
      [{ k:'cancel', label:'取消' },
       { k:'append', label:'加上去', title:'保留舊的，新的疊上去（時間可能會撞在一起）' },
       { k:'replace', label:'取代（清掉舊的）', pri:true }]);
    if (a === 'cancel') return;
    replace = (a === 'replace');
  }

  ASR.busy = true; ASR.cancel = false;
  const t0 = performance.now();
  mShow('AI 字幕產生中', '影片沒有離開你的電腦，只有模型檔會從網路下載');
  $('#mCancel').classList.remove('hide');
  $('#mCancel').onclick = () => { ASR.cancel = true; asrKillWorker(); ASR.busy = false; mDone('已取消', '', '—'); };
  try {
    mProg(2, '抽出聲音…');
    const { pcm, offset, dur } = await asrExtract16k(ASR.scope, s => mProg(4, s));
    if (ASR.cancel) return;
    mProg(8, `聲音長度 ${fmt(dur)}，交給辨識引擎…`);

    const device = ASR.device === 'auto' ? (navigator.gpu ? 'webgpu' : 'wasm') : ASR.device;
    // 重新整理之後資料夾權限會回到「待授權」，要在點擊當下重新要一次（只是一個「允許」按鈕）。
    // 沒有記住任何資料夾時就不要跳「選資料夾」視窗打擾人，改存瀏覽器。
    const dir = await asrDir(!!asrDirName());

    const trace = [];
    ASR.trace = trace;               // 失敗時也要看得到，所以先掛上去
    const note = x => { trace.push(x); if (trace.length > 40) trace.shift(); };
    const chunks = await new Promise((res, rej) => {
      const w = asrWorker();
      let lastFile = '', dlPct = 0, settled = false;
      // 結束之後一定要拔掉 handler：worker 還有其他訊息在路上，
      // 不拔會把失敗原因用「XXX 就緒」這種進度訊息蓋掉（v5.4 踩過）
      let wd = null;
      const fin = (fn, v) => { if (settled) return; settled = true; w.onmessage = null; clearTimeout(wd); fn(v); };
      const kick = () => { clearTimeout(wd); wd = setTimeout(() => {
        asrKillWorker();
        fin(rej, new Error('五分鐘沒有任何進展，已中止。可能是模型檔卡在下載，或這台機器跑不動這個模型。'));
      }, 300000); };
      kick();
      w.onmessage = ev => {
        const m = ev.data;
        if (settled) return;
        kick();
        if (m.t === 'status'){ note(m.s); mProg(Math.max(8, dlPct), m.s); }
        else if (m.t === 'warn'){ note('⚠ ' + m.msg); console.warn(m.msg); }
        else if (m.t === 'plan'){ note('採用 ' + m.name); ASR.plan = m.name; ASR.usedDevice = m.device; }
        else if (m.t === 'nogpu'){ ASR.noGpu = true; note('這台瀏覽器要不到顯示卡，改用 CPU'); }
        else if (m.t === 'dl'){
          if (m.status === 'progress' && m.total){
            dlPct = 8 + Math.round((m.loaded / m.total) * 30);
            if (m.file !== lastFile){ lastFile = m.file; note('下載 ' + m.file); }
            mProg(dlPct, `下載模型 ${m.file}　${(m.loaded/1048576).toFixed(1)} / ${(m.total/1048576).toFixed(1)} MB`);
          } else if (m.status === 'done' && m.file){
            mProg(Math.max(dlPct, 38), `模型檔 ${m.file} 就緒`);
          }
        }
        else if (m.t === 'step'){
          const p = 40 + Math.round((m.done / Math.max(1, m.total)) * 55);
          const el = (performance.now() - t0) / 1000;
          const eta = m.done > 0 ? el / m.done * (m.total - m.done) : 0;
          mProg(p, `辨識中　${m.done} / ${m.total} 段` + (m.done > 0 ? `　剩下大約 ${fmt(eta)}` : ''));
        }
        else if (m.t === 'done') fin(res, m.chunks);
        else if (m.t === 'error'){ note('✗ ' + m.msg); fin(rej, new Error(m.msg)); }
      };
      w.postMessage({ cmd:'run', libs: ASR_LIBS, model: ASR.model, dir,
                      device, lang: ASR.lang, audio: pcm }, [pcm.buffer]);
    });
    if (ASR.cancel) return;

    mProg(96, '整理字幕…');
    const cues = asrToCues(chunks, offset, dur, { tw: ASR.tw, split: ASR.split });
    cues.forEach(c=>c.track=clipTrack(A.clips.find(x=>x.id===ASR.scope)));
    if (!cues.length){ mDone('沒有聽到內容', '', '這段聲音裡沒有辨識出任何句子。可以換大一點的模型再試。'); return; }

    pushUndo();
    if (replace) A.subs = [];
    A.subs.push(...cues);
    A.subs.sort((a, b) => a.start - b.start);
    A.sel = { type:'sub', id: cues[0].id };
    render(); refreshProp(); asrUpdateState();

    const secs = (performance.now() - t0) / 1000;
    const saved = await srtSaveBeside(cues);
    mDone('字幕產生完成', `${cues.length} 句　花了 ${fmt(secs)}` + (replace ? '（已取代舊字幕）' : ''),
      (saved ? `已存成 <b>${esc(saved)}</b><br>`
             : `<span style="color:var(--warn-soft)">還沒指定資料夾，SRT 沒有存檔。</span><br>`) +
      `<span style="color:var(--fg3)">按「完成」會直接開字幕編輯器，可以逐句校對，改完按「存成 SRT」。</span>`);
    $('#mClose').onclick = () => { $('#mask').classList.remove('on'); openSubEditor(); };
  } catch(e){
    if (!ASR.cancel){
      const tr = (ASR.trace || []).slice(-14);
      mDone('字幕產生失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span><br><br>
        <span style="color:var(--fg3)">程式庫、wasm 引擎、模型檔第一次都要從 cdn.jsdelivr.net 與
        huggingface.co 下載，抓過一次就變成 asr 資料夾裡的檔案，之後不用網路。</span>
        ${tr.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--fg2)">
          過程紀錄（點開，可整段複製給我看）</summary>
          <pre id="asrTrace" style="white-space:pre-wrap;font-size:11px;color:var(--fg2);
            max-height:180px;overflow:auto;margin:6px 0 0">${esc(tr.join('\n'))}</pre>
          <button class="gh" id="asrCopyErr" style="margin-top:6px">複製</button></details>` : ''}`);
      const cp = $('#asrCopyErr');
      if (cp) cp.onclick = () => {
        const txt = (e.message || e) + '\n\n' + (ASR.trace || []).join('\n');
        navigator.clipboard.writeText(txt).then(() => toast('已複製'), () => toast('複製失敗', true));
      };
    }
  } finally {
    ASR.busy = false;
    $('#mCancel').onclick = null;
  }
}

/* ── 把 SRT 寫到專案資料夾 ─────────────────────────────────── */
function srtName(){
  const base = (typeof _curProj === 'object' && _curProj && _curProj.name)
    ? _curProj.name
    : (A.clips[0] ? A.clips[0].name.replace(/\.[^.]+$/, '') : 'NiVedit');
  return base.replace(/[\\/:*?"<>|]/g, '_') + '.srt';
}
/** 先試「記住的專案資料夾」，不行就開另存視窗，再不行就直接下載 */
async function srtSaveBeside(cuesForToast){
  const name = srtName();
  const text = toSRT(A.subs.length ? A.subs : cuesForToast);
  const blob = new Blob(['﻿' + text], { type:'text/plain;charset=utf-8' });
  try {
    const d = (typeof ensureDir === 'function') ? await ensureDir(false) : null;
    if (d){
      const fh = await d.getFileHandle(name, { create:true });
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
      return d.name + ' / ' + name;
    }
  } catch(e){ /* 沒權限就走下面 */ }
  return null;
}
/** 使用者主動按「存成 SRT」時走這條：一定會問要存哪 */
async function srtSaveAs(cues, name){
  cues = Array.isArray(cues) ? cues : A.subs;
  if (!cues.length){ toast('目前沒有字幕', true); return; }
  name = typeof name === 'string' ? name : srtName();
  const blob = new Blob(['﻿' + toSRT(cues)], { type:'text/plain;charset=utf-8' });
  try {
    const d = await ensureDir(false);
    if (d){
      const fh = await d.getFileHandle(name, { create:true });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      toast(`已存到「${d.name}」資料夾：${name}`);
      return;
    }
  } catch(e){}
  if (typeof window.showSaveFilePicker === 'function'){
    try {
      const fh = await window.showSaveFilePicker({ suggestedName: name, id:'nivedit-projects',
        types:[{ description:'SRT 字幕', accept:{ 'text/plain':['.srt'] } }] });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      toast('已存成 ' + fh.name);
      return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  exportSRT(cues, name);
}

/** 先把程式庫與 wasm 引擎抓下來存好。模型檔第一次辨識時才會抓（比較大，看選哪一個）。 */
async function asrPrime(){
  if (ASR.busy){ toast('正在辨識中', true); return; }
  const dir = await asrDir(true);          // 趁還有點擊授權，把資料夾問好
  if (!dir) toast('沒有選資料夾，會先存在瀏覽器裡', true);
  mShow('離線準備', dir ? '把程式庫與 wasm 引擎存進 asr 資料夾'
                        : '把程式庫與 wasm 引擎存進瀏覽器');
  $('#mCancel').classList.add('hide');
  mProg(5, '開始…');
  const t0 = performance.now();
  try {
    await new Promise((res, rej) => {
      const w = asrWorker();
      w.onmessage = ev => {
        const m = ev.data;
        if (m.t === 'status') mProg(Math.max(8, +($('#mBar').style.width || '8').replace('%','')), m.s);
        else if (m.t === 'dl' && m.status === 'progress' && m.total)
          mProg(8 + Math.round((m.loaded / m.total) * 88),
                `${m.file}　${(m.loaded/1048576).toFixed(1)} / ${(m.total/1048576).toFixed(1)} MB`);
        else if (m.t === 'warn') console.warn(m.msg);
        else if (m.t === 'primed'){ m.err ? rej(new Error(m.err)) : res(); }
      };
      w.postMessage({ cmd:'prime', libs: ASR_LIBS, dir });
    });
    mDone('離線準備完成', `花了 ${fmt((performance.now()-t0)/1000)}`,
      (dir ? `程式庫與 wasm 引擎已經存成 <b>${esc(asrDirName() || '')}\\asr\\lib\\</b> 裡的真實檔案。<br>`
           : '程式庫與 wasm 引擎已經存在瀏覽器裡。<br>') +
      `<span style="color:var(--fg3)">之後不用網路也開得起來。模型檔要等第一次按「產生字幕」才會抓
       （看你選哪一個，40MB～800MB），也會存進同一個地方。</span>`);
  } catch(e){
    mDone('離線準備失敗', '', `<span style="color:var(--danger)">${esc(e.message || e)}</span><br>
      <span style="color:var(--fg3)">現在連不到 CDN。等網路通了再按一次。</span>`);
  }
}

async function showModelCache(){
  const dir = await asrDir(false);
  const w = asrWorker();
  w.onmessage = ev => {
    const m = ev.data;
    if (m.t !== 'cache') return;
    // 依「第一層＋第二層」分組：lib、models/Xenova/whisper-small…
    const grp = {};
    for (const f of (m.files || [])){
      const p = f.path.split('/');
      const key = p[0] === 'models' ? p.slice(0, 3).join('/') : p[0];
      if (!grp[key]) grp[key] = { size:0, n:0 };
      grp[key].size += f.size; grp[key].n++;
    }
    const nice = k => k === 'lib' ? '語音辨識程式庫＋wasm 引擎'
                    : k.startsWith('models/') ? k.slice(7) : k;
    const rows = Object.keys(grp).sort();
    const html = rows.length
      ? rows.map(k => `<div class="prow"><div class="pmeta"><b>${esc(nice(k))}</b>
          <span>${(grp[k].size/1048576).toFixed(1)} MB　${grp[k].n} 個檔案　<code>${esc(k)}</code></span></div>
          <button class="gh" data-del="${esc(k)}">刪除</button></div>`).join('')
      : '<div class="hint">還沒有存下任何東西。網路好的時候按「離線準備」，或直接按「產生字幕」。</div>';
    $('#pquota').innerHTML = dir
      ? `存放位置：<b>${esc(asrDirName() || '')}\\asr\\</b>　—— 真實檔案，備份或換電腦直接拷貝這個資料夾就好`
      : `存放位置：<b>瀏覽器內部儲存</b>　—— <span style="color:var(--warn-soft)">建議按「離線準備」選一個資料夾，
         瀏覽器儲存可能被系統清掉，也帶不到別台電腦</span>`;
    $('#pbody').innerHTML = html;
    $('#pfoot').classList.add('hide');
    $$('#pbody [data-del]').forEach(btn => btn.onclick = () => {
      if (!confirm(`確定要刪掉「${nice(btn.dataset.del)}」？下次要用會重新下載。`)) return;
      w.postMessage({ cmd:'clear', dir, path: btn.dataset.del });
      btn.disabled = true; btn.textContent = '刪除中…';
      setTimeout(showModelCache, 700);
    });
    $('#pmask').classList.add('on');
    $('#pClose').onclick = () => { $('#pmask').classList.remove('on'); $('#pfoot').classList.remove('hide'); };
  };
  w.postMessage({ cmd:'cache', dir });
}

/* ── 字幕編輯器 ───────────────────────────────────────────── */
let _seSel = null;
let _seTrack = null;  // 編輯器本身的目標軌；新增不可再由舊的 A.sel 猜測。
function subEditorCues(){ return A.subs.filter(c => subTrack(c) === (_seTrack === 1 ? 1 : 0)); }
function setSubEditorTrack(track){
  _seTrack = +track === 1 ? 1 : 0;
  const cue = subEditorCues().find(c => c.id === _seSel) || subEditorCues()[0];
  _seSel = cue ? cue.id : null;
  A.sel = cue ? {type:'sub', id:cue.id} : {type:'proj', id:null};
  render(); refreshProp(); renderSubEditor();
}


function openSubEditor(){
  if (_seTrack === null || A.sel.type === 'sub' || A.sel.type === 'clip') _seTrack = subtitleTargetTrack();
  const selected = subEditorCues().find(c => A.sel.type === 'sub' && c.id === A.sel.id);
  _seSel = selected ? selected.id : null;
  $('#emask').classList.add('on');
  renderSubEditor();
  focusSubEditor(_seSel);
}
function closeSubEditor(){ $('#emask').classList.remove('on'); renderTimeline(); refreshProp(); markDirty(); }
function focusSubEditor(id, selectText=false){
  const row = Array.from($('#eList').querySelectorAll('.scue')).find(el => el.dataset.id === id);
  if (!row) return;
  row.scrollIntoView({block:'nearest'});
  const input = row.querySelector('.tx');
  input.focus({preventScroll:true});
  if (selectText) input.select();
}

function renderSubEditor(keepScroll){
  const box = $('#eList');
  if (!box) return;
  const top = keepScroll ? box.scrollTop : 0;
  const cues = subEditorCues().sort((a, b) => a.start - b.start);
  $('#eTrack').value = String(_seTrack === 1 ? 1 : 0);
  $('#eCount').textContent = cues.length + ' 句';
  box.innerHTML = cues.map((c, i) => `
    <div class="scue${_seSel === c.id ? ' sel' : ''}" data-id="${c.id}">
      <div class="n">${i + 1}<select class="subTrackSelect" title="字幕軌道"><option value="1"${subTrack(c)===1?' selected':''}>字幕上軌</option><option value="0"${subTrack(c)===0?' selected':''}>字幕下軌</option></select></div>
      <div class="tm">
        <input class="ts" data-k="start" value="${srtTime(c.start)}" title="開始時間">
        <input class="ts" data-k="end"   value="${srtTime(c.end)}"   title="結束時間">
        <div class="dur">${(c.end - c.start).toFixed(1)}s</div>
      </div>
      <textarea class="tx" rows="2" spellcheck="false">${esc(c.text)}</textarea>
      <div class="ops">
        <button class="x" data-a="go"    title="跳到這一句">▶</button>
        <button class="x" data-a="merge" title="跟下一句合併"${i === cues.length - 1 ? ' disabled' : ''}>⇊</button>
        <button class="x" data-a="del"   title="刪除這一句">✕</button>
      </div>
    </div>`).join('');
  if (!cues.length) box.innerHTML = '<div class="hint" style="padding:24px 8px">此軌目前沒有字幕，按「＋ 一句」開始新增。</div>';

  box.querySelectorAll('.scue').forEach(el => {
    const id = el.dataset.id;
    const c = () => A.subs.find(x => x.id === id);
    el.querySelector('.subTrackSelect').onchange=e=>{pushUndo();c().track=+e.target.value;_seSel=null;render();refreshProp();renderSubEditor(true);};
    el.querySelector('.tx').oninput = e => { const x = c(); if (x){ x.text = e.target.value; markDirty(); } };
    el.querySelector('.tx').onfocus = () => { _seSel = id; A.sel = { type:'sub', id }; box.querySelectorAll('.scue').forEach(n => n.classList.toggle('sel', n.dataset.id === id)); };
    el.querySelectorAll('.ts').forEach(inp => {
      inp.onchange = () => {
        const x = c(); if (!x) return;
        const t = parseSrtTime(inp.value);
        if (t === null){ inp.value = srtTime(x[inp.dataset.k]); toast('時間格式看不懂，要像 00:00:03,500', true); return; }
        pushUndo();
        x[inp.dataset.k] = t;
        if (x.end <= x.start + 0.1) x.end = x.start + 0.5;
        render(); renderSubEditor(true);
      };
    });
    el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const x = c(); if (!x) return;
      const a = b.dataset.a;
      if (a === 'go'){ seekTo(x.start + 0.05); A.sel = { type:'sub', id }; _seSel = id; render(); refreshProp();
                       box.querySelectorAll('.scue').forEach(n => n.classList.toggle('sel', n.dataset.id === id)); return; }
      pushUndo();
      if (a === 'del') A.subs = A.subs.filter(y => y.id !== id);
      if (a === 'merge'){
        const i = cues.findIndex(c => c.id === id), nx = cues.slice(i+1).find(c=>subTrack(c)===subTrack(x));
        if (nx){ x.text = (x.text + ' ' + nx.text).trim(); x.end = nx.end; A.subs.splice(A.subs.indexOf(nx), 1); }
      }
      render(); refreshProp(); asrUpdateState(); renderSubEditor(true);
    });
  });
  box.scrollTop = top;
}

/** "00:00:03,500" → 3.5；看不懂回 null。也接受 "3.5" 這種純秒數 */
function parseSrtTime(s){
  s = String(s).trim();
  let m = s.match(/^(\d{1,3}):(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
  if (m) return +m[1]*3600 + +m[2]*60 + +m[3] + +('0.' + m[4].padEnd(3,'0'));
  m = s.match(/^(\d{1,3}):(\d{1,2})[,.](\d{1,3})$/);
  if (m) return +m[1]*60 + +m[2] + +('0.' + m[3].padEnd(3,'0'));
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  return null;
}

/** 整批取代 —— 辨識常常固定認錯同一個詞，一次改完最省事 */
function subReplaceAll(){
  const from = $('#eFind').value;
  if (!from){ toast('先填要找什麼', true); return; }
  const to = $('#eRepl').value;
  let n = 0;
  pushUndo();
  for (const c of subEditorCues()){
    if (c.text.indexOf(from) < 0) continue;
    c.text = c.text.split(from).join(to);
    n++;
  }
  render(); renderSubEditor(true);
  toast(n ? `改了 ${n} 句` : '沒有一句含有這個字', !n);
}
function subToTWAll(){
  pushUndo();
  let n = 0;
  for (const c of subEditorCues()){ const t = toTW(c.text); if (t !== c.text){ c.text = t; n++; } }
  render(); renderSubEditor(true);
  toast(n ? `轉了 ${n} 句` : '本來就都是繁體了');
}
function subClearAll(){
  const cues = subEditorCues();
  if (!cues.length) return;
  if (!confirm(`確定要刪掉本軌的 ${cues.length} 句字幕？`)) return;
  pushUndo();
  const ids = new Set(cues.map(c => c.id));
  A.subs = A.subs.filter(c => !ids.has(c.id));
  if (A.sel.type === 'sub' && ids.has(A.sel.id)) A.sel = {type:'proj',id:null};
  _seSel = null;
  render(); refreshProp(); asrUpdateState(); renderSubEditor();
}

function initASR(){
  asrPanel();
  checkGpu().then(() => asrPanel());     // 真的問一次顯示卡，問到再把面板換掉
  on('asrHead', () => {
    const L = $('#left'), off = L.classList.toggle('asrfold');
    $('#asrFold').textContent = off ? '▸' : '▾';
  });
  on('eClose', closeSubEditor);
  bind('eTrack','change', v => setSubEditorTrack(v));
  on('eAdd', () => {
    const cue = addSub(A.playhead, _seTrack === 1 ? 1 : 0);
    _seSel = cue.id;
    renderSubEditor(true); asrUpdateState();
    focusSubEditor(cue.id, true);
  });
  on('eRepl2', subReplaceAll);
  on('eTW',    subToTWAll);
  on('eClear', subClearAll);
  on('eSrt', () => srtSaveAs(subEditorCues(), srtName().replace(/\.srt$/i, _seTrack === 1 ? '_upper.srt' : '_lower.srt')));
  const em = $('#emask');
  if (em) em.addEventListener('mousedown', e => { if (e.target === em) closeSubEditor(); });
}

<script>
/* ==========================================================================
   NiVedit — 匯出：逐幀合成 → WebCodecs 編碼 → mp4-muxer 封裝
   影像：seek 原片 → canvas 合成（轉場／標題／淡入淡出）→ VideoEncoder
   音訊：OfflineAudioContext 離線混音（原聲／靜音／配樂／交叉淡化）→ AudioEncoder
   ========================================================================== */
'use strict';

let cancelExport = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Chrome 會把背景分頁的 setTimeout 最短間隔壓到 1 秒，用 setTimeout 讓出控制權的話，
   切走分頁匯出就會慢十倍以上。MessageChannel 不受這個節流影響。 */
const yieldNow = (() => {
  const ch = new MessageChannel();
  const q = [];
  ch.port1.onmessage = () => { const r = q.shift(); if (r) r(); };
  return () => new Promise(res => { q.push(res); ch.port2.postMessage(0); });
})();

/** 等編碼器把佇列消化掉。優先用 dequeue 事件，沒有就退回不被節流的 yield 迴圈 */
function drain(enc, max){
  if (enc.encodeQueueSize <= max) return Promise.resolve();
  if (typeof enc.addEventListener === 'function'){
    return new Promise(res => {
      const h = () => {
        if (enc.encodeQueueSize <= max){ enc.removeEventListener('dequeue', h); res(); }
      };
      enc.addEventListener('dequeue', h);
      h();
    });
  }
  return (async () => { while (enc.encodeQueueSize > max) await yieldNow(); })();
}

function mShow(title, sub){
  $('#mask').classList.add('on');
  $('#mTitle').textContent = title;
  $('#mSub').textContent = sub || '';
  $('#mBar').style.width = '0%';
  $('#mLog').textContent = '準備中…';
  $('#mCancel').classList.remove('hide');
  $('#mClose').classList.add('hide');
  $('#mClose').textContent = '完成';
}
function mProg(pct, log){
  $('#mBar').style.width = clamp(pct, 0, 100).toFixed(1) + '%';
  if (log) $('#mLog').textContent = log;
}
function mDone(title, sub, log){
  $('#mTitle').textContent = title;
  $('#mSub').textContent = sub;
  $('#mLog').innerHTML = log;
  $('#mBar').style.width = '100%';
  $('#mCancel').classList.add('hide');
  $('#mClose').classList.remove('hide');
}

/* 完成編碼後再由使用者按儲存，保留原生檔案選擇器要求的 user activation。
   Windows 另存視窗負責同名覆蓋確認；取消／拒絕覆蓋時不取得 handle，也不寫檔。 */
function offerExportSave(blob, name){
  const box = document.createElement('div');
  box.style.marginTop = '16px';
  const status = document.createElement('div');
  status.className = 'hint'; status.style.marginTop = '10px';
  status.setAttribute('role', 'status');
  if (typeof window.showSaveFilePicker !== 'function'){
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    status.textContent = '此瀏覽器不支援選擇儲存位置，已交由瀏覽器下載。';
    box.append(status); $('#mLog').append(box);
    return;
  }
  $('#mClose').textContent = '關閉';
  const button = document.createElement('button');
  button.id = 'mSaveExport'; button.className = 'pri';
  button.textContent = '選擇位置並儲存';
  const help = document.createElement('div');
  help.className = 'hint'; help.style.marginTop = '10px';
  help.textContent = '選擇資料夾與檔名；同名檔案會詢問是否覆蓋，不覆蓋請改名。';
  status.id = 'mSaveStatus';
  status.textContent = '影片已編碼完成，尚未儲存。';
  box.append(button, help, status); $('#mLog').append(box);
  button.onclick = async () => {
    if (button.disabled) return;
    button.disabled = true; $('#mClose').disabled = true;
    let stream = null;
    try {
      const ext = blob.type === 'video/webm' ? '.webm' : '.mp4';
      const fh = await window.showSaveFilePicker({
        id:'nivedit-exports', suggestedName:name, excludeAcceptAllOption:true,
        types:[{description:ext === '.mp4' ? 'MP4 video' : 'WebM video', accept:{[blob.type]:[ext]}}]
      });
      status.textContent = '正在儲存影片…';
      stream = await fh.createWritable();
      await stream.write(blob);
      await stream.close(); stream = null;
      name = fh.name;
      const savedName = document.createElement('span');
      savedName.setAttribute('data-nt', ''); savedName.textContent = name;
      $('#mSub').replaceChildren(savedName);
      $('#mTitle').textContent = '匯出完成';
      $('#mClose').textContent = '完成';
      status.textContent = '影片已儲存。';
      toast('影片已儲存。');
    } catch(err){
      if (stream){ try { await stream.abort(); } catch(e){} }
      status.textContent = err.name === 'AbortError'
        ? '已取消本次儲存，可重新選擇位置或改名。'
        : '儲存失敗，可重試；影片不需重新編碼。';
      if (err.name !== 'AbortError') toast(L('儲存失敗：') + (err.message || err), true);
    } finally {
      button.disabled = false; $('#mClose').disabled = false;
    }
  };
}

/* ── 編碼器能力偵測 ────────────────────────────────────────── */
async function probe(){
  const { w, h, fps, bitrate } = A.proj;
  const br = Math.round(bitrate * 1e6);
  const out = { video:null, audio:null, container:null, note:'' };

  const avcCands = ['avc1.640034','avc1.640028','avc1.4D4028','avc1.42E028','avc1.4D401F','avc1.42E01E'];
  // 先把所有 profile 都用「要硬體」問過一輪，再退而求其次問軟體。
  // 原本是外層跑 profile、內層跑硬體/軟體，結果會變成
  // 「寧可用軟體跑 High 5.2，也不用硬體跑 Main」—— 那會慢非常多。
  for (const acc of ['prefer-hardware','no-preference']){
    for (const codec of avcCands){
      const cfg = { codec, width:w, height:h, bitrate:br, framerate:fps,
                    hardwareAcceleration:acc, avc:{ format:'avc' } };
      try {
        if ((await VideoEncoder.isConfigSupported(cfg)).supported){
          out.video = cfg; out.hw = (acc === 'prefer-hardware'); break;
        }
      } catch(e){}
    }
    if (out.video) break;
  }
  const aacCfg = { codec:'mp4a.40.2', sampleRate:48000, numberOfChannels:2, bitrate:192000 };
  let aacOk = false;
  try { aacOk = (await AudioEncoder.isConfigSupported(aacCfg)).supported; } catch(e){}

  if (out.video && aacOk){
    out.audio = aacCfg; out.container = 'mp4';
    return out;
  }

  // 退路：VP9 + Opus → WebM
  const vp9 = { codec:'vp09.00.10.08', width:w, height:h, bitrate:br, framerate:fps,
                hardwareAcceleration:'prefer-hardware' };
  const opus = { codec:'opus', sampleRate:48000, numberOfChannels:2, bitrate:128000 };
  let vp9Ok = false, opusOk = false;
  try { vp9Ok  = (await VideoEncoder.isConfigSupported(vp9)).supported; } catch(e){}
  if (!vp9Ok){                                   // 沒有硬體 VP9 就退回軟體
    delete vp9.hardwareAcceleration;
    try { vp9Ok = (await VideoEncoder.isConfigSupported(vp9)).supported; } catch(e){}
    out.hw = false;
  } else out.hw = true;
  try { opusOk = (await AudioEncoder.isConfigSupported(opus)).supported; } catch(e){}
  if (vp9Ok && opusOk){
    out.video = vp9; out.audio = opus; out.container = 'webm';
    out.note = 'H.264/AAC 在這台電腦上不可用，已改用 WebM（VP9 + Opus）。YouTube 可以接受，但 Instagram Reels 通常不吃 WebM。';
    return out;
  }
  if (out.video){
    out.audio = null; out.container = 'mp4';
    out.note = 'AAC 編碼器不可用，這次匯出「沒有聲音軌」。部分平台（尤其 Instagram）可能拒收無音軌的影片。';
    return out;
  }
  return null;
}

/* ── 影片 seek ─────────────────────────────────────────────── */
function seekVideo(v, t){
  return new Promise(res => {
    const target = clamp(t, 0, Math.max(0, (v.duration || 0) - 0.03));
    if (!v.seeking && v.readyState >= 2 && Math.abs(v.currentTime - target) < 0.0015) return res();
    let done = false;
    const ok = () => { if (done) return; done = true; v.removeEventListener('seeked', ok); res(); };
    v.addEventListener('seeked', ok, { once:true });
    try { v.currentTime = target; } catch(e){ return ok(); }
    setTimeout(ok, 800);
  });
}

let _healLog = [];

/* ── 畫布汙染防治 ──────────────────────────────────────────
   NiVedit 的素材一律來自 URL.createObjectURL(File)，blob 網址本來就同源，
   不需要 CORS。但 file:// 開的頁面沒有正常來源，這時候多設一個
   crossOrigin='anonymous' 反而會讓 CORS 檢查過不了 —— 畫面照放，
   畫布卻被標記成「被跨來源資料汙染」，之後 new VideoFrame(canvas) 永遠失敗。

   不同瀏覽器／開啟方式的行為不一樣，與其賭一邊，不如實際驗：
   畫到 4×4 小畫布上再讀回來，讀得到才算乾淨。髒的就兩種設法都重建試一次。
   ─────────────────────────────────────────────────────────── */

/** 等到真的有畫面可以驗（readyState<2 時 drawImage 什麼都不畫，驗不出髒不髒） */
function elReady(el){
  if (!el) return Promise.resolve();
  if (el.tagName === 'IMG') return el.complete ? Promise.resolve()
    : new Promise(r => { el.addEventListener('load', r, { once:true });
                         el.addEventListener('error', r, { once:true }); setTimeout(r, 4000); });
  if (el.readyState >= 2) return Promise.resolve();
  return new Promise(r => { const ok = () => { el.removeEventListener('loadeddata', ok); r(); };
                            el.addEventListener('loadeddata', ok); setTimeout(r, 5000); });
}
/** 這個元素畫上去會不會弄髒畫布？ */
function isTainting(el){
  if (!el) return false;
  try {
    const cv = document.createElement('canvas'); cv.width = 4; cv.height = 4;
    const g = cv.getContext('2d', { willReadFrequently:true });
    g.drawImage(el, 0, 0, 4, 4);
    g.getImageData(0, 0, 1, 1);
    return false;
  } catch(e){ return true; }
}
/** 建一個素材元素。co=true 就設 crossOrigin。 */
function mkEl(kind, url, co){
  return new Promise((res, rej) => {
    if (kind === 'image'){
      const im = new Image();
      if (co) im.crossOrigin = 'anonymous';
      const clr = () => { im.onload = null; im.onerror = null; };
      im.onload = () => { clr(); res(im); };
      im.onerror = () => { clr(); rej(new Error('圖片載入失敗')); };
      im.src = url;
      return;
    }
    const v = document.createElement('video');
    if (co) v.crossOrigin = 'anonymous';
    v.src = url; v.preload = 'auto'; v.playsInline = true; v.muted = true;
    const clr = () => { v.onloadedmetadata = null; v.onerror = null; };
    v.onloadedmetadata = () => { clr(); res(v); };
    v.onerror = () => { clr(); rej(new Error('影片載入失敗')); };
    $('#videoPool').appendChild(v);
    setTimeout(() => rej(new Error('載入逾時')), 15000);
  });
}

/** 匯出前跑一次：把會弄髒畫布的素材換成乾淨的。回傳做了什麼，方便回報。 */
async function healSources(){
  const report = [];
  const items = A.clips.map(c => ({ o:c, kind: c.video ? 'video' : (c.img ? 'image' : null) }))
    .concat(A.overlays.map(o => ({ o, kind:'image' })));

  for (const { o, kind } of items){
    if (!kind) continue;
    const cur = kind === 'video' ? o.video : o.img;
    if (!cur) continue;
    await elReady(cur);
    if (!isTainting(cur)){ report.push(`${o.name}：本來就乾淨`); continue; }
    if (!o.file){ report.push(`${o.name}：髒，但沒有原始檔案可以重建`); continue; }

    let done = false;
    // blob 網址同源，正常情況「不設 crossOrigin」才對；設了反而過不了 CORS。
    // 但有些環境相反，所以兩種都試，哪個驗得過用哪個。
    for (const co of [false, true]){
      let nel = null;
      try {
        const url = URL.createObjectURL(o.file);
        nel = await mkEl(kind, url, co);
        await elReady(nel);
        if (isTainting(nel)){ try { nel.remove(); } catch(e){} continue; }
        if (kind === 'video'){
          try { cur.pause(); cur.remove(); } catch(e){}
          o.video = nel;
          nel.muted = cur.muted; nel.volume = cur.volume;
        } else o.img = nel;
        o.el = nel; o.url = url;
        o.audioBuf = null; o.audioTried = false; o._ab = null;   // 換了來源，聲音要重新解
        const m = MEDIA.get(o.id);
        if (m){ m.el = nel; m.url = url; if (kind === 'video') m.video = nel; else m.img = nel; }
        report.push(`${o.name}：重建成功（${co ? '有設' : '不設'} crossOrigin）`);
        done = true;
        break;
      } catch(e){ try { if (nel) nel.remove(); } catch(_){} }
    }
    if (!done) report.push(`${o.name}：兩種設法都還是髒的`);
  }
  return report;
}

/** 出事之後才跑：把真正弄髒畫布的素材名字找出來 */
function dirtyNames(){
  const out = [];
  for (const c of A.clips) if (isTainting(c.video || c.img)) out.push(c.name);
  for (const o of A.overlays) if (isTainting(o.img)) out.push(o.name);
  return out;
}

/* ── 旋轉校正 ──────────────────────────────────────────────
   影片檔可以把「顯示時要轉幾度」寫在容器的變換矩陣裡。<video> 元素會自動套用，
   但我們自己解出來的原始幀不會 —— 所以連續解碼那條路要自己補轉。

   問題是「該轉幾度」有好幾種寫法與慣例，光看矩陣猜，猜錯就是整段橫躺，
   而且要匯出完才看得到。與其猜，不如量：
   <video> 畫出來的是標準答案（瀏覽器一定套對了），拿解碼幀的四種轉法去比，
   哪一種最像就用哪一種。四張 64×64 的比對，成本可以忽略。
   ─────────────────────────────────────────────────────────── */
const _MINI = 64;
function miniOf(src, rot){
  const cv = document.createElement('canvas');
  cv.width = _MINI; cv.height = _MINI;
  const g = cv.getContext('2d', { alpha:false, willReadFrequently:true });
  g.fillStyle = '#000'; g.fillRect(0, 0, _MINI, _MINI);
  const w = src.videoWidth || src.displayWidth || src.width || src.codedWidth;
  const h = src.videoHeight || src.displayHeight || src.height || src.codedHeight;
  if (!w || !h) return null;
  const r = ((rot || 0) % 360 + 360) % 360;
  g.translate(_MINI / 2, _MINI / 2);
  if (r) g.rotate(r * Math.PI / 180);
  // 一律拉滿整格：只比「內容的方向」，不比長寬比
  const dw = (r % 180) ? _MINI : _MINI, dh = _MINI;
  try { g.drawImage(src, -dw / 2, -dh / 2, dw, dh); } catch(e){ return null; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  try { return g.getImageData(0, 0, _MINI, _MINI).data; } catch(e){ return null; }
}
function mae(a, b){
  if (!a || !b) return Infinity;
  let s = 0, n = 0;
  for (let i = 0; i < a.length; i += 4){ s += Math.abs(a[i] - b[i]) + Math.abs(a[i+1] - b[i+1]) + Math.abs(a[i+2] - b[i+2]); n += 3; }
  return s / n;
}

/** 拿「已經解出來的那一幀」跟 <video> 在同一時間點的畫面比，量出該轉幾度。
    刻意不自己去解幀 —— 解碼器不能倒帶，多解一次就要整個重建，風險比較大。
    回傳 { rot, errs } 或 null（比不出來）。 */
async function calibrateRot(c, fs, t){
  const raw = fs.cur;                   // frameAt 會把「還沒轉」的原始幀留在這裡
  if (!raw) return null;
  try { await seekVideo(c.video, t); } catch(e){}
  const ref = miniOf(c.video, 0);       // <video> 已經是轉好的，這就是標準答案
  if (!ref) return null;
  const errs = {};
  let best = 0, bestE = Infinity;
  for (const r of [0, 90, 180, 270]){
    const e = mae(ref, miniOf(raw, r));
    errs[r] = Math.round(e * 10) / 10;
    if (e < bestE){ bestE = e; best = r; }
  }
  return { rot: best, errs, err: bestE };
}

/** 一鍵診斷：把每一段實際走哪條路、判到幾度、有沒有汙染全部列出來。
    出問題時複製貼過來就不用再猜。 */

  const L = layout();
  const out = [];
  const say = x => out.push(x);

      `轉場=${A.clips.map(c=>clipMode(c)).join('/')} 總長=${totalDur().toFixed(2)}s ` +
      `片段=${A.clips.length} 標題=${A.titles.length} 字幕=${A.subs.length} 疊圖=${A.overlays.length}`);
  for (let i = 0; i < A.clips.length; i++){
    const c = A.clips[i];

    try { await elReady(el); } catch(e){}
    say(`   元素 ${el ? el.tagName : '無'} ` +
        `${el && el.videoWidth ? el.videoWidth + 'x' + el.videoHeight : ''} ` +
        `readyState=${el ? el.readyState : '-'} crossOrigin=${el ? String(el.crossOrigin) : '-'} ` +
        `汙染=${isTainting(el) ? '是' : '否'}`);
    say(`   片段 w/h=${c.w}x${c.h} 自訂旋轉=${c.rot || 0}° 裁切=${(+c.inP).toFixed(2)}~${(+c.outP).toFixed(2)} ` +
        `靜音=${!!c.muted} 音量=${c.vol} 轉場=${c.trans ? c.trans.type : '-'}`);
    say(`   檔案 ${c.file ? c.file.size + ' bytes ' + (c.file.type || '未知型別') : '無'}`);
    if (c.video){
      let fs = null, err = '';
      try { fs = await FrameSource.create(c); } catch(e){ err = String(e && e.message || e); }
      if (!fs){ say(`   取幀 逐幀 seek（連續解碼不可用${err ? '：' + err : ''}）`); }
      else {
        let f = null, e2 = '';
        try { f = await fs.frameAt(c.inP + 0.1); } catch(e){ e2 = String(e && e.message || e); }
        const fw = f ? (f.width || f.displayWidth) : 0, fh = f ? (f.height || f.displayHeight) : 0;
        say(`   取幀 連續解碼　自動轉正=${fs.rot}°　封包=${fs.samples.length}`);
        say(`   第一幀 ${f ? f.constructor.name : '取不到'} ${f ? fw + 'x' + fh : ''}${e2 ? ' ' + e2 : ''}`);
        try { fs.close(); } catch(e){}
      }
    }
  }
  return out.join('\n');
}

/* ── 音訊：解碼素材 ────────────────────────────────────────── */
/* 依取樣率分開快取。
   AI 字幕是用 16kHz 的 OfflineAudioContext 解的，匯出是 48kHz；
   共用同一格快取的話，產過字幕之後匯出就會拿到 16kHz 的版本，聲音會悶掉。 */
async function getClipAudio(c, ac){
  const sr = ac.sampleRate | 0;
  if (!c._ab) c._ab = {};
  if (sr in c._ab) return c._ab[sr];
  let buf = null;
  try { buf = await ac.decodeAudioData(await c.file.arrayBuffer()); }
  catch(e){
    // 讀不到多半是素材參照失效了，接回來再試一次 —— 這就是以前「聲音不見」的地方
    console.warn('[音訊] 「' + c.name + '」第一次解碼失敗：' + (e && e.message));
    try {
      if (typeof revalidateMedia === 'function') await revalidateMedia();
      buf = await ac.decodeAudioData(await c.file.arrayBuffer());
      console.info('[音訊] 「' + c.name + '」重新接上素材後解碼成功');
    } catch(e2){ console.warn('[音訊] 「' + c.name + '」還是解不出來：' + (e2 && e2.message)); }
  }
  // 上面重新接素材時會把 _ab 清掉，所以這裡要再確認一次才寫得進去
  if (!c._ab) c._ab = {};
  c._ab[sr] = buf;
  if (sr === 48000){ c.audioBuf = buf; c.audioTried = true; }   // 舊欄位維持相容
  return buf;
}
async function getMusicAudio(ac, m){
  if (!m) return null;
  if (m.buf) return m.buf;
  try { m.buf = await ac.decodeAudioData(await m.file.arrayBuffer()); }
  catch(e){ m.buf = null; }
  return m.buf;
}

/* ── 音訊：離線混音 ────────────────────────────────────────── */
async function buildAudio(total){
  const sr = 48000;
  const oc = new OfflineAudioContext(2, Math.max(sr / 10, Math.ceil(total * sr)), sr);
  const master = oc.createGain();
  master.gain.value = 1;
  master.connect(oc.destination);

  const L = layout();
  for (let i = 0; i < A.clips.length; i++){
    const c = A.clips[i];
    if (c.muted || c.vol <= 0) continue;
    const buf = await getClipAudio(c, oc);
    if (!buf) continue;
    const st = L[i].start, d = Math.min(L[i].dur, Math.max(0, buf.duration - c.inP));
    if (d <= 0.01) continue;
    const g = oc.createGain();
    // 這一段有沒有設「離開時的轉場」。有的話尾巴用它的曲線收掉，
    // 就不要再套接縫的交叉淡化了，兩條曲線疊在一起會互相打架。
    const ow = (typeof outWindow === 'function') ? outWindow(i, L) : null;
    if(L[i].add){
      const e=Math.min(.04,d/4);
      g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(c.vol,st+e);
      g.gain.setValueAtTime(c.vol,st+d-e);g.gain.linearRampToValueAtTime(0.0001,st+d);
    }else{
      const head=L[i].inDur;
      g.gain.setValueAtTime(head>0?0.0001:c.vol,st);
      if(head>0)g.gain.linearRampToValueAtTime(c.vol,st+head);
      if(ow){g.gain.setValueAtTime(c.vol,Math.max(st+head,ow.start));g.gain.linearRampToValueAtTime(0.0001,ow.end);}
    }
    const src = oc.createBufferSource();
    src.buffer = buf;
    const fade=oc.createGain(),q=L[i];
    const [fi,fo]=c.fadeAudio===false?[0,0]:clipFadeLens(c,q.span);
    fade.gain.setValueAtTime(fi>0?0:1,q.startAt);
    if(fi>0)fade.gain.linearRampToValueAtTime(1,q.startAt+fi);
    if(fo>0){
      fade.gain.setValueAtTime(1,q.end-fo);
      fade.gain.linearRampToValueAtTime(0,q.end);
    }
    src.connect(g);g.connect(fade);fade.connect(master);
    src.start(st, c.inP, d);
  }

  for (const m of A.musics){
    if (m.vol <= 0) continue;
    const mb = await getMusicAudio(oc, m);
    if (mb){
      const off  = clamp(m.offset, 0, Math.max(0, mb.duration - 0.05));
      const seg  = Math.max(0.5, mb.duration - off);        // 一輪可用長度
      const st0  = clamp(m.startAt, 0, Math.max(0, total - 0.05));
      const span = Math.min(m.len, total - st0);
      const xf   = m.loop ? clamp(m.xfade, 0, Math.min(3, seg / 3)) : 0;
      const step = Math.max(0.2, seg - xf);
      const reps = m.loop ? Math.max(1, Math.ceil((span - xf) / step)) : 1;

      // 配樂總音量與淡入淡出（相對於配樂自己的起訖）
      const mg = oc.createGain();
      // 音量曲線獨立一顆 gain，才不會跟上面的淡入淡出自動化打架。
      // 這裡畫的線必須跟預覽的 musicGainAt 完全一樣：段前段後保持水平，
      // 點與點之間直線內插。
      const vk = m.vk || [];
      if (vk.length){
        const vg = oc.createGain();
        mg.connect(vg); vg.connect(master);
        let at = clamp(st0, 0, total);
        vg.gain.setValueAtTime(clamp(vk[0].v, 0, 1), at);
        for (const q of vk){
          const t = Math.max(at, clamp(st0 + q.t, 0, total));
          vg.gain.linearRampToValueAtTime(clamp(q.v, 0, 1), t);
          at = t;
        }
        const endT = Math.max(at + 1e-3, Math.min(total, st0 + span));
        vg.gain.linearRampToValueAtTime(clamp(vk[vk.length - 1].v, 0, 1), endT);
      } else {
        mg.connect(master);
      }
      const v = m.vol, mfi = Math.min(m.fadeIn, span / 2), mfo = Math.min(m.fadeOut, span / 2);
      mg.gain.setValueAtTime(mfi > 0 ? 0.0001 : v, st0);
      if (mfi > 0) mg.gain.linearRampToValueAtTime(v, st0 + mfi);
      if (mfo > 0){
        mg.gain.setValueAtTime(v, st0 + span - mfo);
        mg.gain.linearRampToValueAtTime(0.0001, st0 + span);
      }

      for (let r = 0; r < reps; r++){
        const at = st0 + r * step;
        if (at >= st0 + span - 0.02) break;
        const d = Math.min(seg, st0 + span - at);
        if (d <= 0.05) break;
        const g = oc.createGain();
        g.gain.setValueAtTime(r > 0 && xf > 0 ? 0.0001 : 1, at);      // 循環接縫交叉淡化
        if (r > 0 && xf > 0) g.gain.linearRampToValueAtTime(1, at + xf);
        if (xf > 0 && r < reps - 1 && d > xf){
          g.gain.setValueAtTime(1, at + d - xf);
          g.gain.linearRampToValueAtTime(0.0001, at + d);
        }
        const src = oc.createBufferSource();
        src.buffer = mb;
        src.connect(g); g.connect(mg);
        src.start(at, off, d);
      }
    }
  }
  return oc.startRendering();
}

/* ── 主流程 ────────────────────────────────────────────────── */
async function startExport(){
  if (A.exporting) return;
  if (!A.clips.length){ toast('先加入影片再匯出', true); return; }
  if (typeof VideoEncoder === 'undefined'){ toast('這個瀏覽器不支援 WebCodecs，請改用 Chrome 或 Edge', true); return; }

  const total = totalDur();
  if (total < 0.1){ toast('影片長度太短', true); return; }

  setPlaying(false);
  A.exporting = true; cancelExport = false;
  $('#mCancel').onclick = () => { cancelExport = true; $('#mLog').textContent = '取消中…'; };
  $('#mClose').onclick = () => { $('#mask').classList.remove('on'); };
  mShow('匯出中', '正在確認編碼器…');

  const { w, h, fps } = A.proj;
  const nFrames = Math.max(1, Math.round(total * fps));
  const t0 = performance.now();

  try {
    // 上一輪如果有畫布被汙染，這裡先全部換新的，才不會一路失敗到重新整理為止
    if (typeof resetBuffers === 'function') resetBuffers();
    // 先實測每個素材會不會弄髒畫布，髒的就當場換掉（見 healSources 的說明）
    mProg(1, '檢查素材…');
    // 素材參照有沒有失效（檔案被搬走／被存檔蓋掉）。壞了就接回來，接不回來要講清楚。
    if (typeof revalidateMedia === 'function'){
      const rv = await revalidateMedia();
      if (rv.fixed) _healLog.push(`重新接上 ${rv.fixed} 個失效的素材參照`);
      if (!rv.ok && rv.lost.length)
        throw new Error('這些素材已經讀不到了：' + rv.lost.join('、') +
          '。多半是檔案被搬走、改名，或專案檔被別的程式改過。' +
          '請重新開啟專案，或把素材重新拖進來。');
    }
    const heal = await healSources();
    _healLog = heal;
    console.info('[匯出] 素材檢查：\n  ' + heal.join('\n  '));
    let msDecode = 0, msRender = 0, msEncode = 0;   // 分段計時，才知道慢在哪一段
    const cap = await probe();
    if (!cap) throw new Error('這台電腦的瀏覽器找不到可用的影片編碼器（H.264 與 VP9 都不支援）');

    /* 1) 音訊先做，因為要在建立 muxer 前知道有沒有音軌 */
    let pcm = null;
    if (cap.audio){
      mProg(2, '混音中…');
      pcm = await buildAudio(total);
    }

    /* 2) 建立 muxer */
    const isMp4 = cap.container === 'mp4';
    const NS = isMp4 ? Mp4Muxer : WebMMuxer;
    const target = new NS.ArrayBufferTarget();
    const muxer = new NS.Muxer(Object.assign({
      target,
      video: isMp4
        ? { codec:'avc', width:w, height:h, frameRate:fps }
        : { codec:'V_VP9', width:w, height:h, frameRate:fps },
      audio: cap.audio
        ? (isMp4 ? { codec:'aac', numberOfChannels:2, sampleRate:48000 }
                 : { codec:'A_OPUS', numberOfChannels:2, sampleRate:48000 })
        : undefined,
      firstTimestampBehavior: 'offset'
    }, isMp4 ? { fastStart:'in-memory' } : {}));

    /* 3) 影像編碼 */
    let encErr = null;
    const vEnc = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encErr = e; }
    });
    vEnc.configure(cap.video);

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { alpha:false });

    A.clips.forEach(c => { if (c.video){ c.video.pause(); c.video.muted = true; } c.exportSrc = null; });

    /* 連續解碼：能拆解的片段走快路，拆不開的自動退回逐幀 seek */
    mProg(4, '準備解碼器…');
    const srcs = new Map();
    let vidN = 0;
    for (const c of A.clips){
      if (!c.video) continue;
      vidN++;
      if (cancelExport) break;
      const fsrc = await FrameSource.create(c);
      if (fsrc) srcs.set(c.id, fsrc);
      else _healLog.push(`${c.name}：拆解不開，用逐幀 seek`);
    }
    const fastN = srcs.size;
    const pickFrame = async ref => {
      const c = ref.clip;
      const fsrc = srcs.get(c.id);
      if (fsrc){
        const f = await fsrc.frameAt(ref.t);
        if (f){
          // 第一次拿到畫面時，跟 <video>（瀏覽器已經轉好的）比一次，
          // 確認「該轉幾度」真的算對了。算錯就當場改，不用等匯完才發現。
          if (!fsrc.calDone){
            fsrc.calDone = true;
            const cal = await calibrateRot(c, fsrc, ref.t);
            if (!cal) _healLog.push(`${c.name}：轉正角度比對不出來，沿用 ${fsrc.rot}°`);
            else if (cal.rot !== fsrc.rot){
              _healLog.push(`${c.name}：矩陣說 ${fsrc.rot}°，實測 ${cal.rot}°，以實測為準 ${JSON.stringify(cal.errs)}`);
              fsrc.rot = cal.rot; fsrc.rts = -1;
              c.exportSrc = fsrc._upright(fsrc.cur);       // 用修正後的角度重畫這一幀
              return;
            } else _healLog.push(`${c.name}：轉正 ${cal.rot}° 已實測確認`);
          }
          c.exportSrc = f; return;
        }
        srcs.delete(c.id); fsrc.close();      // 取不到幀就退回 seek
        _healLog.push(`${c.name}：連續解碼取不到畫面，改用逐幀 seek（會比較慢）`);
      }
      c.exportSrc = null;
      if (c.video) await seekVideo(c.video, ref.t);
    };
    A.musics.forEach(m => m.el.pause());

    const gop = Math.max(1, Math.round(fps * 2));
    for (let f = 0; f < nFrames; f++){
      if (cancelExport) throw new Error('__cancel__');
      if (encErr) throw encErr;
      const T = f / fps;

      let _t = performance.now();
      for (const act of activeTracksAt(T)){                                   // 圖片片段不用取幀，直接畫
        if (act.a.clip.video) await pickFrame(act.a);
        if (act.b && act.b.clip.video) await pickFrame(act.b);
      }
      msDecode += performance.now() - _t;

      _t = performance.now();
      renderFrame(ctx, T, w, h);
      msRender += performance.now() - _t;
      _t = performance.now();

      let frame;
      try {
        frame = new VideoFrame(cv, {
          timestamp: Math.round(f * 1e6 / fps),
          duration: Math.round(1e6 / fps)
        });
      } catch(e){
        // 「tainted」＝畫布被跨來源素材汙染。多半是某個影片或圖片載進來時
        // 沒有走 CORS，畫上去之後這塊畫布就永遠不能再轉成影格。
        if (/tainted/i.test(e.message || '')){
          // 這時候素材都已經畫過了，可以直接一個一個驗，不用猜
          const names = dirtyNames();
          throw new Error('有素材讓畫面無法轉成影片影格'
            + (names.length ? `：${names.join('、')}` : '（查不出是哪一個）')
            + '。\n素材檢查結果：\n' + _healLog.map(x => '· ' + x).join('\n'));
        }
        throw e;
      }
      vEnc.encode(frame, { keyFrame: f % gop === 0 });
      frame.close();
      // 讓編碼器手上多排一點，編碼才能跟合成重疊；卡太緊會變成一格一格輪流等
      await drain(vEnc, 14);
      msEncode += performance.now() - _t;

      if (f % 3 === 0 || f === nFrames - 1){
        const pct = (f + 1) / nFrames * 90;
        const el = (performance.now() - t0) / 1000;
        const eta = f > 4 ? Math.round(el / (f + 1) * (nFrames - f - 1)) : null;
        mProg(pct, `影格 ${f+1} / ${nFrames}　已用 ${Math.round(el)} 秒` +
              (eta !== null ? `　預估剩 ${eta} 秒` : '') +
              `　${(f + 1) / Math.max(0.001, el) | 0} fps`);
        await yieldNow();          // 不要用 setTimeout，背景分頁會被節流到 1 秒
      }
    }
    await vEnc.flush();
    vEnc.close();

    /* 4) 音訊編碼 */
    if (cap.audio && pcm){
      mProg(93, '編碼音訊…');
      let aErr = null;
      const aEnc = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => { aErr = e; }
      });
      aEnc.configure(cap.audio);
      const sr = pcm.sampleRate, len = pcm.length;
      const L0 = pcm.getChannelData(0);
      const R0 = pcm.numberOfChannels > 1 ? pcm.getChannelData(1) : L0;
      const CH = 1024;
      for (let off = 0; off < len; off += CH){
        if (cancelExport) throw new Error('__cancel__');
        if (aErr) throw aErr;
        const n = Math.min(CH, len - off);
        const data = new Float32Array(n * 2);
        data.set(L0.subarray(off, off + n), 0);
        data.set(R0.subarray(off, off + n), n);
        const ad = new AudioData({
          format:'f32-planar', sampleRate:sr, numberOfFrames:n, numberOfChannels:2,
          timestamp: Math.round(off / sr * 1e6), data
        });
        aEnc.encode(ad); ad.close();
        await drain(aEnc, 12);
      }
      await aEnc.flush();
      aEnc.close();
    }

    /* 5) 封裝下載 */
    mProg(98, '封裝檔案…');
    muxer.finalize();
    const ext = isMp4 ? 'mp4' : 'webm';
    const blob = new Blob([target.buffer], { type: isMp4 ? 'video/mp4' : 'video/webm' });
    const name = `NiVedit_${new Date().toISOString().slice(0,19).replace(/[:T-]/g,'').slice(0,14)}.${ext}`;

    const mb = (blob.size / 1048576).toFixed(1);
    const secs = Math.round((performance.now() - t0) / 1000);
    const speed = fastN === vidN && vidN > 0 ? '連續解碼'
                : fastN > 0 ? `連續解碼 ${fastN}/${vidN} 段，其餘逐幀`
                : '逐幀模式';
    const codecName = isMp4
      ? `MP4（H.264${cap.audio ? ' + AAC' : '，無音軌'}）`
      : 'WebM（VP9 + Opus）';
    mDone(typeof window.showSaveFilePicker === 'function' ? '影片編碼完成' : '匯出完成',
      `${name}`,
      `${codecName}　${w}×${h}　${fps}fps　${mb} MB　耗時 ${secs} 秒` +
      `　${speed}　${cap.hw ? '硬體編碼' : '軟體編碼'}　平均 ${(nFrames/Math.max(1,secs))|0} fps` +
      `<br><span style="color:var(--fg3)">每格花費：取幀 ${(msDecode/nFrames).toFixed(1)} ms　`+
      `合成 ${(msRender/nFrames).toFixed(1)} ms　編碼 ${(msEncode/nFrames).toFixed(1)} ms　`+
      `（合計 ${((msDecode+msRender+msEncode)/nFrames).toFixed(1)} ms）</span>` +
      (cap.note ? `<br><br><span style="color:var(--warn)">⚠ ${cap.note}</span>` : ''));
    offerExportSave(blob, name);
    toast(typeof window.showSaveFilePicker === 'function' ? '影片編碼完成，請選擇位置儲存。' : '匯出完成');

  } catch(err){
    if (String(err.message) === '__cancel__'){
      $('#mask').classList.remove('on');
      toast('已取消匯出');
    } else {
      console.error(err);
      mDone('匯出失敗', '', `<span style="color:var(--danger)">${esc(err.message || err)}</span>`);
    }
  } finally {
    try { for (const fsrc of (typeof srcs !== 'undefined' ? srcs.values() : [])) fsrc.close(); } catch(e){}
    A.clips.forEach(c => { c.exportSrc = null; });
    A.exporting = false;
    if (typeof markDirty === 'function') markDirty(700);   // 匯出時預覽被借去用了，回來要重畫
    _last = performance.now();
  }
}

/* ── 啟動 ──────────────────────────────────────────────────── */
let _booted = false;
function boot(){ if (_booted) return; _booted = true; initUI(); }
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
</body></html>
